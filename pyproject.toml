[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geolog-gasratio-pixler"
version = "0.7.93"
description = "Desktop workbench for LAS, gas ratio, Pixler profiles and geological masterlogs"
authors = [
  { name = "Rinat Sarmuldin", email = "ura07srr@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PySide6>=6.6",
  "pyqtgraph>=0.13.7",
  "lasio>=0.31",
  "openpyxl>=3.1",
  "Pillow>=12.3,<13",
  "PyMuPDF>=1.28,<2",
  "defusedxml>=0.7.1,<1",
  "tzdata>=2024.1",
  "websockets>=16,<17",
  "fastavro>=1.9,<2",
  "etptypes>=1.2,<2",
  "etpproto>=1.0.7,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-defusedxml>=0.7.0,<1",
  "build>=1.2",
  "setuptools>=69",
  "wheel>=0.43",
  "Pillow>=10.0"
]
security = [
  "pip-audit>=2.10,<3",
  "detect-secrets>=1.5,<2",
  "bandit>=1.8,<2"
]
analysis = ["scipy>=1.12", "pandas>=2.2", "pyarrow>=15"]

[project.scripts]
geolog-gasratio-pixler = "geoworkbench.app.main:main"
geoworkbench = "geoworkbench.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geoworkbench = [
  "resources/*.json", "resources/*.png", "resources/i18n/*.json",
  "resources/constructor_assets/*/*.json",
  "resources/constructor_assets/*/originals/*.bmp",
  "resources/constructor_assets/*/thumbnails/*.png",
  "resources/constructor_assets/*/transparent/*.png",
  "resources/wits/profiles/*.json",
  "resources/wits/catalogs/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Minimal enforceable baseline: import placement, syntax, names and Pyflakes correctness.
select = ["E4", "E7", "E9", "F"]

[[tool.mypy.overrides]]
module = ["lasio", "pyqtgraph", "fitz", "PIL", "PIL.*"]
ignore_missing_imports = true
