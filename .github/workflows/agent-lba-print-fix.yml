name: Apply LBA and print cleanup fix

on:
  push:
    branches:
      - fix/lba-print-ci-cleanup

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply focused source fixes
        shell: bash
        env:
          PATCH_B64: 
          CONFTEST_B64: 
          CLEANUP_TEST_B64: 
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64
          import os
          import subprocess

          patch = base64.b64decode(os.environ["PATCH_B64"])
          Path("/tmp/lba-print-fix.patch").write_bytes(patch)
          subprocess.run(
              ["git", "apply", "--whitespace=nowarn", "/tmp/lba-print-fix.patch"],
              check=True,
          )
          Path("tests/conftest.py").write_bytes(
              base64.b64decode(os.environ["CONFTEST_B64"])
          )
          Path("tests/test_qt_cleanup.py").write_bytes(
              base64.b64decode(os.environ["CLEANUP_TEST_B64"])
          )
          Path(".github/workflows/agent-lba-print-fix.yml").unlink()
          PYCODE
          python -m compileall -q src tests
      - name: Commit fixed branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: compact LBA colour labels and restore clean CI"
          git push origin HEAD:fix/lba-print-ci-cleanup
