name: Apply adaptive visual editors

on:
  push:
    branches:
      - improve-adaptive-visual-editors
    paths:
      - scripts/apply_adaptive_visual_editors.py
      - .github/workflows/apply-adaptive-visual-editors.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve-adaptive-visual-editors
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply changes
        run: python scripts/apply_adaptive_visual_editors.py
      - name: Compile Python sources
        run: python -m compileall -q src/geoworkbench scripts
      - name: Remove one-shot files
        run: |
          rm scripts/apply_adaptive_visual_editors.py
          rm .github/workflows/apply-adaptive-visual-editors.yml
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Improve adaptive visual editors"
            git push origin HEAD:improve-adaptive-visual-editors
          fi
