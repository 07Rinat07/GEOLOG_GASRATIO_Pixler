name: Apply print header and logo catalogs

on:
  push:
    branches:
      - feature-print-header-logo-catalogs
    paths:
      - .automation/print-catalogs/**
      - .github/workflows/apply-print-header-logo-catalogs.yml

permissions:
  contents: write

jobs:
  apply-change:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply implementation and documentation
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/print-catalogs/patch.* | base64 --decode | gzip --decompress > /tmp/print-catalogs.patch
          cat .automation/print-catalogs/docs.* | base64 --decode | gzip --decompress > /tmp/update-docs.py
          git apply --3way --whitespace=error-all /tmp/print-catalogs.patch
          python /tmp/update-docs.py
          python -m compileall -q src tests
          rm -rf .automation/print-catalogs
          rm .github/workflows/apply-print-header-logo-catalogs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement print header and logo catalogs"
          git push origin HEAD
