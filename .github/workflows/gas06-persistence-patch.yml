name: GAS-06 persistence patch

on:
  push:
    branches:
      - feat/gas-conditioning-qc-persistence

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.event.head_commit.message == 'chore: apply GAS-06 persistence patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gas-conditioning-qc-persistence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply persistence slice
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, got {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/geoworkbench/domain/models.py",
              "    from geoworkbench.domain.lag_correction import LagCorrectionProfile\n",
              "    from geoworkbench.domain.gas_conditioning_qc import GasConditioningQcSummary\n"
              "    from geoworkbench.domain.lag_correction import LagCorrectionProfile\n",
          )
          replace_once(
              "src/geoworkbench/domain/models.py",
              "    source_revisions: list[DatasetSourceRevision] = field(default_factory=list)\n",
              "    source_revisions: list[DatasetSourceRevision] = field(default_factory=list)\n"
              "    gas_conditioning_qc: GasConditioningQcSummary | None = None\n",
          )

          replace_once(
              "src/geoworkbench/storage/project_codec.py",
              "from geoworkbench.domain.operational_events import (\n",
              "from geoworkbench.domain.gas_conditioning_qc import (\n"
              "    GasComponentConditioningQc,\n"
              "    GasConditioningQcInterval,\n"
              "    GasConditioningQcSummary,\n"
              ")\n\n"
              "from geoworkbench.domain.operational_events import (\n",
          )
          replace_once(
              "src/geoworkbench/storage/project_codec.py",
              "PROJECT_FORMAT_VERSION = 23\n",
              "PROJECT_FORMAT_VERSION = 24\n",
          )

          qc_decoder = '''

          def _required_qc_float(data: dict[str, Any], key: str) -> float:
              value = data.get(key)
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  raise ProjectFormatError(f"Поле QC '{key}' должно быть числом")
              return float(value)


          def _gas_conditioning_qc_interval_from_dict(
              data: object,
          ) -> GasConditioningQcInterval:
              if not isinstance(data, dict):
                  raise ProjectFormatError("QC-интервал кондиционирования должен быть объектом")
              _require_exact_keys(
                  data,
                  {"minimum_depth", "maximum_depth", "sample_count"},
                  "gas conditioning QC interval",
              )
              try:
                  return GasConditioningQcInterval(
                      minimum_depth=_required_qc_float(data, "minimum_depth"),
                      maximum_depth=_required_qc_float(data, "maximum_depth"),
                      sample_count=_required_int(data, "sample_count"),
                  )
              except (TypeError, ValueError) as exc:
                  raise ProjectFormatError("Некорректный QC-интервал кондиционирования") from exc


          def _gas_component_conditioning_qc_from_dict(
              data: object,
          ) -> GasComponentConditioningQc:
              if not isinstance(data, dict):
                  raise ProjectFormatError("QC газового компонента должен быть объектом")
              _require_exact_keys(
                  data,
                  {
                      "mnemonic",
                      "interpolated_sample_count",
                      "interpolated_intervals",
                      "max_gap",
                  },
                  "gas component conditioning QC",
              )
              raw_intervals = _required(data, "interpolated_intervals", list)
              max_gap = data.get("max_gap")
              if max_gap is not None and (
                  isinstance(max_gap, bool) or not isinstance(max_gap, (int, float))
              ):
                  raise ProjectFormatError("max_gap QC должен быть числом или null")
              try:
                  return GasComponentConditioningQc(
                      mnemonic=str(_required(data, "mnemonic", str)),
                      interpolated_sample_count=_required_int(
                          data, "interpolated_sample_count"
                      ),
                      interpolated_intervals=tuple(
                          _gas_conditioning_qc_interval_from_dict(item)
                          for item in raw_intervals
                      ),
                      max_gap=float(max_gap) if max_gap is not None else None,
                  )
              except (TypeError, ValueError) as exc:
                  raise ProjectFormatError("Некорректный QC газового компонента") from exc


          def _gas_conditioning_qc_from_dict(
              data: object,
          ) -> GasConditioningQcSummary | None:
              if data is None:
                  return None
              if not isinstance(data, dict):
                  raise ProjectFormatError("gas_conditioning_qc должен быть объектом или null")
              _require_exact_keys(
                  data,
                  {
                      "nominal_depth_step",
                      "affected_depth_row_count",
                      "interpolated_component_sample_count",
                      "components",
                  },
                  "gas conditioning QC summary",
              )
              raw_components = _required(data, "components", list)
              try:
                  return GasConditioningQcSummary(
                      nominal_depth_step=_required_qc_float(data, "nominal_depth_step"),
                      affected_depth_row_count=_required_int(
                          data, "affected_depth_row_count"
                      ),
                      interpolated_component_sample_count=_required_int(
                          data, "interpolated_component_sample_count"
                      ),
                      components=tuple(
                          _gas_component_conditioning_qc_from_dict(item)
                          for item in raw_components
                      ),
                  )
              except (TypeError, ValueError) as exc:
                  raise ProjectFormatError("Некорректный gas conditioning QC summary") from exc
          '''.replace("\n          ", "\n").lstrip("\n")

          replace_once(
              "src/geoworkbench/storage/project_codec.py",
              "\n\ndef _dataset_from_dict(data: dict[str, Any]) -> Dataset:\n",
              "\n\n" + qc_decoder + "\n\ndef _dataset_from_dict(data: dict[str, Any]) -> Dataset:\n",
          )
          replace_once(
              "src/geoworkbench/storage/project_codec.py",
              "            source_revisions=[\n"
              "                _dataset_source_revision_from_dict(item)\n"
              "                for item in raw_source_revisions\n"
              "            ],\n"
              "        )\n",
              "            source_revisions=[\n"
              "                _dataset_source_revision_from_dict(item)\n"
              "                for item in raw_source_revisions\n"
              "            ],\n"
              "            gas_conditioning_qc=_gas_conditioning_qc_from_dict(\n"
              "                data.get(\"gas_conditioning_qc\")\n"
              "            ),\n"
              "        )\n",
          )

          migration = '''

          def _migrate_v23_to_v24(payload: ProjectPayload) -> ProjectPayload:
              """Add a typed gas-conditioning QC slot to every dataset."""

              migrated = deepcopy(payload)
              project = migrated.get("project")
              if not isinstance(project, dict):
                  raise ProjectMigrationError("Проект версии 23 не содержит объекта 'project'")
              wells = project.get("wells", {})
              if not isinstance(wells, dict):
                  raise ProjectMigrationError("Проект версии 23 содержит некорректный wells")
              for well in wells.values():
                  if not isinstance(well, dict):
                      raise ProjectMigrationError("Некорректная скважина проекта версии 23")
                  datasets = well.get("datasets", {})
                  if not isinstance(datasets, dict):
                      raise ProjectMigrationError("Некорректные datasets проекта версии 23")
                  for dataset in datasets.values():
                      if not isinstance(dataset, dict):
                          raise ProjectMigrationError("Некорректный dataset проекта версии 23")
                      dataset.setdefault("gas_conditioning_qc", None)
              migrated["format_version"] = 24
              return migrated
          '''.replace("\n          ", "\n").lstrip("\n")

          replace_once(
              "src/geoworkbench/storage/project_migrations.py",
              "\n\ndef _migrate_scale_payload_to_linear(payload: dict[str, Any]) -> bool:\n",
              "\n\n" + migration + "\n\ndef _migrate_scale_payload_to_linear(payload: dict[str, Any]) -> bool:\n",
          )
          replace_once(
              "src/geoworkbench/storage/project_migrations.py",
              "DEFAULT_PROJECT_MIGRATIONS.register(22, _migrate_v22_to_v23)\n",
              "DEFAULT_PROJECT_MIGRATIONS.register(22, _migrate_v22_to_v23)\n"
              "DEFAULT_PROJECT_MIGRATIONS.register(23, _migrate_v23_to_v24)\n",
          )

          test_content = '''from __future__ import annotations

          import json

          import numpy as np
          import pytest

          from geoworkbench.domain.gas_conditioning_qc import (
              GasComponentConditioningQc,
              GasConditioningQcInterval,
              GasConditioningQcSummary,
          )
          from geoworkbench.domain.models import Dataset, DatasetKind, DepthDomain, Project, Well
          from geoworkbench.storage.atomic_json import save_project
          from geoworkbench.storage.project_codec import (
              PROJECT_FORMAT_VERSION,
              ProjectFormatError,
              load_project,
              project_document_from_dict,
          )
          from geoworkbench.storage.project_migrations import migrate_project_payload


          def _summary() -> GasConditioningQcSummary:
              return GasConditioningQcSummary(
                  nominal_depth_step=0.5,
                  affected_depth_row_count=3,
                  interpolated_component_sample_count=4,
                  components=(
                      GasComponentConditioningQc(
                          mnemonic="C1",
                          interpolated_sample_count=1,
                          interpolated_intervals=(
                              GasConditioningQcInterval(1000.5, 1000.5, 1),
                          ),
                          max_gap=1.0,
                      ),
                      GasComponentConditioningQc(
                          mnemonic="C2",
                          interpolated_sample_count=3,
                          interpolated_intervals=(
                              GasConditioningQcInterval(1001.0, 1002.0, 3),
                          ),
                          max_gap=1.5,
                      ),
                  ),
              )


          def _project_with_qc() -> Project:
              dataset = Dataset(
                  dataset_id="gas",
                  name="Gas",
                  kind=DatasetKind.GTI,
                  depth_domain=DepthDomain.MD,
                  depth=np.array([1000.0, 1000.5, 1001.0, 1001.5, 1002.0]),
                  gas_conditioning_qc=_summary(),
              )
              well = Well("well", "Well", datasets={dataset.dataset_id: dataset})
              return Project("project", "Project", wells={well.well_id: well})


          def test_project_round_trip_preserves_gas_conditioning_qc(tmp_path) -> None:
              target = tmp_path / "gas-qc.geolog.json"
              save_project(_project_with_qc(), target)

              restored = load_project(target)
              dataset = restored.wells["well"].datasets["gas"]

              assert dataset.gas_conditioning_qc == _summary()
              payload = json.loads(target.read_text(encoding="utf-8"))
              assert payload["format_version"] == PROJECT_FORMAT_VERSION == 24
              raw_qc = payload["project"]["wells"]["well"]["datasets"]["gas"][
                  "gas_conditioning_qc"
              ]
              assert raw_qc["affected_depth_row_count"] == 3
              assert raw_qc["components"][1]["interpolated_intervals"][0] == {
                  "minimum_depth": 1001.0,
                  "maximum_depth": 1002.0,
                  "sample_count": 3,
              }


          def test_v23_migration_adds_empty_gas_conditioning_qc_without_mutating_source() -> None:
              payload = {
                  "format_version": 23,
                  "project": {
                      "wells": {
                          "well": {
                              "datasets": {
                                  "gas": {"dataset_id": "gas"},
                              }
                          }
                      }
                  },
              }

              migrated = migrate_project_payload(payload, 24)

              assert migrated["format_version"] == 24
              assert migrated["project"]["wells"]["well"]["datasets"]["gas"][
                  "gas_conditioning_qc"
              ] is None
              assert "gas_conditioning_qc" not in payload["project"]["wells"]["well"][
                  "datasets"
              ]["gas"]


          def test_current_project_rejects_invalid_gas_conditioning_qc_payload() -> None:
              project = _project_with_qc()
              from dataclasses import asdict

              payload = {
                  "format_version": PROJECT_FORMAT_VERSION,
                  "project": asdict(project),
                  "tablet_layouts": {},
                  "tablet_presets": {},
                  "source_artifacts": {},
                  "image_assets": {},
                  "import_reports": {},
              }
              qc = payload["project"]["wells"]["well"]["datasets"]["gas"][
                  "gas_conditioning_qc"
              ]
              assert isinstance(qc, dict)
              qc["affected_depth_row_count"] = -1

              with pytest.raises(ProjectFormatError, match="gas conditioning QC summary"):
                  project_document_from_dict(payload)
          '''.replace("\n          ", "\n")
          Path("tests/test_gas_conditioning_qc_persistence.py").write_text(
              test_content,
              encoding="utf-8",
          )

          Path(".github/workflows/gas06-persistence-patch.yml").unlink()
      - name: Commit persistence slice
        shell: bash
        run: |
          git config user.name "S.Rinat"
          git config user.email "102806560+07Rinat07@users.noreply.github.com"
          git add -A
          git commit -m "feat(gas): persist conditioning QC provenance"
          git push origin HEAD:feat/gas-conditioning-qc-persistence
