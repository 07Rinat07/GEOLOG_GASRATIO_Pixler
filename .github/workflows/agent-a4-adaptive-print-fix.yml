name: Apply A4 adaptive print fix

on:
  push:
    branches:
      - fix/a4-header-body-adaptive-fit

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused print patches
        shell: bash
        run: |
          git apply --check .github/patches/a4-document-renderer.patch
          git apply .github/patches/a4-document-renderer.patch
          git apply --check .github/patches/a4-other-files.patch
          git apply .github/patches/a4-other-files.patch
          rm .github/patches/a4-document-renderer.patch
          rm .github/patches/a4-other-files.patch
          rm .github/workflows/agent-a4-adaptive-print-fix.yml
          python -m compileall -q src tests
          python -m pytest -q \
            tests/test_auto_pagination.py \
            tests/test_report_definition_source_integrity.py \
            tests/test_print_media_source_integrity.py \
            tests/test_form_column_layout.py \
            tests/test_print_layout_model.py
          git diff --check
      - name: Commit applied fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align A4 header and tablet adaptive geometry"
          git push origin HEAD:fix/a4-header-body-adaptive-fit
