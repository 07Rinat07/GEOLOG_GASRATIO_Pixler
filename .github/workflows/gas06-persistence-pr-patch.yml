name: GAS-06 persistence PR patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-persistence-patch:
    if: github.head_ref == 'feat/gas-conditioning-qc-persistence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gas-conditioning-qc-persistence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply persistence patch
        run: python .github/scripts/gas06_persistence_patch.py
      - name: Commit persistence slice
        run: |
          git config user.name "S.Rinat"
          git config user.email "102806560+07Rinat07@users.noreply.github.com"
          git add -A
          git commit -m "feat(gas): persist conditioning QC provenance"
          git push origin HEAD:feat/gas-conditioning-qc-persistence
