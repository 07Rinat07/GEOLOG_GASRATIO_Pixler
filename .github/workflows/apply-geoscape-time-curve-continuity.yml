name: Apply GeoScape time curve continuity patch

on:
  push:
    branches:
      - fix-geoscape-time-curve-continuity
    paths:
      - tools/staging/geoscape_time_curve_continuity.patch
      - .github/workflows/apply-geoscape-time-curve-continuity.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply prepared patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check tools/staging/geoscape_time_curve_continuity.patch
          git apply tools/staging/geoscape_time_curve_continuity.patch

      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy pytest
          PYTHONPATH=src python -m pytest -q \
            tests/test_tablet_sampling.py \
            tests/test_tablet_geometry_cache.py \
            tests/test_paradox_import.py \
            tests/test_gs2_multipart.py

      - name: Commit verified source and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/staging/geoscape_time_curve_continuity.patch
          rmdir tools/staging 2>/dev/null || true
          rm -f .github/workflows/apply-geoscape-time-curve-continuity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix GeoScape time curve continuity"
          git push origin HEAD:fix-geoscape-time-curve-continuity
