name: GAS-06 UI cleanup

on:
  push:
    branches:
      - feat/gas-conditioning-qc-ui
    paths:
      - .github/scripts/gas06_ui_cleanup.py
      - .github/workflows/gas06-ui-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/gas-conditioning-qc-ui
          fetch-depth: 0

      - name: Repair UI source and minimize localization diff
        run: python .github/scripts/gas06_ui_cleanup.py

      - name: Compile focused Python files
        run: |
          python -m py_compile \
            src/geoworkbench/project/data_inspector_controller.py \
            src/geoworkbench/ui/data_inspector_dialog.py \
            tests/test_data_inspector_controller.py \
            tests/test_data_inspector_dialog.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit cleaned feature tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(ui): validate gas conditioning QC inspector"
          git push origin HEAD:feat/gas-conditioning-qc-ui
