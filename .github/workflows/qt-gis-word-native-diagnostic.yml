name: Windows GIS Word confirmation native diagnostic

on:
  push:
    branches:
      - codex/qt-curveview-native-diagnostic
    paths:
      - .github/workflows/qt-gis-word-native-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-gis-word-native-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  qt-native-replay:
    name: GIS Word native exception replay (${{ matrix.case }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: failed-pr-886
            sha: 7b96588a36ea75769fa9d39e45c85777cea1dfce
          - case: green-pr-887-control
            sha: 8a1a021c179bee21029bce60d73e1e930c842f33
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ matrix.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock

      - name: Install the hashed release environment
        shell: pwsh
        run: |
          uv venv .venv --python 3.11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync requirements/release.lock --python .venv --require-hashes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv `
            setuptools==83.0.0 `
            wheel==0.47.0 `
            pytest==9.1.1 `
            pytest-asyncio==1.4.0 `
            ruff==0.15.22 `
            mypy==1.19.1 `
            types-defusedxml==0.7.0.20260504 `
            build==1.5.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv --no-deps --no-build-isolation --editable .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enable bounded WER minidumps on the hosted runner
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne "true" -or $env:RUNNER_OS -ne "Windows") {
            throw "Native dumps require a disposable Windows Actions runner"
          }
          $DumpFolder = Join-Path $env:RUNNER_TEMP "geolog-replay-dumps"
          New-Item -ItemType Directory -Force $DumpFolder | Out-Null
          $DumpKey = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe"
          New-Item -Path $DumpKey -Force | Out-Null
          New-ItemProperty -Path $DumpKey -Name DumpFolder -Value $DumpFolder -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $DumpKey -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $DumpKey -Name DumpCount -Value 2 -PropertyType DWord -Force | Out-Null

      - name: Capture native runtime versions
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe tools/capture_windows_native_runtime.py --output build/ci-artifacts/qt-replay/native-runtime.json --commit "${{ matrix.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and validate native exception capture without a debugger
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne "true" -or $env:RUNNER_OS -ne "Windows") {
            throw "Native diagnostic is restricted to disposable Windows Actions runners"
          }
          $ToolDir = Join-Path $env:RUNNER_TEMP "geolog-native-capture"
          $Output = "build/ci-artifacts/qt-replay"
          $ControlDir = Join-Path $ToolDir "synthetic-control"
          New-Item -ItemType Directory -Force $ToolDir, $Output, $ControlDir | Out-Null
          # WER and AeDebug/ProcDump failed to capture even the synthetic AV.
          # Use a native VEH, with no Python callbacks and no live debugger.
          # A pre-created dedicated thread writes a bounded minidump; the
          # exception continues through Windows' original handler chain.
          @'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>
          #include <dbghelp.h>
          #include <stdio.h>
          #include <wchar.h>

          static HANDLE request_event, done_event;
          static DWORD dump_thread_id, fault_thread;
          static volatile LONG active, count;
          static EXCEPTION_RECORD record;
          static CONTEXT context;
          static EXCEPTION_POINTERS pointers;
          static WCHAR directory[MAX_PATH];

          static DWORD WINAPI dump_worker(LPVOID unused) {
              (void)unused;
              for (;;) {
                  WCHAR name[MAX_PATH];
                  HANDLE file;
                  MINIDUMP_EXCEPTION_INFORMATION info;
                  BOOL ok;
                  if (WaitForSingleObject(request_event, INFINITE) != WAIT_OBJECT_0)
                      return 1;
                  if (swprintf_s(name, MAX_PATH, L"%ls\\native-%lu-%ld.dmp",
                                 directory, GetCurrentProcessId(), count) >= 0) {
                      file = CreateFileW(name, GENERIC_WRITE, 0, NULL, CREATE_NEW,
                                         FILE_ATTRIBUTE_NORMAL, NULL);
                      if (file != INVALID_HANDLE_VALUE) {
                          info.ThreadId = fault_thread;
                          info.ExceptionPointers = &pointers;
                          info.ClientPointers = FALSE;
                          ok = MiniDumpWriteDump(GetCurrentProcess(), GetCurrentProcessId(),
                                                 file, MiniDumpWithThreadInfo, &info, NULL, NULL);
                          CloseHandle(file);
                          if (!ok) DeleteFileW(name);
                      }
                  }
                  SetEvent(done_event);
              }
          }

          static LONG CALLBACK capture(EXCEPTION_POINTERS *exception) {
              DWORD code = exception->ExceptionRecord->ExceptionCode;
              if (code != EXCEPTION_ACCESS_VIOLATION && code != 0xC0000374u)
                  return EXCEPTION_CONTINUE_SEARCH;
              if (GetCurrentThreadId() == dump_thread_id || count >= 3)
                  return EXCEPTION_CONTINUE_SEARCH;
              if (InterlockedCompareExchange(&active, 1, 0) != 0)
                  return EXCEPTION_CONTINUE_SEARCH;
              InterlockedIncrement(&count);
              fault_thread = GetCurrentThreadId();
              record = *exception->ExceptionRecord;
              record.ExceptionRecord = NULL;
              context = *exception->ContextRecord;
              pointers.ExceptionRecord = &record;
              pointers.ContextRecord = &context;
              // Deliberately bounded: this diagnostic may perturb timing.
              // Never swallow an exception or let a blocked dump hang CI.
              if (SetEvent(request_event) &&
                  WaitForSingleObject(done_event, 15000) == WAIT_OBJECT_0)
                  InterlockedExchange(&active, 0);
              return EXCEPTION_CONTINUE_SEARCH;
          }

          __declspec(dllexport) int WINAPI InstallCapture(const WCHAR *folder) {
              HMODULE pinned;
              HANDLE thread;
              if (!folder || wcslen(folder) >= MAX_PATH - 50 || request_event)
                  return 0;
              if (wcscpy_s(directory, MAX_PATH, folder) != 0) return 0;
              // Prevent unloading the DLL while Windows retains the VEH.
              if (!GetModuleHandleExW(GET_MODULE_HANDLE_EX_FLAG_FROM_ADDRESS |
                                      GET_MODULE_HANDLE_EX_FLAG_PIN,
                                      (LPCWSTR)(const void *)capture, &pinned)) return 0;
              request_event = CreateEventW(NULL, FALSE, FALSE, NULL);
              done_event = CreateEventW(NULL, FALSE, FALSE, NULL);
              if (!request_event || !done_event) return 0;
              thread = CreateThread(NULL, 0, dump_worker, NULL, 0, &dump_thread_id);
              if (!thread) return 0;
              CloseHandle(thread);
              return AddVectoredExceptionHandler(1, capture) != NULL;
          }
          '@ | Set-Content -Encoding ascii "$ToolDir/capture.c"
          $VsWhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $Vs = & $VsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $Vs) { throw "MSVC toolchain unavailable" }
          $VcVars = Join-Path $Vs "VC/Auxiliary/Build/vcvars64.bat"
          @"
          @echo off
          call "$VcVars"
          if errorlevel 1 exit /b 1
          cd /d "$ToolDir"
          cl /nologo /W4 /O2 /LD capture.c /link dbghelp.lib /OUT:capture.dll
          exit /b %errorlevel%
          "@ | Set-Content -Encoding ascii "$ToolDir/build.cmd"
          & cmd.exe /d /c "$ToolDir/build.cmd" *>&1 | Tee-Object "$Output/native-build.txt"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$ToolDir/capture.dll")) {
            throw "Native capture DLL build failed"
          }
          @'
          import ctypes
          import os
          import sys
          from pathlib import Path

          try:
              _capture = ctypes.WinDLL(str(Path(__file__).with_name("capture.dll")))
              _capture.InstallCapture.argtypes = (ctypes.c_wchar_p,)
              _capture.InstallCapture.restype = ctypes.c_int
              if not _capture.InstallCapture(os.environ["GEOLOG_NATIVE_DUMP_DIR"]):
                  raise RuntimeError("InstallCapture failed")
              print("NATIVE_CAPTURE_ARMED", flush=True)
          except Exception as exc:
              print(f"NATIVE_CAPTURE_SETUP_ERROR {exc}", file=sys.stderr, flush=True)
              os._exit(91)
          '@ | Set-Content -Encoding utf8 "$ToolDir/sitecustomize.py"
          # Validate the same injection path and native code on an isolated
          # synthetic crash; its dumps never enter the application directory.
          @'
          import os
          import subprocess
          import sys
          from pathlib import Path

          tool = Path(os.environ["RUNNER_TEMP"]) / "geolog-native-capture"
          folder = tool / "synthetic-control"
          env = os.environ.copy()
          env["PYTHONPATH"] = str(tool) + os.pathsep + env.get("PYTHONPATH", "")
          env["GEOLOG_NATIVE_DUMP_DIR"] = str(folder)
          target = r"""
          import ctypes
          from ctypes import wintypes
          k = ctypes.WinDLL("kernel32", use_last_error=True)
          k.CreateThread.argtypes = (ctypes.c_void_p, ctypes.c_size_t, ctypes.c_void_p,
                                     ctypes.c_void_p, wintypes.DWORD, ctypes.c_void_p)
          k.CreateThread.restype = wintypes.HANDLE
          k.WaitForSingleObject.argtypes = (wintypes.HANDLE, wintypes.DWORD)
          k.WaitForSingleObject.restype = wintypes.DWORD
          thread = k.CreateThread(None, 0, ctypes.c_void_p(1), None, 0, None)
          if not thread:
              raise ctypes.WinError(ctypes.get_last_error())
          k.WaitForSingleObject(thread, 30000)
          raise SystemExit(3)
          """
          result = subprocess.run([sys.executable, "-c", target], env=env, timeout=90,
                                  capture_output=True, text=True, errors="replace")
          print(result.stdout, result.stderr, flush=True)
          status = result.returncode & 0xffffffff
          print(f"NATIVE_CONTROL status=0x{status:08X}", flush=True)
          dumps = list(folder.glob("*.dmp"))
          if status != 0xc0000005 or "NATIVE_CAPTURE_ARMED" not in result.stdout or not dumps:
              raise RuntimeError("Native capture control failed")
          if any(p.stat().st_size == 0 for p in dumps):
              raise RuntimeError("Empty control dump")
          for dump in dumps:
              print(f"NATIVE_CONTROL dump={dump.name} bytes={dump.stat().st_size}", flush=True)
          '@ | & .\.venv\Scripts\python.exe - *>&1 | Tee-Object "$Output/native-control.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Cdb = Join-Path ${env:ProgramFiles(x86)} "Windows Kits/10/Debuggers/x64/cdb.exe"
          foreach ($Dump in Get-ChildItem $ControlDir -Filter "*.dmp") {
            & $Cdb -z $Dump.FullName -c ".exr -1; .ecxr; kv; q" *>&1 |
              Tee-Object "$Output/control-$($Dump.BaseName).txt"
            if ($LASTEXITCODE -ne 0) { throw "Control dump analysis failed" }
          }
          if (-not (Select-String -Path "$Output/control-*.txt" -Pattern 'ExceptionCode:\s*c0000005' -Quiet)) {
            throw "Control dump did not contain the expected AV exception context"
          }

      - name: Exercise actual modal GIS Word dialog and native parent destruction
        shell: pwsh
        env:
          REPLAY_SHA: ${{ matrix.sha }}
        run: |
          $ActualSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ActualSha -ne $env:REPLAY_SHA) {
            throw "Unexpected checkout: $ActualSha; expected $env:REPLAY_SHA"
          }
          $OutputDir = "build/ci-artifacts/qt-replay"
          New-Item -ItemType Directory -Force $OutputDir | Out-Null
          $ActualSha | Out-File -Encoding utf8 "$OutputDir/checkout-sha.txt"
          @'
          import os
          from pathlib import Path
          from tools.diagnose_qt_masterlog_shard import _run_plain_target
          from scripts.run_tests import _configure_environment, _test_file_shards

          prefix = (
              "tests/test_geology_saved_interval_reedit_20260929.py",
              "tests/test_geology_track_visual_profile.py",
              "tests/test_geology_xlsx_unit_heading.py",
              "tests/test_geometry_cache_byte_budget.py",
              "tests/test_geosensor_reference_contracts.py",
              "tests/test_geosensor_wits_catalog_tool.py",
              "tests/test_gis_calibration_records.py",
              "tests/test_gis_external_exact_review.py",
              "tests/test_gis_geology_confirmed_html_ui.py",
              "tests/test_gis_geology_confirmed_word_ui.py",
          )
          if any(not Path(p).is_file() for p in prefix):
              raise RuntimeError("Missing original failing shard prefix")
          if os.environ["REPLAY_SHA"] == "7b96588a36ea75769fa9d39e45c85777cea1dfce":
              if _test_file_shards(16)[5][:len(prefix)] != prefix:
                  raise RuntimeError("Failed shard prefix changed")

          # The preceding lifetime tests invoke buttons without entering
          # QDialog.exec(). Exercise the actual nested modal event loop and
          # its parent/child destruction ordering, not another identical run.
          stress = Path("tests/test_diagnostic_gis_modal_lifetime.py")
          if stress.exists():
              raise RuntimeError("Refusing to overwrite a repository test")
          stress.write_text(
              '''from dataclasses import replace
          import numpy as np
          import pytest
          from PySide6.QtCore import QCoreApplication, QEvent, QTimer, Qt
          from PySide6.QtWidgets import QDialog, QWidget
          from shiboken6 import isValid
          from geoworkbench.services.interpretation_gis_evidence_handoff import (
              confirm_gis_geology_selection, verified_gis_geology_handoff,
          )
          from geoworkbench.services.localization import AppLanguage
          from geoworkbench.ui.gis_geology_evidence_dialog import GisGeologyEvidenceDialog
          from test_interpretation_gis_evidence_handoff import _reviewed

          @pytest.mark.parametrize("cycle", range(1, 6))
          @pytest.mark.parametrize("language", tuple(AppLanguage))
          @pytest.mark.parametrize("disposal", ("close", "parent-delete"))
          def test_modal_word_lifetime(qapp, monkeypatch, tmp_path, cycle, language, disposal):
              session, receiver, dataset, key, report, _, _ = _reviewed(monkeypatch, tmp_path)
              before = dataset.curves[key].values.copy()
              dirty = session.dirty
              source_key = ("modal-word-diagnostic", report.dataset_id)
              owner = QWidget()
              owner.show()

              def confirm(evidence, snapshot):
                  return confirm_gis_geology_selection(
                      session, report, replace(report), evidence, snapshot,
                      source_key=source_key, target="word",
                  )

              dialog = GisGeologyEvidenceDialog(
                  session, dataset, (100.0, 102.0), lambda: (100.0, 102.0),
                  parent=owner, language=language, confirm_word=confirm,
              )
              state = {"started": False, "timed_out": False}
              tick = QTimer(dialog)
              tick.setInterval(10)
              deadline = QTimer(dialog)
              deadline.setSingleShot(True)

              def advance():
                  if not state["started"]:
                      state["started"] = True
                      item = next(
                          dialog.curves.item(i) for i in range(dialog.curves.count())
                          if dialog.curves.item(i).data(Qt.ItemDataRole.UserRole) == key
                      )
                      item.setCheckState(Qt.CheckState.Checked)
                      print("GIS_MODAL phase=review", flush=True)
                      dialog.review.click()
                  elif dialog._worker is None and dialog.confirm_word_button.isEnabled():
                      tick.stop()
                      deadline.stop()
                      print("GIS_MODAL phase=confirm", flush=True)
                      dialog.confirm_word_button.click()

              def timeout():
                  state["timed_out"] = True
                  tick.stop()
                  dialog.reject()

              tick.timeout.connect(advance)
              deadline.timeout.connect(timeout)
              try:
                  print(f"GIS_MODAL phase=exec cycle={cycle} language={language.value} disposal={disposal}", flush=True)
                  tick.start()
                  deadline.start(30000)
                  result = dialog.exec()
                  tick.stop()
                  deadline.stop()
                  print("GIS_MODAL phase=exec-return", flush=True)
                  assert not state["timed_out"]
                  assert result == QDialog.DialogCode.Accepted
                  assert dialog._worker is None
                  selected = dialog.confirmed_word_selection
                  assert selected is not None and selected.target == "word"
                  assert dialog.confirmed_html_selection is None
                  assert verified_gis_geology_handoff(
                      session, report, replace(report), selected,
                      source_key=source_key, target="word",
                  ) == selected.evidence
                  np.testing.assert_array_equal(dataset.curves[key].values, before)
                  assert session.dirty == dirty and receiver.curves == {}
                  if disposal == "parent-delete":
                      print("GIS_MODAL phase=parent-deferred-delete", flush=True)
                      owner.deleteLater()
                      QCoreApplication.sendPostedEvents(owner, QEvent.Type.DeferredDelete)
                      assert not isValid(owner) and not isValid(dialog)
                      print("GIS_MODAL phase=parent-deleted", flush=True)
              finally:
                  if isValid(dialog):
                      tick.stop()
                      deadline.stop()
                      dialog.close()
                  if isValid(owner):
                      owner.close()
          ''',
              encoding="utf-8",
          )
          # The two fatal dumps agree on Shiboken releaseWrapper during
          # QListWidget destruction via DeferredDelete. Identify the exact
          # owning widget before choosing a product lifetime fix.
          conftest = Path("tests/conftest.py")
          original_conftest = conftest.read_bytes()
          trace = '''
          import pytest
          from PySide6.QtCore import QObject, QEvent
          from PySide6.QtWidgets import QWidget, QListWidget
          from shiboken6 import getCppPointer, isValid

          class _NativeDeleteTrace(QObject):
              def eventFilter(self, watched, event):
                  if event.type() != QEvent.Type.DeferredDelete:
                      return False
                  if not isinstance(watched, QWidget) or not isValid(watched):
                      return False
                  lists = watched.findChildren(QListWidget)
                  if isinstance(watched, QListWidget):
                      lists.insert(0, watched)
                  if not lists:
                      return False
                  print(
                      f"NATIVE_DELETE root={type(watched).__name__} "
                      f"name={watched.objectName()!r} cpp={getCppPointer(watched)[0]:#x}",
                      flush=True,
                  )
                  for widget in lists:
                      if not isValid(widget):
                          continue
                      print(
                          f"NATIVE_DELETE list={widget.objectName()!r} "
                          f"cpp={getCppPointer(widget)[0]:#x} count={widget.count()}",
                          flush=True,
                      )
                      for row in range(widget.count()):
                          item = widget.item(row)
                          if item is not None and isValid(item):
                              print(
                                  f"NATIVE_DELETE item row={row} "
                                  f"cpp={getCppPointer(item)[0]:#x} py={id(item):#x}",
                                  flush=True,
                              )
                  return False

          @pytest.fixture(scope="session", autouse=True)
          def _native_delete_trace(qapp):
              observer = _NativeDeleteTrace(qapp)
              qapp.installEventFilter(observer)
              try:
                  yield
              finally:
                  qapp.removeEventFilter(observer)
          '''
          conftest.write_bytes(original_conftest + b"\\n" + trace.encode("utf-8"))
          selectors = (*prefix, stress.as_posix())
          _configure_environment()
          environment = os.environ.copy()
          tool = Path(os.environ["RUNNER_TEMP"]) / "geolog-native-capture"
          environment["PYTHONPATH"] = str(tool) + os.pathsep + environment.get("PYTHONPATH", "")
          environment["GEOLOG_NATIVE_DUMP_DIR"] = str(Path(os.environ["RUNNER_TEMP"]) / "geolog-replay-dumps")
          try:
              # No live debugger: the previous native crash disappeared under CDB.
              # Stop on first failure, even if another attempt would pass.
              for attempt in range(1, 5):
                  print(f"NATIVE_REPLAY attempt={attempt}/4", flush=True)
                  result = _run_plain_target(selectors, environment)
                  if result:
                      raise SystemExit(result)
              raise SystemExit(0)
          finally:
              conftest.write_bytes(original_conftest)
              stress.unlink()
          '@ | Set-Content -Encoding utf8 "$OutputDir/modal-replay.py"
          Get-Content -Raw "$OutputDir/modal-replay.py" | & .\.venv\Scripts\python.exe - *>&1 |
            Tee-Object -FilePath "$OutputDir/modal-replay.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Analyze captured application dumps
        if: always()
        shell: pwsh
        run: |
          $Output = "build/ci-artifacts/qt-replay"
          $DumpDir = Join-Path $env:RUNNER_TEMP "geolog-replay-dumps"
          $Dumps = @(Get-ChildItem -Path $DumpDir -Filter "*.dmp" -ErrorAction SilentlyContinue)
          if ($Dumps.Count -eq 0) {
            "No application dump captured" | Out-File "$Output/native-analysis.txt"
          } else {
            $Cdb = Join-Path ${env:ProgramFiles(x86)} "Windows Kits/10/Debuggers/x64/cdb.exe"
            foreach ($Dump in $Dumps) {
              & $Cdb -z $Dump.FullName -c ".exr -1; .ecxr; kv; lm; q" *>&1 |
                Tee-Object -FilePath "$Output/native-$($Dump.BaseName).txt"
              if ($LASTEXITCODE -ne 0) { throw "CDB dump analysis failed" }
            }
          }

      - name: Capture Python crash events
        if: always()
        shell: pwsh
        run: |
          $Output = "build/ci-artifacts/qt-replay/windows-crash-events.txt"
          $Events = Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000} -MaxEvents 50 -ErrorAction SilentlyContinue
          $Events | Where-Object { $_.Message -match '(?i)python\.exe' } | Select-Object -First 5 TimeCreated, Message | Format-List | Out-File -Encoding utf8 $Output

      - name: Upload replay logs and version evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qt-gis-word-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-artifacts/qt-replay
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload bounded native crash dumps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qt-gis-word-dumps-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/geolog-replay-dumps/*.dmp
          if-no-files-found: ignore
          retention-days: 3
