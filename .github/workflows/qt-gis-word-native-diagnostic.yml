name: Windows GIS Word confirmation native diagnostic

on:
  push:
    branches:
      - codex/qt-curveview-native-diagnostic
    paths:
      - .github/workflows/qt-gis-word-native-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-gis-word-native-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  qt-native-replay:
    name: GIS Word postmortem replay (${{ matrix.case }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: failed-pr-886
            sha: 7b96588a36ea75769fa9d39e45c85777cea1dfce
          - case: green-pr-887-control
            sha: 8a1a021c179bee21029bce60d73e1e930c842f33
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ matrix.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock

      - name: Install the hashed release environment
        shell: pwsh
        run: |
          uv venv .venv --python 3.11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync requirements/release.lock --python .venv --require-hashes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv `
            setuptools==83.0.0 `
            wheel==0.47.0 `
            pytest==9.1.1 `
            pytest-asyncio==1.4.0 `
            ruff==0.15.22 `
            mypy==1.19.1 `
            types-defusedxml==0.7.0.20260504 `
            build==1.5.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv --no-deps --no-build-isolation --editable .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enable bounded WER minidumps on the hosted runner
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne "true" -or $env:RUNNER_OS -ne "Windows") {
            throw "Native dumps require a disposable Windows Actions runner"
          }
          $DumpFolder = Join-Path $env:RUNNER_TEMP "geolog-replay-dumps"
          New-Item -ItemType Directory -Force $DumpFolder | Out-Null
          $DumpKey = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe"
          New-Item -Path $DumpKey -Force | Out-Null
          New-ItemProperty -Path $DumpKey -Name DumpFolder -Value $DumpFolder -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $DumpKey -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $DumpKey -Name DumpCount -Value 2 -PropertyType DWord -Force | Out-Null

      - name: Capture native runtime versions
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe tools/capture_windows_native_runtime.py --output build/ci-artifacts/qt-replay/native-runtime.json --commit "${{ matrix.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and validate postmortem capture without a live debugger
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne "true" -or $env:RUNNER_OS -ne "Windows") {
            throw "Postmortem debugger registration is restricted to a disposable Windows Actions runner"
          }
          $ToolDir = Join-Path $env:RUNNER_TEMP "geolog-procdump"
          $DumpDir = Join-Path $env:RUNNER_TEMP "geolog-replay-dumps"
          $Output = "build/ci-artifacts/qt-replay"
          New-Item -ItemType Directory -Force $ToolDir, $DumpDir, $Output | Out-Null
          Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Procdump.zip" -OutFile "$ToolDir/procdump.zip"
          Expand-Archive -Path "$ToolDir/procdump.zip" -DestinationPath $ToolDir -Force
          $ProcDump = Join-Path $ToolDir "procdump64.exe"
          $Signature = Get-AuthenticodeSignature $ProcDump
          if ($Signature.Status -ne "Valid" -or $Signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw "ProcDump signature verification failed"
          }
          Get-FileHash -Algorithm SHA256 $ProcDump | Format-List | Out-File "$Output/procdump-identity.txt"
          (Get-Item $ProcDump).VersionInfo | Format-List | Out-File "$Output/procdump-identity.txt" -Append
          & $ProcDump -accepteula -mm -i $DumpDir *>&1 | Tee-Object "$Output/procdump-install.txt"
          if ($LASTEXITCODE -ne 0) { throw "ProcDump registration failed" }
          New-Item -ItemType File -Force "$ToolDir/registered" | Out-Null
          # Verify capture on a disposable synthetic Python subprocess before
          # running project tests. Native invalid thread entry is unhandled;
          # this is NOT an application failure and its dump is kept separate.
          @'
          import os
          import subprocess
          import sys
          from pathlib import Path

          target = r"""
          import ctypes
          from ctypes import wintypes
          k = ctypes.WinDLL("kernel32", use_last_error=True)
          k.CreateThread.argtypes = (ctypes.c_void_p, ctypes.c_size_t, ctypes.c_void_p,
                                     ctypes.c_void_p, wintypes.DWORD, ctypes.c_void_p)
          k.CreateThread.restype = wintypes.HANDLE
          k.WaitForSingleObject.argtypes = (wintypes.HANDLE, wintypes.DWORD)
          k.WaitForSingleObject.restype = wintypes.DWORD
          thread = k.CreateThread(None, 0, ctypes.c_void_p(1), None, 0, None)
          if not thread:
              raise ctypes.WinError(ctypes.get_last_error())
          k.WaitForSingleObject(thread, 30000)
          raise SystemExit(3)
          """
          folder = Path(os.environ["RUNNER_TEMP"]) / "geolog-replay-dumps"
          if list(folder.glob("*.dmp")):
              raise RuntimeError("Unexpected preexisting dumps")
          result = subprocess.run([sys.executable, "-c", target], timeout=90, check=False)
          status = result.returncode & 0xffffffff
          print(f"POSTMORTEM_CONTROL status=0x{status:08X}", flush=True)
          if status not in (0xc0000005, 0xc0000409):
              raise RuntimeError("Synthetic native failure did not occur as expected")
          dumps = list(folder.glob("*.dmp"))
          if not dumps or any(p.stat().st_size == 0 for p in dumps):
              raise RuntimeError("Postmortem capture not verified; do not run application replay")
          control = folder.parent / "geolog-procdump" / "synthetic-control"
          control.mkdir()
          for dump in dumps:
              print(f"POSTMORTEM_CONTROL dump={dump.name} bytes={dump.stat().st_size}", flush=True)
              dump.rename(control / dump.name)
          '@ | & .\.venv\Scripts\python.exe - *>&1 | Tee-Object "$Output/procdump-control.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise actual modal GIS Word dialog and native parent destruction
        shell: pwsh
        env:
          REPLAY_SHA: ${{ matrix.sha }}
        run: |
          $ActualSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ActualSha -ne $env:REPLAY_SHA) {
            throw "Unexpected checkout: $ActualSha; expected $env:REPLAY_SHA"
          }
          $OutputDir = "build/ci-artifacts/qt-replay"
          New-Item -ItemType Directory -Force $OutputDir | Out-Null
          $ActualSha | Out-File -Encoding utf8 "$OutputDir/checkout-sha.txt"
          @'
          import os
          from pathlib import Path
          from tools.diagnose_qt_masterlog_shard import _run_plain_target
          from scripts.run_tests import _configure_environment, _test_file_shards

          prefix = (
              "tests/test_geology_saved_interval_reedit_20260929.py",
              "tests/test_geology_track_visual_profile.py",
              "tests/test_geology_xlsx_unit_heading.py",
              "tests/test_geometry_cache_byte_budget.py",
              "tests/test_geosensor_reference_contracts.py",
              "tests/test_geosensor_wits_catalog_tool.py",
              "tests/test_gis_calibration_records.py",
              "tests/test_gis_external_exact_review.py",
              "tests/test_gis_geology_confirmed_html_ui.py",
              "tests/test_gis_geology_confirmed_word_ui.py",
          )
          if any(not Path(p).is_file() for p in prefix):
              raise RuntimeError("Missing original failing shard prefix")
          if os.environ["REPLAY_SHA"] == "7b96588a36ea75769fa9d39e45c85777cea1dfce":
              if _test_file_shards(16)[5][:len(prefix)] != prefix:
                  raise RuntimeError("Failed shard prefix changed")

          # The preceding lifetime tests invoke buttons without entering
          # QDialog.exec(). Exercise the actual nested modal event loop and
          # its parent/child destruction ordering, not another identical run.
          stress = Path("tests/test_diagnostic_gis_modal_lifetime.py")
          if stress.exists():
              raise RuntimeError("Refusing to overwrite a repository test")
          stress.write_text(
              '''from dataclasses import replace
          import numpy as np
          import pytest
          from PySide6.QtCore import QCoreApplication, QEvent, QTimer, Qt
          from PySide6.QtWidgets import QDialog, QWidget
          from shiboken6 import isValid
          from geoworkbench.services.interpretation_gis_evidence_handoff import (
              confirm_gis_geology_selection, verified_gis_geology_handoff,
          )
          from geoworkbench.services.localization import AppLanguage
          from geoworkbench.ui.gis_geology_evidence_dialog import GisGeologyEvidenceDialog
          from test_interpretation_gis_evidence_handoff import _reviewed

          @pytest.mark.parametrize("cycle", range(1, 6))
          @pytest.mark.parametrize("language", tuple(AppLanguage))
          @pytest.mark.parametrize("disposal", ("close", "parent-delete"))
          def test_modal_word_lifetime(qapp, monkeypatch, tmp_path, cycle, language, disposal):
              session, receiver, dataset, key, report, _, _ = _reviewed(monkeypatch, tmp_path)
              before = dataset.curves[key].values.copy()
              dirty = session.dirty
              source_key = ("modal-word-diagnostic", report.dataset_id)
              owner = QWidget()
              owner.show()

              def confirm(evidence, snapshot):
                  return confirm_gis_geology_selection(
                      session, report, replace(report), evidence, snapshot,
                      source_key=source_key, target="word",
                  )

              dialog = GisGeologyEvidenceDialog(
                  session, dataset, (100.0, 102.0), lambda: (100.0, 102.0),
                  parent=owner, language=language, confirm_word=confirm,
              )
              state = {"started": False, "timed_out": False}
              tick = QTimer(dialog)
              tick.setInterval(10)
              deadline = QTimer(dialog)
              deadline.setSingleShot(True)

              def advance():
                  if not state["started"]:
                      state["started"] = True
                      item = next(
                          dialog.curves.item(i) for i in range(dialog.curves.count())
                          if dialog.curves.item(i).data(Qt.ItemDataRole.UserRole) == key
                      )
                      item.setCheckState(Qt.CheckState.Checked)
                      print("GIS_MODAL phase=review", flush=True)
                      dialog.review.click()
                  elif dialog._worker is None and dialog.confirm_word_button.isEnabled():
                      tick.stop()
                      deadline.stop()
                      print("GIS_MODAL phase=confirm", flush=True)
                      dialog.confirm_word_button.click()

              def timeout():
                  state["timed_out"] = True
                  tick.stop()
                  dialog.reject()

              tick.timeout.connect(advance)
              deadline.timeout.connect(timeout)
              try:
                  print(f"GIS_MODAL phase=exec cycle={cycle} language={language.value} disposal={disposal}", flush=True)
                  tick.start()
                  deadline.start(30000)
                  result = dialog.exec()
                  tick.stop()
                  deadline.stop()
                  print("GIS_MODAL phase=exec-return", flush=True)
                  assert not state["timed_out"]
                  assert result == QDialog.DialogCode.Accepted
                  assert dialog._worker is None
                  selected = dialog.confirmed_word_selection
                  assert selected is not None and selected.target == "word"
                  assert dialog.confirmed_html_selection is None
                  assert verified_gis_geology_handoff(
                      session, report, replace(report), selected,
                      source_key=source_key, target="word",
                  ) == selected.evidence
                  np.testing.assert_array_equal(dataset.curves[key].values, before)
                  assert session.dirty == dirty and receiver.curves == {}
                  if disposal == "parent-delete":
                      print("GIS_MODAL phase=parent-deferred-delete", flush=True)
                      owner.deleteLater()
                      QCoreApplication.sendPostedEvents(owner, QEvent.Type.DeferredDelete)
                      assert not isValid(owner) and not isValid(dialog)
                      print("GIS_MODAL phase=parent-deleted", flush=True)
              finally:
                  if isValid(dialog):
                      tick.stop()
                      deadline.stop()
                      dialog.close()
                  if isValid(owner):
                      owner.close()
          ''',
              encoding="utf-8",
          )
          selectors = (*prefix, stress.as_posix())
          _configure_environment()
          environment = os.environ.copy()
          try:
              # No live debugger: the previous native crash disappeared under CDB.
              # Stop on first failure, even if another attempt would pass.
              for attempt in range(1, 5):
                  print(f"POSTMORTEM_REPLAY attempt={attempt}/4", flush=True)
                  result = _run_plain_target(selectors, environment)
                  if result:
                      raise SystemExit(result)
              raise SystemExit(0)
          finally:
              stress.unlink()
          '@ | Set-Content -Encoding utf8 "$OutputDir/modal-replay.py"
          Get-Content -Raw "$OutputDir/modal-replay.py" | & .\.venv\Scripts\python.exe - *>&1 |
            Tee-Object -FilePath "$OutputDir/modal-replay.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Analyze captured application dumps and restore postmortem settings
        if: always()
        shell: pwsh
        run: |
          $ToolDir = Join-Path $env:RUNNER_TEMP "geolog-procdump"
          $ProcDump = Join-Path $ToolDir "procdump64.exe"
          $Output = "build/ci-artifacts/qt-replay"
          $DumpDir = Join-Path $env:RUNNER_TEMP "geolog-replay-dumps"
          try {
            $Dumps = @(Get-ChildItem -Path $DumpDir -Filter "*.dmp" -ErrorAction SilentlyContinue)
            if ($Dumps.Count -eq 0) {
              "No application dump captured" | Out-File "$Output/postmortem-analysis.txt"
            } else {
              $Cdb = Join-Path ${env:ProgramFiles(x86)} "Windows Kits/10/Debuggers/x64/cdb.exe"
              foreach ($Dump in $Dumps) {
                & $Cdb -z $Dump.FullName -c ".exr -1; .ecxr; kv; lm; q" *>&1 |
                  Tee-Object -FilePath "$Output/postmortem-$($Dump.BaseName).txt"
                if ($LASTEXITCODE -ne 0) { throw "CDB dump analysis failed" }
              }
            }
          } finally {
            if (Test-Path "$ToolDir/registered") {
              & $ProcDump -accepteula -u *>&1 | Tee-Object "$Output/procdump-uninstall.txt"
              if ($LASTEXITCODE -ne 0) { throw "Failed to restore postmortem settings" }
            }
          }

      - name: Capture Python crash events
        if: always()
        shell: pwsh
        run: |
          $Output = "build/ci-artifacts/qt-replay/windows-crash-events.txt"
          $Events = Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000} -MaxEvents 50 -ErrorAction SilentlyContinue
          $Events | Where-Object { $_.Message -match '(?i)python\.exe' } | Select-Object -First 5 TimeCreated, Message | Format-List | Out-File -Encoding utf8 $Output

      - name: Upload replay logs and version evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qt-gis-word-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-artifacts/qt-replay
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload bounded native crash dumps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qt-gis-word-dumps-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/geolog-replay-dumps/*.dmp
          if-no-files-found: ignore
          retention-days: 3
