name: Windows GIS Word confirmation native diagnostic

on:
  push:
    branches:
      - codex/qt-curveview-native-diagnostic
    paths:
      - .github/workflows/qt-gis-word-native-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-gis-word-native-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  qt-native-replay:
    name: GIS Word full page-heap replay (${{ matrix.case }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: failed-pr-886
            sha: 7b96588a36ea75769fa9d39e45c85777cea1dfce
          - case: green-pr-887-control
            sha: 8a1a021c179bee21029bce60d73e1e930c842f33
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ matrix.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock

      - name: Install the hashed release environment
        shell: pwsh
        run: |
          uv venv .venv --python 3.11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync requirements/release.lock --python .venv --require-hashes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv `
            setuptools==83.0.0 `
            wheel==0.47.0 `
            pytest==9.1.1 `
            pytest-asyncio==1.4.0 `
            ruff==0.15.22 `
            mypy==1.19.1 `
            types-defusedxml==0.7.0.20260504 `
            build==1.5.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv --no-deps --no-build-isolation --editable .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enable bounded WER minidumps on the hosted runner
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne "true" -or $env:RUNNER_OS -ne "Windows") {
            throw "Native dumps require a disposable Windows Actions runner"
          }
          $DumpFolder = Join-Path $env:RUNNER_TEMP "geolog-replay-dumps"
          New-Item -ItemType Directory -Force $DumpFolder | Out-Null
          $DumpKey = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe"
          New-Item -Path $DumpKey -Force | Out-Null
          New-ItemProperty -Path $DumpKey -Name DumpFolder -Value $DumpFolder -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $DumpKey -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $DumpKey -Name DumpCount -Value 2 -PropertyType DWord -Force | Out-Null

      - name: Capture native runtime versions
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe tools/capture_windows_native_runtime.py --output build/ci-artifacts/qt-replay/native-runtime.json --commit "${{ matrix.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Detect early native heap faults under full page heap and CDB
        shell: pwsh
        env:
          REPLAY_SHA: ${{ matrix.sha }}
        run: |
          if ($env:GITHUB_ACTIONS -ne "true" -or $env:RUNNER_OS -ne "Windows") {
            throw "Page heap diagnostics require a disposable Windows Actions runner"
          }
          $ActualSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ActualSha -ne $env:REPLAY_SHA) {
            throw "Unexpected checkout: $ActualSha; expected $env:REPLAY_SHA"
          }
          $OutputDir = "build/ci-artifacts/qt-replay"
          New-Item -ItemType Directory -Force $OutputDir | Out-Null
          $ActualSha | Out-File -Encoding utf8 "$OutputDir/checkout-sha.txt"
          $GFlags = Join-Path ${env:ProgramFiles(x86)} "Windows Kits/10/Debuggers/x64/gflags.exe"
          if (-not (Test-Path $GFlags)) {
            throw "GFlags is unavailable; page heap was not tested"
          }
          # New hypothesis: a prior native write or use-after-free corrupts the
          # heap before the observed Word EN test. Full page heap adds guard
          # pages to detect invalid access closer to its origin.
          & $GFlags /p /enable python.exe /full *>&1 |
            Tee-Object -FilePath "$OutputDir/pageheap-enable.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            $PageHeap = & $GFlags /p *>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "Could not query page heap settings" }
            $PageHeap | Tee-Object -FilePath "$OutputDir/pageheap-state.txt"
            if ($PageHeap -notmatch '(?im)^\s*python\.exe[^\r\n]*full') {
              throw "Full page heap for python.exe not confirmed"
            }
            @'
          import os
          from pathlib import Path
          import tools.diagnose_qt_masterlog_shard as replay
          from scripts.run_tests import _configure_environment, _test_file_shards

          # Exact prefix of the original failed mandatory shard, including
          # all earlier files and the complete Word test module. Keep the
          # identical manifest on the comparison commit.
          selectors = (
              "tests/test_geology_saved_interval_reedit_20260929.py",
              "tests/test_geology_track_visual_profile.py",
              "tests/test_geology_xlsx_unit_heading.py",
              "tests/test_geometry_cache_byte_budget.py",
              "tests/test_geosensor_reference_contracts.py",
              "tests/test_geosensor_wits_catalog_tool.py",
              "tests/test_gis_calibration_records.py",
              "tests/test_gis_external_exact_review.py",
              "tests/test_gis_geology_confirmed_html_ui.py",
              "tests/test_gis_geology_confirmed_word_ui.py",
          )
          if any(not Path(p).is_file() for p in selectors):
              raise RuntimeError("Missing exact pre-failure selectors")
          if os.environ["REPLAY_SHA"] == "7b96588a36ea75769fa9d39e45c85777cea1dfce":
              if _test_file_shards(16)[5][:len(selectors)] != selectors:
                  raise RuntimeError("Failed shard prefix does not match the recorded run")

          # Only this diagnostic strengthens the debugger filters. A first
          # chance AV or verifier breakpoint is evidence to inspect, not
          # automatically the original fatal exception.
          original_startup = replay._cdb_startup_commands

          def pageheap_startup(dump_path):
              commands = original_startup(dump_path)
              av_line = next(line for line in commands.splitlines() if line.endswith(" av"))
              capture = av_line.removeprefix('sxd -c2 "').removesuffix('" av')
              if capture == av_line or not capture.startswith(".echo GEOLOG_CDB_NATIVE_EXCEPTION"):
                  raise RuntimeError("Unexpected CDB capture commands")
              commands = commands.replace(av_line, f'sxe -c "{capture}" av')
              return commands.replace("sxn ibp\n", f'sxn ibp\nsxe -c "{capture}" bpe\n')

          replay._cdb_startup_commands = pageheap_startup
          _configure_environment()
          print("Full page heap; CDB first-chance AV and verifier breakpoint capture", flush=True)
          print("Exact pre-failure shard prefix:", ", ".join(selectors), flush=True)
          raise SystemExit(replay._run_debugged_target(selectors, os.environ.copy()))
          '@ | Set-Content -Encoding utf8 "$OutputDir/pageheap-replay.py"
            Get-Content -Raw "$OutputDir/pageheap-replay.py" | & .\.venv\Scripts\python.exe - *>&1 |
              Tee-Object -FilePath "$OutputDir/pageheap-cdb.log"
            $ReplayExit = $LASTEXITCODE
            if ($ReplayExit -ne 0) { throw "Page heap diagnostic failed or was incomplete: $ReplayExit" }
          } finally {
            & $GFlags /p /disable python.exe *>&1 |
              Tee-Object -FilePath "$OutputDir/pageheap-disable.txt"
            if ($LASTEXITCODE -ne 0) { throw "Failed to disable diagnostic page heap" }
          }

      - name: Capture Python crash events
        if: always()
        shell: pwsh
        run: |
          $Output = "build/ci-artifacts/qt-replay/windows-crash-events.txt"
          $Events = Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000} -MaxEvents 50 -ErrorAction SilentlyContinue
          $Events | Where-Object { $_.Message -match '(?i)python\.exe' } | Select-Object -First 5 TimeCreated, Message | Format-List | Out-File -Encoding utf8 $Output

      - name: Upload replay logs and version evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qt-gis-word-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-artifacts/qt-replay
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload bounded native crash dumps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qt-gis-word-dumps-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/geolog-replay-dumps/*.dmp
          if-no-files-found: ignore
          retention-days: 3
