name: Apply semantic print header crop fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch print header geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/geoworkbench/printing/tablet_print.py')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  '''        header_height = max(\n            item.widget.title.height() + item.widget.curve_header_scroll.height()\n            for item in rendered\n        )\n''',
                  '''        # Use the semantic print-header contract rather than the current\n        # QScrollArea geometry. On a short final page Qt can temporarily stretch\n        # the scroll viewport into the graph; copying that live height repeats a\n        # strip of curve pixels below the footer header.\n        header_height = (\n            max(item.widget.title.height() for item in rendered)\n            + print_header_band\n        )\n''',
              ),
              (
                  '''            header_height = max(\n                item.widget.title.height() + item.widget.curve_header_scroll.height()\n                for item in rendered\n            )\n''',
                  '''            header_height = (\n                max(item.widget.title.height() for item in rendered)\n                + print_header_band\n            )\n''',
              ),
              (
                  '''            measured_header_height = max(\n                item.widget.title.height() + item.widget.curve_header_scroll.height()\n                for item in rendered\n            )\n''',
                  '''            measured_header_height = (\n                max(item.widget.title.height() for item in rendered)\n                + print_header_band\n            )\n''',
              ),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('expected print header block not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_print_header_layout.py')
          test_text = test.read_text(encoding='utf-8')
          marker = 'def test_print_snapshot_header_crop_uses_semantic_header_band()'
          if marker not in test_text:
              test_text += '''\n\n\ndef test_print_snapshot_header_crop_uses_semantic_header_band() -> None:\n    source = Path(\n        "src/geoworkbench/printing/tablet_print.py"\n    ).read_text(encoding="utf-8")\n\n    assert "+ print_header_band" in source\n    assert "curve_header_scroll.height()" not in source\n'''
              test.write_text(test_text, encoding='utf-8')
          PY
      - name: Verify syntax and source contract
        run: |
          python -m compileall -q src/geoworkbench/printing/tablet_print.py tests/test_print_header_layout.py
          python - <<'PY'
          from pathlib import Path
          source = Path('src/geoworkbench/printing/tablet_print.py').read_text(encoding='utf-8')
          assert '+ print_header_band' in source
          assert 'curve_header_scroll.height()' not in source
          PY
      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/apply-header-crop-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/geoworkbench/printing/tablet_print.py tests/test_print_header_layout.py .github/workflows
          git commit -m 'fix: crop repeated print header at semantic boundary'
          git push origin HEAD:main
