name: Windows WITS0 PlotItem native lifecycle diagnostic

on:
  push:
    branches:
      - codex/qt-curveview-native-diagnostic
    paths:
      - .github/workflows/qt-curveview-native-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-curveview-native-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  qt-native-replay:
    name: WITS0 PlotItem native replay (${{ matrix.case }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: failed-pr-918
            sha: 50bf580cc97256ecdc6ce843df019e2fbccb8766
          - case: after-unit-plot-fix-918
            sha: 11590df2cfa70a51fa5d881453d6a2ecb2d48588
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ matrix.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock

      - name: Install the hashed release environment
        shell: pwsh
        run: |
          uv venv .venv --python 3.11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync requirements/release.lock --python .venv --require-hashes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv setuptools==83.0.0 wheel==0.47.0 pytest==9.1.1 pytest-asyncio==1.4.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv --no-deps --no-build-isolation --editable .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enable bounded WER minidumps on the hosted runner
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne "true" -or $env:RUNNER_OS -ne "Windows") {
            throw "Native dumps require a disposable Windows Actions runner"
          }
          $DumpFolder = Join-Path $env:RUNNER_TEMP "geolog-replay-dumps"
          New-Item -ItemType Directory -Force $DumpFolder | Out-Null
          $DumpKey = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe"
          New-Item -Path $DumpKey -Force | Out-Null
          New-ItemProperty -Path $DumpKey -Name DumpFolder -Value $DumpFolder -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $DumpKey -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $DumpKey -Name DumpCount -Value 2 -PropertyType DWord -Force | Out-Null

      - name: Capture native runtime versions
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe tools/capture_windows_native_runtime.py --output build/ci-artifacts/qt-replay/native-runtime.json --commit "${{ matrix.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Replay exact failing WITS0 selector, full file and plot lifetime controls
        shell: pwsh
        run: |
          $OutputDir = "build/ci-artifacts/qt-replay"
          New-Item -ItemType Directory -Force $OutputDir | Out-Null
          @'
          from tools.diagnose_qt_masterlog_shard import _run_plain_target, _run_debugged_target
          from scripts.run_tests import _all_test_files, _configure_environment, _test_file_shards
          import os
          from pathlib import Path
          target = (
              "tests/test_wits0_capture_reopen_runtime.py::"
              "test_real_capture_dialog_restores_open_runtime_workspace_and_sequence[.geolog.json-ru]",
          )
          file_target = ("tests/test_wits0_capture_reopen_runtime.py",)
          control = ("tests/test_wits0_operator_dashboard.py",)
          # Reproduce the *actual shared Windows CI shard* containing the
          # failing selector, including its preceding Qt tests. Replaying only
          # the standalone test did not reproduce the intermittent 0xC0000005.
          matches = tuple(
              shard for shard in _test_file_shards(16, _all_test_files())
              if "tests/test_wits0_capture_reopen_runtime.py" in shard
          )
          if len(matches) != 1:
              raise SystemExit("Could not determine exact WITS0 CI shard")
          shared_shard = matches[0]
          print(f'Exact WITS0 CI shard: {len(shared_shard)} files', flush=True)
          print('\n'.join(shared_shard), flush=True)
          _configure_environment()
          environment = os.environ.copy()
          failed = 0
          for attempt in range(1, 5):
              print(f'Exact WITS0 reopen runtime, plain process {attempt}/4', flush=True)
              failed |= _run_plain_target(target, environment)
          # CDB captures the first native exception, registers, stack and dump.
          # Stop debugger repetitions on failure to preserve the first dump.
          for attempt in range(1, 5):
              print(f'Exact WITS0 reopen runtime under CDB {attempt}/4', flush=True)
              result = _run_debugged_target(target, environment)
              failed |= result
              if result:
                  break
          for attempt in range(1, 4):
              print(f'Full WITS0 capture lifecycle test file {attempt}/3', flush=True)
              failed |= _run_plain_target(file_target, environment)
          print('Separate WITS0 operator dashboard graphics control', flush=True)
          failed |= _run_plain_target(control, environment)
          # Do not suppress or split any original failing selector. A native
          # Windows failure in the shared CI shard remains a failed replay.
          for attempt in range(1, 3):
              print(f'Exact shared WITS0 CI shard, plain process {attempt}/2', flush=True)
              failed |= _run_plain_target(shared_shard, environment)
          print('Exact shared WITS0 CI shard under CDB', flush=True)
          failed |= _run_debugged_target(shared_shard, environment)
          raise SystemExit(1 if failed else 0)
          '@ | Set-Content -Encoding utf8 "$OutputDir/replay-wits0-plotitem.py"
          Get-Content -Raw "$OutputDir/replay-wits0-plotitem.py" | & .\.venv\Scripts\python.exe - *>&1 |
            Tee-Object -FilePath "$OutputDir/wits0-plotitem-replay.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture Python crash events
        if: always()
        shell: pwsh
        run: |
          $Output = "build/ci-artifacts/qt-replay/windows-crash-events.txt"
          $Events = Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000} -MaxEvents 50 -ErrorAction SilentlyContinue
          $Events | Where-Object { $_.Message -match '(?i)python\.exe' } | Select-Object -First 5 TimeCreated, Message | Format-List | Out-File -Encoding utf8 $Output

      - name: Upload replay logs and version evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qt-wits0-plotitem-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-artifacts/qt-replay
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload bounded native crash dumps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qt-wits0-plotitem-dumps-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/geolog-replay-dumps/*.dmp
          if-no-files-found: ignore
          retention-days: 3
