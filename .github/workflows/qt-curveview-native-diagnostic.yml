name: Windows GIS native failure diagnostic

on:
  push:
    branches:
      - codex/qt-curveview-native-diagnostic
    paths:
      - .github/workflows/qt-curveview-native-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-curveview-native-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  qt-native-replay:
    name: GIS native replay (${{ matrix.case }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: failed-pr-872
            sha: a302f18b902feb603bd9f69ee00852bce22876b5
          - case: green-main-control
            sha: f031d93b723e23d918cbb90af43654a0e06e28e3
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ matrix.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock

      - name: Install the hashed release environment
        shell: pwsh
        run: |
          uv venv .venv --python 3.11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync requirements/release.lock --python .venv --require-hashes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv setuptools==83.0.0 wheel==0.47.0 pytest==9.1.1 pytest-asyncio==1.4.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv --no-deps --no-build-isolation --editable .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enable bounded WER minidumps on the hosted runner
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne "true" -or $env:RUNNER_OS -ne "Windows") {
            throw "Native dumps require a disposable Windows Actions runner"
          }
          $DumpFolder = Join-Path $env:RUNNER_TEMP "geolog-replay-dumps"
          New-Item -ItemType Directory -Force $DumpFolder | Out-Null
          $DumpKey = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe"
          New-Item -Path $DumpKey -Force | Out-Null
          New-ItemProperty -Path $DumpKey -Name DumpFolder -Value $DumpFolder -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $DumpKey -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $DumpKey -Name DumpCount -Value 2 -PropertyType DWord -Force | Out-Null

      - name: Capture native runtime versions
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe tools/capture_windows_native_runtime.py --output build/ci-artifacts/qt-replay/native-runtime.json --commit "${{ matrix.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Replay exact PR 872 shard without debugger and under CDB
        shell: pwsh
        run: |
          $OutputDir = "build/ci-artifacts/qt-replay"
          New-Item -ItemType Directory -Force $OutputDir | Out-Null
          @'
          from tools.diagnose_qt_masterlog_shard import _run_plain_target, _run_debugged_target
          from scripts.run_tests import _configure_environment
          import os
          from pathlib import Path
          selectors = (
              "tests/test_form_library_visibility_078.py",
              "tests/test_form_live_preview.py",
              "tests/test_form_manager_print_layout.py",
              "tests/test_form_materialize.py",
              "tests/test_form_naming.py",
              "tests/test_form_render_hotfix.py",
              "tests/test_form_structure_editor.py",
              "tests/test_form_switch_qt_lifecycle_hotfix_0750.py",
              "tests/test_form_width_advisor.py",
              "tests/test_format_capabilities.py",
              "tests/test_formula_dialog.py",
              "tests/test_formula_execution_controller.py",
              "tests/test_formula_method_audit.py",
              "tests/test_formula_profiles.py",
              "tests/test_full_report_preview_marks.py",
              "tests/test_gas_07_golden_acceptance.py",
              "tests/test_gas_architecture_contract.py",
              "tests/test_gas_conditioning.py",
              "tests/test_gas_conditioning_benchmark.py",
              "tests/test_gas_conditioning_qc.py",
              "tests/test_gas_conditioning_qc_persistence.py",
              "tests/test_gas_conditioning_qc_validation.py",
              "tests/test_gas_context_event_dialog.py",
              "tests/test_gas_context_event_editor.py",
              "tests/test_gas_context_legend_typography.py",
              "tests/test_gas_context_negative_depth_acceptance.py",
              "tests/test_gas_context_print_track.py",
              "tests/test_gas_context_report_identities.py",
              "tests/test_gas_context_track_typography.py",
              "tests/test_gas_context_workspace_reopen.py",
              "tests/test_gas_curve_rendering_continuity.py",
              "tests/test_gas_interval_combined_evidence_ui.py",
              "tests/test_gas_interval_gis_review_ui.py",
              "tests/test_gas_interval_gis_source_review_ui.py",
              "tests/test_gas_mixture_document_control.py",
              "tests/test_gas_mixture_line_patterns.py",
              "tests/test_gas_mixture_output_language.py",
              "tests/test_gas_mixture_ramp_report.py",
              "tests/test_gas_mixture_raster_typography.py",
              "tests/test_gas_mixture_report_visual_profile.py",
              "tests/test_gas_mixture_workspace_language.py",
              "tests/test_gas_ratio_interpretation.py",
              "tests/test_gas_ratio_project_controller.py",
              "tests/test_gas_ratio_reference.py",
              "tests/test_gas_update_coverage.py",
              "tests/test_geology_docx_shared_footer.py",
              "tests/test_geology_legend_visual_profile.py",
          )
          if any(not Path(path).is_file() for path in selectors):
              raise RuntimeError('Exact failing shard is missing files')
          _configure_environment()
          environment = os.environ.copy()
          print('Exact failed shard from run 43261567112, without debugger', flush=True)
          plain = _run_plain_target(selectors, environment)
          print(f'Plain replay exit={plain}; now replay under CDB', flush=True)
          debugged = _run_debugged_target(selectors, environment)
          raise SystemExit(1 if plain or debugged else 0)
          '@ | Set-Content -Encoding utf8 "$OutputDir/replay-gis-shard.py"
          Get-Content -Raw "$OutputDir/replay-gis-shard.py" | & .\.venv\Scripts\python.exe - *>&1 |
            Tee-Object -FilePath "$OutputDir/shard-replay.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload replay logs and version evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qt-gis-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-artifacts/qt-replay
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload bounded native crash dumps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qt-gis-dumps-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/geolog-replay-dumps/*.dmp
          if-no-files-found: ignore
          retention-days: 3
