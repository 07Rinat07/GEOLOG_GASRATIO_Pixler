name: Fix PR16 release gate

on:
  push:
    branches:
      - feature-file-workspace-engineering-tools
    paths:
      - tools/fix_pr16_release_gate.py
      - .github/workflows/fix-pr16-release-gate.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: feature-file-workspace-engineering-tools
          fetch-depth: 0
      - name: Apply confirmed release gate fixes
        run: python tools/fix_pr16_release_gate.py
      - name: Validate syntax
        run: python -m compileall -q src tests tools scripts
      - name: Remove one-time applicator
        run: |
          git rm tools/fix_pr16_release_gate.py
          git rm .github/workflows/fix-pr16-release-gate.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/geoworkbench/files/document_service.py src/geoworkbench/files/archive_service.py
          git commit -m "Fix file workspace release gate findings"
          git push origin HEAD:feature-file-workspace-engineering-tools
