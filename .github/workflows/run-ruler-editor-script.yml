name: Run ruler editor integration script

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-ruler-editor-script.yml

permissions:
  contents: write

concurrency:
  group: run-ruler-editor-script
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock

      - name: Apply, verify and commit
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          $phase = "patch"
          python tools/_extract_ruler_editor_patch.py *> patch-output.txt
          $failed = $LASTEXITCODE -ne 0

          if (-not $failed) {
            $phase = "install"
            uv venv .venv --python 3.11 *> install-output.txt
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            uv pip sync requirements/release.lock --python .venv --require-hashes *>> install-output.txt
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            uv pip install --python .venv pytest==9.1.1 ruff==0.15.22 *>> install-output.txt
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            uv pip install --python .venv --no-deps --no-build-isolation --editable . *>> install-output.txt
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }

          if (-not $failed) {
            $phase = "verify"
            .\.venv\Scripts\python.exe -m compileall -q src/geoworkbench/ui/tablet_track_editor_dialog.py tests/test_vertical_ruler_track_editor.py *> verify-output.txt
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            .\.venv\Scripts\python.exe -m ruff check src/geoworkbench/ui/tablet_track_editor_dialog.py tests/test_vertical_ruler_track_editor.py *>> verify-output.txt
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            .\.venv\Scripts\python.exe -m pytest -q -p no:cacheprovider tests/test_vertical_ruler_settings.py tests/test_vertical_ruler_persistence.py tests/test_vertical_ruler_track_editor.py *>> verify-output.txt
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item .github/workflows/run-ruler-editor-script.yml -ErrorAction SilentlyContinue
          Remove-Item tools/_extract_ruler_editor_patch.py -ErrorAction SilentlyContinue

          if ($failed) {
            $lines = @("phase=$phase")
            foreach ($file in @("patch-output.txt", "install-output.txt", "verify-output.txt")) {
              if (Test-Path $file) {
                $lines += "--- $file ---"
                $lines += Get-Content $file
              }
            }
            $lines | Set-Content .github/ruler-editor-integration-error.txt -Encoding utf8
            Remove-Item patch-output.txt, install-output.txt, verify-output.txt -ErrorAction SilentlyContinue
            git add -A
            git commit -m "ci: capture ruler editor integration error"
            git push origin HEAD:main
            exit 0
          }

          Remove-Item .github/ruler-editor-integration-error.txt -ErrorAction SilentlyContinue
          Remove-Item patch-output.txt, install-output.txt, verify-output.txt -ErrorAction SilentlyContinue
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "feat: expose shared ruler controls in track editor"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
