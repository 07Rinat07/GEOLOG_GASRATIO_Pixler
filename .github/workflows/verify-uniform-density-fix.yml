name: Verify uniform print density fix

on:
  push:
    branches:
      - fix/a4-header-body-adaptive-fit

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v4
        with:
          version: '0.11.29'
      - name: Install release environment
        shell: pwsh
        run: |
          uv venv .venv --python 3.11
          uv pip sync requirements/release.lock --python .venv --require-hashes
          uv pip install --python .venv setuptools==83.0.0 wheel==0.47.0 pytest==9.1.1 pytest-asyncio==1.4.0 ruff==0.15.22 mypy==1.19.1 types-defusedxml==0.7.0.20260504 Pillow==12.3.0
          uv pip install --python .venv --no-deps --no-build-isolation --editable .
      - name: Run quality and regression tests
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m compileall -q src tests tools scripts
          .\.venv\Scripts\python.exe -m ruff check src tests tools scripts
          .\.venv\Scripts\python.exe -m mypy src
          .\.venv\Scripts\python.exe scripts/run_tests.py -p no:cacheprovider
      - name: Capture A4 control PDF
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe tools/capture_a4_masterlog_control.py --output-dir build/uniform-density-control
      - name: Upload control artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniform-density-control-${{ github.run_id }}
          path: build/uniform-density-control
          if-no-files-found: warn
          retention-days: 30
