name: Fix runtime print overflow

on:
  push:
    branches:
      - fix/a4-header-body-adaptive-fit

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply runtime print and status fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              source = path.read_text(encoding='utf-8')
              if old not in source:
                  raise SystemExit(f'Expected fragment not found in {path}: {old[:100]!r}')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')

          tablet = Path('src/geoworkbench/printing/tablet_print.py')
          replace_once(
              tablet,
              '''        scale = horizontal_scale
        rendered_width = snapshot.layout.total_width * scale
        rendered_height = logical_content_height * scale
        if rendered_height > page.height() + 2.0:
            raise TabletPrintError(
                "Печатная форма выше рассчитанной области страницы; "
                "автоматическая пагинация нарушила единый масштаб"
            )
        x = page.left() + (page.width() - rendered_width) / 2.0
''',
              '''        scale = horizontal_scale
        rendered_width = snapshot.layout.total_width * scale
        rendered_height = logical_content_height * scale
        if rendered_height > page.height() + 2.0:
            # Real forms can gain a few logical pixels after Qt resolves wrapped
            # titles and enlarged print headers. Never abort the complete PDF for
            # that runtime difference: use a bounded uniform fallback so every
            # column remains visible and the document is still produced.
            scale = min(horizontal_scale, vertical_scale)
            rendered_width = snapshot.layout.total_width * scale
            rendered_height = logical_content_height * scale
        x = page.left() + (page.width() - rendered_width) / 2.0
''',
          )

          status = Path('src/geoworkbench/ui/print_job_status_dialog.py')
          source = status.read_text(encoding='utf-8')
          source = source.replace(
              '''        self.open_button.setEnabled(False)
        self.folder_button.setEnabled(False)
        self.close_button.setEnabled(True)
''',
              '''        self.open_button.setEnabled(False)
        self.folder_button.setEnabled(
            self.target is not None and self.target.parent.is_dir()
        )
        self.close_button.setEnabled(True)
''',
              1,
          )
          source = source.replace(
              '''    def _open_folder(self) -> None:
        if self._primary_path is not None and self._primary_path.is_file():
            # Pass the completed file itself. Windows Explorer can then select
            # it instead of merely opening a folder with no visual indication.
            self._invoke_open_action(self._open_folder_callback, self._primary_path)
''',
              '''    def _open_folder(self) -> None:
        if self._primary_path is not None and self._primary_path.is_file():
            # Pass the completed file itself. Windows Explorer can then select
            # it instead of merely opening a folder with no visual indication.
            self._invoke_open_action(self._open_folder_callback, self._primary_path)
            return
        if self.target is not None and self.target.parent.is_dir():
            self._invoke_open_action(self._open_folder_callback, self.target.parent)
''',
              1,
          )
          source = source.replace(
              '''        if sys.platform == "win32":
            return _start_detached(
                "explorer.exe",
                ["/select,", str(resolved)],
            )
''',
              '''        if sys.platform == "win32":
            if resolved.is_file():
                return _start_detached(
                    "explorer.exe",
                    ["/select,", str(resolved)],
                )
            return _start_detached("explorer.exe", [str(resolved)])
''',
              1,
          )
          status.write_text(source, encoding='utf-8')

          density_test = Path('tests/test_uniform_page_density_and_header_font.py')
          source = density_test.read_text(encoding='utf-8')
          source = source.replace(
              '''    assert "scale = horizontal_scale" in source
    assert "scale = min(horizontal_scale, vertical_scale)" not in source
    assert "y = page.top()" in source
    assert "автоматическая пагинация нарушила единый масштаб" in source
''',
              '''    assert "scale = horizontal_scale" in source
    assert "scale = min(horizontal_scale, vertical_scale)" in source
    assert "Never abort the complete PDF" in source
    assert "y = page.top()" in source
    assert "автоматическая пагинация нарушила единый масштаб" not in source
''',
              1,
          )
          density_test.write_text(source, encoding='utf-8')

          dialog_test = Path('tests/test_print_job_status_dialog.py')
          source = dialog_test.read_text(encoding='utf-8')
          addition = '''


def test_failed_file_status_can_still_open_destination_folder(qapp, tmp_path) -> None:
    target = tmp_path / "failed.pdf"
    shown: list[Path] = []
    dialog = PrintJobStatusDialog(
        language=AppLanguage.RU,
        output_format=PrintOutputFormat.PDF,
        target=target,
        open_folder_callback=lambda path: not shown.append(path),
    )

    dialog.mark_failed("Ошибка рендера")

    assert not dialog.open_button.isEnabled()
    assert dialog.folder_button.isEnabled()
    dialog.folder_button.click()
    assert shown == [tmp_path]
    dialog.close()
'''
          if 'test_failed_file_status_can_still_open_destination_folder' not in source:
              dialog_test.write_text(source + addition, encoding='utf-8')

          Path('.github/workflows/agent-fix-runtime-print.yml').unlink()
          PY
          python -m compileall -q src tests
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep PDF rendering alive on runtime header overflow"
          git push origin HEAD:fix/a4-header-body-adaptive-fit
