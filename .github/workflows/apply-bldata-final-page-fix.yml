name: Apply BLData final-page layout fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-bldata-final-page-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/bldata-final-page-pagination
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock

      - name: Install test environment
        shell: pwsh
        run: |
          uv venv .venv --python 3.11
          uv pip sync requirements/release.lock --python .venv --require-hashes
          uv pip install --python .venv pytest==9.1.1 pytest-asyncio==1.4.0
          uv pip install --python .venv --no-deps --no-build-isolation --editable .

      - name: Patch renderer and add regression tests
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          source_path = Path("src/geoworkbench/printing/page_renderer.py")
          source = source_path.read_text(encoding="utf-8")
          needle = '''    body_bottom = repeated_header.top() - gap_target_height
              available_body_height = max(1.0, body_bottom - y)
              body = QRectF(
          '''.replace("              ", "    ")
          replacement = '''    body_bottom = repeated_header.top() - gap_target_height
              available_body_height = max(1.0, body_bottom - y)
              # The repeated legend is optional. Never resample a complete graph
              # interval merely to force the legend onto the same sheet. A tiny
              # rounding overflow is still absorbed, but a material overflow
              # falls back to the undistorted tablet rendering.
              overflow = body_target_height - available_body_height
              rounding_tolerance = max(2.0, body_target_height * 0.01)
              if overflow > rounding_tolerance:
                  paint_tablet_snapshot(
                      painter,
                      content_rect,
                      snapshot,
                      scale_mode=scale_mode,
                      continuation=continuation,
                      fill_height=False,
                      show_column_header=show_column_header,
                  )
                  return
              body = QRectF(
          '''.replace("              ", "    ")
          if needle not in source:
              raise SystemExit("page_renderer insertion point not found")
          source_path.write_text(source.replace(needle, replacement, 1), encoding="utf-8")

          test_path = Path("tests/test_repeated_header_fit.py")
          test_path.write_text(r'''from __future__ import annotations

from PySide6.QtCore import QRectF
from PySide6.QtGui import QColor, QImage, QPainter, QPixmap

import geoworkbench.printing.page_renderer as page_renderer
from geoworkbench.printing.form_column_layout import AdaptiveColumnLayout
from geoworkbench.printing.print_layout import PrintScaleMode
from geoworkbench.printing.tablet_print import TabletPrintSnapshot


def _snapshot(*, content_height: int, header_height: int) -> TabletPrintSnapshot:
    pixmap = QPixmap(200, content_height)
    pixmap.fill(QColor("white"))
    return TabletPrintSnapshot(
        (pixmap,),
        AdaptiveColumnLayout((200,), spacing=0),
        content_height=content_height,
        header_height=header_height,
    )


def test_material_overflow_omits_bottom_header_instead_of_compressing_graph(
    qapp, monkeypatch
) -> None:
    snapshot = _snapshot(content_height=1000, header_height=300)
    body_calls: list[tuple[QRectF, bool]] = []
    header_calls: list[QRectF] = []

    def record_body(_painter, rect, _snapshot, **kwargs) -> None:
        body_calls.append((QRectF(rect), bool(kwargs["show_column_header"])))

    monkeypatch.setattr(page_renderer, "paint_tablet_snapshot", record_body)
    monkeypatch.setattr(
        page_renderer,
        "paint_tablet_header_repeat",
        lambda _painter, rect, *_args, **_kwargs: header_calls.append(QRectF(rect)),
    )

    canvas = QImage(400, 600, QImage.Format.Format_ARGB32)
    canvas.fill(QColor("white"))
    painter = QPainter(canvas)
    page = QRectF(0.0, 0.0, 400.0, 600.0)
    try:
        page_renderer._paint_tablet_with_repeated_header(
            painter,
            page,
            snapshot,
            scale_mode=PrintScaleMode.FIT,
            continuation=None,
            show_column_header=False,
        )
    finally:
        painter.end()

    assert body_calls == [(page, False)]
    assert header_calls == []


def test_material_overflow_preserves_single_page_top_header(
    qapp, monkeypatch
) -> None:
    snapshot = _snapshot(content_height=1000, header_height=300)
    body_calls: list[bool] = []
    header_calls: list[QRectF] = []

    monkeypatch.setattr(
        page_renderer,
        "paint_tablet_snapshot",
        lambda _painter, _rect, _snapshot, **kwargs: body_calls.append(
            bool(kwargs["show_column_header"])
        ),
    )
    monkeypatch.setattr(
        page_renderer,
        "paint_tablet_header_repeat",
        lambda _painter, rect, *_args, **_kwargs: header_calls.append(QRectF(rect)),
    )

    canvas = QImage(400, 600, QImage.Format.Format_ARGB32)
    canvas.fill(QColor("white"))
    painter = QPainter(canvas)
    try:
        page_renderer._paint_tablet_with_repeated_header(
            painter,
            QRectF(0.0, 0.0, 400.0, 600.0),
            snapshot,
            scale_mode=PrintScaleMode.FIT,
            continuation=None,
            show_column_header=True,
        )
    finally:
        painter.end()

    assert body_calls == [True]
    assert header_calls == []


def test_bottom_header_remains_when_graph_and_legend_fit_without_compression(
    qapp, monkeypatch
) -> None:
    snapshot = _snapshot(content_height=300, header_height=80)
    body_rects: list[QRectF] = []
    header_rects: list[QRectF] = []

    monkeypatch.setattr(
        page_renderer,
        "paint_tablet_snapshot",
        lambda _painter, rect, *_args, **_kwargs: body_rects.append(QRectF(rect)),
    )
    monkeypatch.setattr(
        page_renderer,
        "paint_tablet_header_repeat",
        lambda _painter, rect, *_args, **_kwargs: header_rects.append(QRectF(rect)),
    )

    canvas = QImage(400, 800, QImage.Format.Format_ARGB32)
    canvas.fill(QColor("white"))
    painter = QPainter(canvas)
    try:
        page_renderer._paint_tablet_with_repeated_header(
            painter,
            QRectF(0.0, 0.0, 400.0, 800.0),
            snapshot,
            scale_mode=PrintScaleMode.FIT,
            continuation=None,
            show_column_header=False,
        )
    finally:
        painter.end()

    assert len(body_rects) == 1
    assert len(header_rects) == 1
    assert body_rects[0].height() == 440.0
    assert header_rects[0].bottom() == 800.0
''', encoding="utf-8")
          '@ | .\.venv\Scripts\python.exe -

      - name: Run focused regression tests
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest -q `
            tests/test_repeated_header_fit.py `
            tests/test_print_header_layout.py

      - name: Commit repair branch
        shell: pwsh
        run: |
          git config user.name "07Rinat07"
          git config user.email "102806560+07Rinat07@users.noreply.github.com"
          git add src/geoworkbench/printing/page_renderer.py tests/test_repeated_header_fit.py
          git commit -m "fix: preserve final-page graph scale before repeated header"
          git push origin HEAD:fix/bldata-final-page-pagination

      - name: Remove temporary workflow from main
        shell: pwsh
        run: |
          git fetch origin main
          git switch main
          git reset --hard origin/main
          git rm .github/workflows/apply-bldata-final-page-fix.yml
          git commit -m "ci: remove temporary BLData pagination workflow"
          git push origin main
