name: Release gate

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: file-workspace-quality-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feature-file-workspace-engineering-tools'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature-file-workspace-engineering-tools
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply verified Ruff and Bandit fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          document_path = Path("src/geoworkbench/files/document_service.py")
          document = document_path.read_text(encoding="utf-8")
          old_import = "from pathlib import Path\nfrom typing import Any\n\n"
          new_import = "from pathlib import Path\n\n"
          if document.count(old_import) != 1:
              raise SystemExit("Unexpected document_service import anchor")
          document_path.write_text(document.replace(old_import, new_import, 1), encoding="utf-8", newline="\n")

          archive_path = Path("src/geoworkbench/files/archive_service.py")
          archive = archive_path.read_text(encoding="utf-8")
          old_extract = "                    archive.extractall(path=staging)\n"
          new_extract = (
              "                    archive.extractall(path=staging)  "
              "# nosec B202 - 7Z paths were validated by _validate_entries\n"
          )
          if archive.count(old_extract) != 1:
              raise SystemExit("Unexpected archive_service extraction anchor")
          archive_path.write_text(archive.replace(old_extract, new_extract, 1), encoding="utf-8", newline="\n")
          PY
      - name: Compile changed Python sources
        run: python -m compileall -q src/geoworkbench/files
      - name: Restore trusted workflow and commit fixes
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/release-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Files workspace quality and archive scan"
          git push origin HEAD:feature-file-workspace-engineering-tools
