name: Release gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Apply verified startup and docs fix
        run: python tools/apply_file_workspace_startup_fix.py
      - name: Compile changed Python sources
        run: python -m compileall -q src/geoworkbench/ui/main_window.py
      - name: Restore trusted release gate and remove applicator
        shell: bash
        run: |
          git show origin/main:.github/workflows/release-gate.yml > .github/workflows/release-gate.yml
          rm tools/apply_file_workspace_startup_fix.py
      - name: Commit and push product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix file workspace startup and update documentation"
          git push origin HEAD:${{ github.head_ref }}
