name: Release gate

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: adaptive-mypy-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'improve-adaptive-visual-editors'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve-adaptive-visual-editors
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply type fixes
        run: python scripts/fix_adaptive_mypy.py
      - name: Compile Python sources
        run: python -m compileall -q src/geoworkbench
      - name: Restore trusted workflow and remove one-shot file
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/release-gate.yml
          rm -f scripts/fix_adaptive_mypy.py
      - name: Commit type fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix adaptive editor typing"
          git push origin HEAD:improve-adaptive-visual-editors
