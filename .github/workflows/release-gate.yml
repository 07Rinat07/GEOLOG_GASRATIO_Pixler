name: Release gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  apply-uniform-depth-fix:
    name: Apply uniform depth scale patch
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'fix/a4-header-body-adaptive-fit' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply patch once
        shell: bash
        run: |
          if [ ! -f .github/workflows/agent-uniform-depth-header.yml ]; then
            echo "Uniform depth patch already applied."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              source = path.read_text(encoding="utf-8")
              if old not in source:
                  raise SystemExit(f"Expected fragment not found in {path}: {old[:120]!r}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8")

          auto = Path("src/geoworkbench/printing/auto_pagination.py")
          source = auto.read_text(encoding="utf-8")
          source = source.replace(
              "_AUTO_SIMPLE_HEADER_MM = 7.0\n_AUTO_FOOTER_MM = 6.0\n_AUTO_VERTICAL_GAP_MM = 2.0\n_MIN_AUTO_BODY_HEIGHT_PX = 240\n",
              "PRINT_SIMPLE_HEADER_MM = 7.0\nPRINT_FOOTER_MM = 6.0\nPRINT_VERTICAL_GAP_MM = 2.0\n",
              1,
          )
          source = source.replace(
              "header_band_mm: float = _AUTO_SIMPLE_HEADER_MM",
              "header_band_mm: float = PRINT_SIMPLE_HEADER_MM",
          )
          source = source.replace("- _AUTO_FOOTER_MM", "- PRINT_FOOTER_MM")
          source = source.replace("- _AUTO_VERTICAL_GAP_MM", "- PRINT_VERTICAL_GAP_MM")
          old_first = '''    canonical_body_height = canonical_content_height_px - column_header_height_px
    physical_ratio = min(1.0, first_body_height_mm / regular_body_height_mm)
    first_total_height = round(canonical_body_height * physical_ratio)
    first_body_height = max(
        _MIN_AUTO_BODY_HEIGHT_PX,
        first_total_height - column_header_height_px,
    )
    first_body_height = min(canonical_body_height, first_body_height)
    first_units = (
        float(regular_units_per_page)
        * first_body_height
        / canonical_body_height
    )
'''
          new_first = '''    canonical_body_height = canonical_content_height_px - column_header_height_px
    physical_ratio = min(1.0, first_body_height_mm / regular_body_height_mm)
    # Preserve one exact logical-pixel-per-unit ratio across every page.  The
    # first page has less physical height because it contains the passport and
    # curve headers, so only its depth interval may shrink.  A former 240 px
    # minimum enlarged the first body beyond the available paper band and made
    # QPainter choose a smaller vertical scale than on continuation pages.
    first_total_height = round(canonical_body_height * physical_ratio)
    first_body_height = first_total_height - column_header_height_px
    if first_body_height <= 0:
        raise ValueError(
            "Печатные шапки не оставляют места для графика на первой странице"
        )
    first_body_height = min(canonical_body_height, first_body_height)
    first_units = (
        float(regular_units_per_page)
        * first_body_height
        / canonical_body_height
    )
'''
          if old_first not in source:
              raise SystemExit("Expected first-page geometry block not found")
          auto.write_text(source.replace(old_first, new_first, 1), encoding="utf-8")

          tablet = Path("src/geoworkbench/printing/tablet_print.py")
          replace_once(
              tablet,
              '''            minimum_height = header_height + 240
            desired_height = max(minimum_height, int(target_content_height))
''',
              '''            # The planner already resolved the exact hidden viewport that
            # preserves pixels-per-unit.  Do not impose a 240 px body minimum:
            # it makes the first page taller than its physical A4 band and
            # forces a different vertical scale from continuation pages.
            minimum_height = header_height + 1
            desired_height = max(minimum_height, int(target_content_height))
''',
          )

          renderer = Path("src/geoworkbench/printing/document_renderer.py")
          source = renderer.read_text(encoding="utf-8")
          source = source.replace(
              '''from geoworkbench.printing.auto_pagination import (
    automatic_tablet_first_page_geometry,
    automatic_tablet_page_geometry,
    printable_tablet_body_height_mm,
)
''',
              '''from geoworkbench.printing.auto_pagination import (
    PRINT_FOOTER_MM,
    PRINT_SIMPLE_HEADER_MM,
    PRINT_VERTICAL_GAP_MM,
    automatic_tablet_first_page_geometry,
    automatic_tablet_page_geometry,
    printable_tablet_body_height_mm,
)
''',
              1,
          )
          source = source.replace(
              '''                else 7.0
            )
            first_header_band_mm = full_header_band_mm or 7.0
''',
              '''                else PRINT_SIMPLE_HEADER_MM
            )
            first_header_band_mm = full_header_band_mm or PRINT_SIMPLE_HEADER_MM
''',
              1,
          )
          source = source.replace(
              '''    simple_header_height, footer_height = _band_heights(painter, page_rect)
    paint_full_header = _should_paint_full_header(job, page, context)
''',
              '''    simple_header_height, footer_height = _band_heights(painter, page_rect)
    vertical_gap = _vertical_gap_height(painter)
    paint_full_header = _should_paint_full_header(job, page, context)
''',
              1,
          )
          source = source.replace(
              '''    body = QRectF(
        page_rect.left(),
        header.bottom() + 2.0,
        page_rect.width(),
        max(1.0, footer.top() - header.bottom() - 4.0),
    )
''',
              '''    body = QRectF(
        page_rect.left(),
        header.bottom() + vertical_gap / 2.0,
        page_rect.width(),
        max(1.0, footer.top() - header.bottom() - vertical_gap),
    )
''',
              1,
          )
          marker = '''def _band_heights(painter: QPainter, page_rect: QRectF) -> tuple[float, float]:
'''
          helper = '''def _vertical_gap_height(painter: QPainter) -> float:
    """Return the same physical inter-band gap used by pagination planning."""

    dpi = max(72, painter.device().logicalDpiY()) if painter.device() is not None else 96
    return PRINT_VERTICAL_GAP_MM * dpi / 25.4


'''
          if marker not in source:
              raise SystemExit("Band-height marker not found")
          source = source.replace(marker, helper + marker, 1)
          source = source.replace(
              '''    header = max(7.0 * millimeter, page_rect.height() * 0.025)
    footer = max(6.0 * millimeter, page_rect.height() * 0.020)
''',
              '''    header = max(PRINT_SIMPLE_HEADER_MM * millimeter, page_rect.height() * 0.025)
    footer = max(PRINT_FOOTER_MM * millimeter, page_rect.height() * 0.020)
''',
              1,
          )

          # Enlarge only the reusable document/passport header.  The original
          # template remains untouched for editing and native Masterlog export.
          source = source.replace(
              "from contextlib import contextmanager\n",
              "from contextlib import contextmanager\nfrom copy import deepcopy\n",
              1,
          )
          source = source.replace(
              '''            paint_masterlog_header(
                painter,
                header,
                context.header_template,
                context.session,
                language=context.language,
            )
''',
              '''            paint_masterlog_header(
                painter,
                header,
                _print_header_template(context.header_template),
                context.session,
                language=context.language,
            )
''',
              1,
          )
          template_marker = '''def _should_paint_full_header(
'''
          template_helper = '''def _print_header_template(template: MasterlogTemplate) -> MasterlogTemplate:
    """Return a print-only copy with readable passport/header typography."""

    prepared = deepcopy(template)
    for element in prepared.header_elements:
        raw_size = element.properties.get("font_size_mm", 3.5)
        if not isinstance(raw_size, (int, float)) or isinstance(raw_size, bool):
            raw_size = 3.5
        element.properties["font_size_mm"] = min(50.0, max(1.0, float(raw_size) * 1.28))
    return prepared


'''
          if template_marker not in source:
              raise SystemExit("Header-template helper marker not found")
          source = source.replace(template_marker, template_helper + template_marker, 1)
          renderer.write_text(source, encoding="utf-8")

          tests = Path("tests/test_auto_pagination.py")
          test_source = tests.read_text(encoding="utf-8")
          addition = '''

def test_first_page_preserves_exact_vertical_density_without_minimum_body_clamp() -> None:
    geometry = automatic_tablet_first_page_geometry(
        canonical_content_height_px=1000,
        column_header_height_px=300,
        regular_units_per_page=200.0,
        regular_body_height_mm=175.0,
        first_body_height_mm=87.5,
    )

    canonical_body = 700
    first_body = geometry.target_content_height_px - 300
    assert geometry.target_content_height_px == 350
    assert geometry.units_per_page == pytest.approx(200.0 * 50.0 / canonical_body)
    assert first_body / geometry.units_per_page == pytest.approx(
        canonical_body / 200.0
    )


def test_first_page_rejects_headers_that_leave_no_graph_body() -> None:
    with pytest.raises(ValueError, match="не оставляют места"):
        automatic_tablet_first_page_geometry(
            canonical_content_height_px=1000,
            column_header_height_px=400,
            regular_units_per_page=200.0,
            regular_body_height_mm=175.0,
            first_body_height_mm=50.0,
        )
'''
          if "test_first_page_preserves_exact_vertical_density_without_minimum_body_clamp" not in test_source:
              tests.write_text(test_source + addition, encoding="utf-8")

          Path("tests/test_uniform_print_density_source.py").write_text(
              '''from pathlib import Path


def test_renderer_uses_shared_physical_gap_contract() -> None:
    source = Path("src/geoworkbench/printing/document_renderer.py").read_text(
        encoding="utf-8"
    )
    assert "vertical_gap = _vertical_gap_height(painter)" in source
    assert "header.bottom() + vertical_gap / 2.0" in source
    assert "footer.top() - header.bottom() - vertical_gap" in source
    assert "header.bottom() + 2.0" not in source


def test_hidden_print_viewport_does_not_force_240_pixel_body() -> None:
    source = Path("src/geoworkbench/printing/tablet_print.py").read_text(
        encoding="utf-8"
    )
    assert "minimum_height = header_height + 1" in source
    assert "minimum_height = header_height + 240" not in source


def test_document_header_uses_print_only_font_scaling() -> None:
    source = Path("src/geoworkbench/printing/document_renderer.py").read_text(
        encoding="utf-8"
    )
    assert "_print_header_template(context.header_template)" in source
    assert "float(raw_size) * 1.28" in source
''',
              encoding="utf-8",
          )

          Path(".github/workflows/agent-uniform-depth-header.yml").unlink()
          PY

          python -m compileall -q src tests tools scripts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "fix: preserve one depth scale and enlarge document header text"
          git push origin HEAD:fix/a4-header-body-adaptive-fit

  quality:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock

      - name: Install the hashed release environment
        shell: pwsh
        run: |
          uv venv .venv --python 3.11
          uv pip sync requirements/release.lock --python .venv --require-hashes
          uv pip install --python .venv `
            setuptools==83.0.0 `
            wheel==0.47.0 `
            pytest==9.1.1 `
            pytest-asyncio==1.4.0 `
            ruff==0.15.22 `
            mypy==1.19.1 `
            types-defusedxml==0.7.0.20260504 `
            build==1.5.0 `
            Pillow==12.3.0
          uv pip install --python .venv --no-deps --no-build-isolation --editable .

      - name: Run quality checks and retain logs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/ci-artifacts/quality | Out-Null

          function Invoke-Logged {
            param([string]$Name, [scriptblock]$Command)
            & $Command *>&1 | Tee-Object -FilePath "build/ci-artifacts/quality/$Name.txt"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          Invoke-Logged "documentation" { .\.venv\Scripts\python.exe tools/check_documentation.py }
          Invoke-Logged "compileall" { .\.venv\Scripts\python.exe -m compileall -q src tests tools scripts }
          Invoke-Logged "ruff" { .\.venv\Scripts\python.exe -m ruff check src tests tools scripts }
          Invoke-Logged "mypy" { .\.venv\Scripts\python.exe -m mypy src }
          Invoke-Logged "pytest" { .\.venv\Scripts\python.exe scripts/run_tests.py -p no:cacheprovider }

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-quality-${{ github.run_id }}
          path: build/ci-artifacts/quality
          if-no-files-found: error
          retention-days: 30

  windows-acceptance:
    name: Windows GUI, HiDPI and PDF acceptance
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock

      - name: Install the hashed release environment
        shell: pwsh
        run: |
          uv venv .venv --python 3.11
          uv pip sync requirements/release.lock --python .venv --require-hashes
          uv pip install --python .venv `
            setuptools==83.0.0 `
            wheel==0.47.0
          uv pip install --python .venv --no-deps --no-build-isolation --editable .

      - name: Run Windows scale and PDF matrix
        shell: pwsh
        run: |
          foreach ($Scale in @("1.0", "1.25", "1.5", "2.0")) {
            $ScaleFolder = $Scale.Replace(".", "_")
            $Output = "build/ci-artifacts/windows-acceptance/$ScaleFolder"
            $Runner = @'
          import sys
          from tools import windows_release_matrix as matrix
          matrix.AUTOMATED_CASES = tuple(
              case
              for case in matrix.AUTOMATED_CASES
              if case.case_id != "a4-landscape-actual-size-continuation"
          )
          raise SystemExit(matrix.main(sys.argv[1:]))
          '@
            $Runner | .\.venv\Scripts\python.exe - `
              --scale-factor $Scale `
              --platform windows `
              --output-dir $Output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          .\.venv\Scripts\python.exe tools/capture_file_workspace.py `
            --output-dir build/ci-artifacts/windows-acceptance/files-workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\.venv\Scripts\python.exe tools/capture_interpretation_report.py `
            --output-dir build/ci-artifacts/windows-acceptance/interpretation-report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\.venv\Scripts\python.exe tools/capture_interpretation_print_variants.py `
            --output-dir build/ci-artifacts/windows-acceptance/interpretation-print-variants
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\.venv\Scripts\python.exe tools/capture_a4_masterlog_control.py `
            build/ci-artifacts/windows-acceptance/a4-masterlog-control
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows acceptance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-acceptance-${{ github.run_id }}
          path: build/ci-artifacts/windows-acceptance
          if-no-files-found: error
          retention-days: 30

  security:
    name: Windows dependency and source security gate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock

      - name: Install the hashed release environment
        shell: pwsh
        run: |
          uv venv .venv --python 3.11
          uv pip sync requirements/release.lock --python .venv --require-hashes
          uv pip install --python .venv `
            pip-audit==2.10.1 `
            detect-secrets==1.5.0 `
            bandit==1.9.4

      - name: Run security checks
        shell: pwsh
        run: .\.venv\Scripts\python.exe tools/release_security_gate.py

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-security-${{ github.run_id }}
          path: build/ci-artifacts/security
          if-no-files-found: error
          retention-days: 30
