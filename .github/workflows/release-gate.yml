name: Release gate

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: refine-header-workspace-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refine:
    if: github.event.pull_request.head.ref == 'improve-header-fullscreen-assistant'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve-header-fullscreen-assistant
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply interaction refinements
        run: |
          python scripts/fix_refine_applicator.py
          python scripts/refine_header_workspace.py
      - name: Compile Python sources
        run: python -m compileall -q src/geoworkbench scripts
      - name: Restore trusted workflow and remove applicators
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/release-gate.yml
          rm -f scripts/refine_header_workspace.py
          rm -f scripts/fix_refine_applicator.py
      - name: Commit product refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine header workspace interactions"
          git push origin HEAD:improve-header-fullscreen-assistant
