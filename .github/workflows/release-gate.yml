name: Apply print UI type fix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'fix/failing-tests-f2a94b6'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Patch callback typing and clean diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/geoworkbench/ui/print_center_dialog.py")
          text = path.read_text(encoding="utf-8")
          old_state = (
              "        preview_available = has_header and self.header_preview_callback is not None\n"
              "        self.header_preview_toggle.setEnabled(preview_available)\n"
              "        if not preview_available:\n"
          )
          new_state = (
              "        preview_callback = self.header_preview_callback\n"
              "        preview_available = catalog_id is not None and preview_callback is not None\n"
              "        self.header_preview_toggle.setEnabled(preview_available)\n"
              "        if catalog_id is None or preview_callback is None:\n"
          )
          if old_state in text:
              text = text.replace(old_state, new_state, 1)
          elif new_state not in text:
              raise SystemExit("header preview state block not found")

          old_call = "            pixmap = self.header_preview_callback(catalog_id)\n"
          new_call = "            pixmap = preview_callback(catalog_id)\n"
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit("header preview callback call not found")
          path.write_text(text, encoding="utf-8")

          Path(".ci-trigger-f2a94b6").unlink(missing_ok=True)
          Path(".github/workflows/agent-fix-mypy.yml").unlink(missing_ok=True)
          PY

          git fetch origin main --depth=1
          git show origin/main:.github/workflows/release-gate.yml > .github/workflows/release-gate.yml

      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve print UI mypy errors"
          git push origin HEAD:fix/failing-tests-f2a94b6
