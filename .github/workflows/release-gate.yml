name: Release gate

on:
  push:
    branches:
      - improve-adaptive-visual-editors

permissions:
  contents: write

concurrency:
  group: adaptive-visual-editor-applicator
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve-adaptive-visual-editors
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply adaptive visual editor changes
        run: python scripts/apply_adaptive_visual_editors.py
      - name: Compile Python sources
        run: python -m compileall -q src/geoworkbench scripts
      - name: Restore trusted workflow and remove one-shot files
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/release-gate.yml
          rm -f .github/workflows/apply-adaptive-visual-editors.yml
          rm -f scripts/apply_adaptive_visual_editors.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve adaptive visual editors"
          git push origin HEAD:improve-adaptive-visual-editors
