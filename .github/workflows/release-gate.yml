name: Release gate

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: file-workspace-pixmap-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feature-file-workspace-engineering-tools'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature-file-workspace-engineering-tools
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply verified PySide6 runtime fix
        run: python tools/fix_pr16_pixmap_runtime.py
      - name: Compile changed source
        run: python -m compileall -q src/geoworkbench/ui/file_workspace_widget.py
      - name: Restore trusted workflow and remove applicator
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/release-gate.yml
          rm tools/fix_pr16_pixmap_runtime.py
      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Files workspace pixmap loading'
          git push origin HEAD:feature-file-workspace-engineering-tools
