name: Apply interpretation report fix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: apply-interpretation-report-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-report-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix-interpretation-report-readability'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply reviewed report patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/report-fix-patch/part-* > "$RUNNER_TEMP/report-fix.patch.gz"
          gzip -dc "$RUNNER_TEMP/report-fix.patch.gz" > "$RUNNER_TEMP/report-fix.patch"
          git apply --check "$RUNNER_TEMP/report-fix.patch"
          git apply "$RUNNER_TEMP/report-fix.patch"
          rm -rf .github/report-fix-patch
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Унифицировал отчёты интерпретации и статистику газа"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
