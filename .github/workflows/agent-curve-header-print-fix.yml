name: Apply readable curve header print fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'fix/a4-header-body-adaptive-fit' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a4-header-body-adaptive-fit
          fetch-depth: 0
      - name: Apply readable print header patches
        shell: bash
        run: |
          for patch in \
            .github/patches/curve-header-geometry.patch \
            .github/patches/curve-header-tablet-view.patch \
            .github/patches/curve-header-document-renderer.patch \
            .github/patches/curve-header-tablet-print.patch \
            .github/patches/curve-header-source-tests.patch \
            .github/patches/curve-header-qt-test.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          rm .github/patches/curve-header-geometry.patch
          rm .github/patches/curve-header-tablet-view.patch
          rm .github/patches/curve-header-document-renderer.patch
          rm .github/patches/curve-header-tablet-print.patch
          rm .github/patches/curve-header-source-tests.patch
          rm .github/patches/curve-header-qt-test.patch
          rm .github/workflows/agent-curve-header-print-fix.yml
          python -m compileall -q src tests
          git diff --check
      - name: Commit applied fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enlarge curve header typography for A4 print"
          git push origin HEAD:fix/a4-header-body-adaptive-fit
