name: Apply A4 constructor stage 2

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/a4-form-constructor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/a4-form-constructor
          fetch-depth: 0
      - name: Apply reviewed constructor patches
        shell: bash
        run: |
          set -euo pipefail
          for patch in .github/a4-constructor-patches/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          rm -rf .github/a4-constructor-patches
          rm -f .github/workflows/apply-a4-constructor-stage2.yml
          python -m compileall -q src tests
          git diff --check
      - name: Commit stage 2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add A4-aware form constructor"
          git push origin HEAD:feature/a4-form-constructor
