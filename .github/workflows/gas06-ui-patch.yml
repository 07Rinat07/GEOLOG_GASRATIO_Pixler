name: GAS-06 UI patch

on:
  push:
    branches:
      - feat/gas-conditioning-qc-ui
    paths:
      - .github/scripts/gas06_ui_patch.py
      - .github/workflows/gas06-ui-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/gas-conditioning-qc-ui
          fetch-depth: 0

      - name: Apply UI patch and remove patch machinery
        run: python .github/scripts/gas06_ui_patch.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit patched feature tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(ui): expose gas conditioning QC provenance"
          git push origin HEAD:feat/gas-conditioning-qc-ui
