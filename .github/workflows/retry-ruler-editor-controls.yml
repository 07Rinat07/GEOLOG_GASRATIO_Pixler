name: Retry ruler editor controls

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retry-ruler-editor-controls.yml

permissions:
  contents: write

concurrency:
  group: retry-ruler-editor-controls
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Extract and apply guarded patch
        id: patch
        continue-on-error: true
        shell: pwsh
        run: |
          @'
          from __future__ import annotations

          from pathlib import Path
          import re
          import subprocess
          import sys
          import textwrap

          workflow = Path(".github/workflows/integrate-ruler-editor-controls.yml")
          text = workflow.read_text(encoding="utf-8")
          match = re.search(r"\$patch = @'\n(?P<patch>.*?)\n\s*'@", text, re.DOTALL)
          if match is None:
              raise RuntimeError("Embedded patch block was not found")
          patch = textwrap.dedent(match.group("patch"))
          result = subprocess.run(
              [sys.executable, "-"],
              input=patch,
              text=True,
              capture_output=True,
              check=False,
          )
          Path("patch-output.txt").write_text(
              result.stdout + result.stderr,
              encoding="utf-8",
          )
          raise SystemExit(result.returncode)
          '@ | python -

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        if: steps.patch.outcome == 'success'
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock

      - name: Install test environment
        id: install
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          uv venv .venv --python 3.11 2>&1 | Tee-Object install-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync requirements/release.lock --python .venv --require-hashes 2>&1 | Tee-Object -Append install-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv pytest==9.1.1 ruff==0.15.22 2>&1 | Tee-Object -Append install-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv --no-deps --no-build-isolation --editable . 2>&1 | Tee-Object -Append install-output.txt
          exit $LASTEXITCODE

      - name: Verify editor contract
        id: verify
        if: steps.patch.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          .\.venv\Scripts\python.exe -m compileall -q src/geoworkbench/ui/tablet_track_editor_dialog.py tests/test_vertical_ruler_track_editor.py 2>&1 | Tee-Object verify-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m ruff check src/geoworkbench/ui/tablet_track_editor_dialog.py tests/test_vertical_ruler_track_editor.py 2>&1 | Tee-Object -Append verify-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pytest -q -p no:cacheprovider tests/test_vertical_ruler_settings.py tests/test_vertical_ruler_persistence.py tests/test_vertical_ruler_track_editor.py 2>&1 | Tee-Object -Append verify-output.txt
          exit $LASTEXITCODE

      - name: Commit verified implementation or diagnostic
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item .github/workflows/integrate-ruler-editor-controls.yml -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/retry-ruler-editor-controls.yml -ErrorAction SilentlyContinue

          $ok = "${{ steps.patch.outcome }}" -eq "success" -and "${{ steps.install.outcome }}" -eq "success" -and "${{ steps.verify.outcome }}" -eq "success"
          if (-not $ok) {
            $phase = if ("${{ steps.patch.outcome }}" -ne "success") { "patch" } elseif ("${{ steps.install.outcome }}" -ne "success") { "install" } else { "verify" }
            $lines = @("phase=$phase")
            foreach ($file in @("patch-output.txt", "install-output.txt", "verify-output.txt")) {
              if (Test-Path $file) {
                $lines += "--- $file ---"
                $lines += Get-Content $file
              }
            }
            $lines | Set-Content .github/ruler-editor-integration-error.txt -Encoding utf8
            git add -A
            git commit -m "ci: record ruler editor integration failure"
            git push origin HEAD:main
            exit 0
          }

          Remove-Item patch-output.txt, install-output.txt, verify-output.txt -ErrorAction SilentlyContinue
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "feat: expose shared ruler controls in track editor"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
