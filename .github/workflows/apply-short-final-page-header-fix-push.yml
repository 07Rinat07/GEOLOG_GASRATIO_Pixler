name: Apply short final-page header patch

on:
  push:
    branches:
      - fix/short-final-page-header-geometry

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source and test changes
        run: python tools/apply_short_final_page_header_fix.py
      - name: Remove temporary patch files and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-short-final-page-header-fix.yml
          rm -f .github/workflows/apply-short-final-page-header-fix-push.yml
          rm -f tools/apply_short_final_page_header_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: stabilize short final-page header geometry"
          git push origin HEAD:fix/short-final-page-header-geometry
