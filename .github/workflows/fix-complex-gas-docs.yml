name: Fix complex gas documentation contract

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  fix-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complex-gas-form-a4
          fetch-depth: 0
      - name: Update documentation index and runtime contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = '<!-- runtime-contract: package=0.7.93; project=v22; form=v13; layout=v21 -->'
          for name in ('ARCHITECTURE.md', 'PROJECT_PLAN.md'):
              path = Path('docs') / name
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              matches = [index for index, line in enumerate(lines) if 'runtime-contract:' in line]
              if len(matches) != 1:
                  raise RuntimeError(f'{name}: expected one runtime contract, found {len(matches)}')
              lines[matches[0]] = expected
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          index_path = Path('docs/DOCUMENTATION_INDEX.md')
          index = index_path.read_text(encoding='utf-8')
          link = '- Комплексная газовая форма C1–C5: [COMPLEX_GAS_FORM.md](COMPLEX_GAS_FORM.md).\n'
          if link not in index:
              anchor = (
                  '- Формы и планшет: [FORM_ENGINE.md](FORM_ENGINE.md),\n'
                  '  [TABLET_DEPTH_TIME_NAVIGATION.md](TABLET_DEPTH_TIME_NAVIGATION.md),\n'
                  '  [TABLET_RENDERING_BENCHMARKS.md](TABLET_RENDERING_BENCHMARKS.md).\n'
              )
              if index.count(anchor) != 1:
                  raise RuntimeError('documentation index anchor is missing or ambiguous')
              index = index.replace(anchor, anchor + link, 1)
          index_path.write_text(index, encoding='utf-8')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify documentation
        run: python tools/check_documentation.py
      - name: Commit documentation fix
        run: |
          rm -f .github/workflows/fix-complex-gas-docs.yml docs/.complex-gas-docs-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: register complex gas form and current contract'
          git push origin HEAD:feature/complex-gas-form-a4
