name: Fix LBA inspection text

on:
  push:
    branches:
      - fix/lba-print-ci-cleanup

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve readable LBA values outside narrow columns
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/geoworkbench/printing/masterlog_inspection.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              "from geoworkbench.services.lba_standard import lba_color_code\n",
              "",
          )
          replacements = {
              "                lba_color_code(sample.lba_color),\n":
                  "                (sample.lba_color or \"\").strip(),\n",
              "                lba_color_code(sample.lba_cut_color),\n":
                  "                (sample.lba_cut_color or \"\").strip(),\n",
              "                lba_color_code(sample.lba_residue_color),\n":
                  "                (sample.lba_residue_color or \"\").strip(),\n",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"Expected source fragment not found: {old!r}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          Path(".github/workflows/agent-fix-lba-inspection.yml").unlink()
          PY
          python -m compileall -q src tests
          git diff --check
      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve readable LBA inspection text"
          git push origin HEAD:fix/lba-print-ci-cleanup
