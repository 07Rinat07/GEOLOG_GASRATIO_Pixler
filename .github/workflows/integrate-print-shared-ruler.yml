name: Integrate print shared ruler

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/integrate-print-shared-ruler.yml

permissions:
  contents: write

concurrency:
  group: integrate-print-shared-ruler
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock

      - name: Apply and verify print shared ruler
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONPATH: src
        run: |
          $output = Join-Path $env:RUNNER_TEMP "print-shared-ruler-output.txt"
          $phase = "patch"
          python tools/_integrate_print_shared_ruler.py *> $output
          $failed = $LASTEXITCODE -ne 0

          if (-not $failed) {
            $phase = "install"
            uv venv .venv --python 3.11 *>> $output
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            uv pip sync requirements/release.lock --python .venv --require-hashes *>> $output
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            uv pip install --python .venv `
              pytest==9.1.1 `
              ruff==0.15.22 `
              mypy==1.19.1 `
              types-defusedxml==0.7.0.20260504 *>> $output
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }

          if (-not $failed) {
            $phase = "documentation"
            .\.venv\Scripts\python.exe tools/check_documentation.py *>> $output
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            $phase = "compile"
            .\.venv\Scripts\python.exe -m compileall -q `
              src/geoworkbench/tablet/tablet_view.py `
              src/geoworkbench/printing/tablet_print.py `
              tests/test_tablet_print_shared_vertical_ruler.py *>> $output
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            $phase = "ruff"
            .\.venv\Scripts\python.exe -m ruff check `
              src/geoworkbench/tablet/tablet_view.py `
              src/geoworkbench/printing/tablet_print.py `
              tests/test_tablet_print_shared_vertical_ruler.py *>> $output
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            $phase = "mypy"
            .\.venv\Scripts\python.exe -m mypy `
              src/geoworkbench/tablet/tablet_view.py `
              src/geoworkbench/printing/tablet_print.py *>> $output
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            $phase = "pytest"
            .\.venv\Scripts\python.exe -m pytest -q -p no:cacheprovider `
              tests/test_vertical_ruler_settings.py `
              tests/test_vertical_ruler_persistence.py `
              tests/test_vertical_ruler_track_editor.py `
              tests/test_tablet_shared_vertical_ruler.py `
              tests/test_tablet_print_shared_vertical_ruler.py `
              tests/test_tablet_view.py::test_track_print_mode_hides_header_editor_actions_and_scrollbar `
              tests/test_compact_parameter_rulers_0767.py `
              tests/test_curve_header_readability_0753.py *>> $output
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ($failed) {
            $details = @("phase=$phase", "--- print-shared-ruler-output.txt ---")
            if (Test-Path $output) { $details += Get-Content $output }
            git reset --hard HEAD
            git clean -fd
            Remove-Item .github/workflows/integrate-print-shared-ruler.yml -ErrorAction SilentlyContinue
            Remove-Item tools/_integrate_print_shared_ruler.py -ErrorAction SilentlyContinue
            $details | Set-Content .github/print-shared-ruler-error.txt -Encoding utf8
            git add -A
            git commit -m "ci: record print shared-ruler integration error"
            git push origin HEAD:main
            exit 0
          }

          Remove-Item .github/print-shared-ruler-error.txt -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/integrate-print-shared-ruler.yml -ErrorAction SilentlyContinue
          Remove-Item tools/_integrate_print_shared_ruler.py -ErrorAction SilentlyContinue
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "feat: share vertical rulers with preview and print"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
