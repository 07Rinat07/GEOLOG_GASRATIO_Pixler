name: Apply robust Windows PDF export fix

on:
  push:
    branches: [fix/windows-pdf-export-retry]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch Windows PDF export and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/geoworkbench/printing/document_export.py")
          source = source_path.read_text(encoding="utf-8")

          source = source.replace("import tempfile\n", "import tempfile\nimport time\n", 1)
          source = source.replace(
              "from PySide6.QtWidgets import QWidget\n",
              "from PySide6.QtWidgets import QWidget\nimport shiboken6\n",
              1,
          )

          old_export = '''        os.replace(temporary, destination)
              return PrintDocumentResult((destination,), page_count)
          except Exception as exc:
              temporary.unlink(missing_ok=True)
              if isinstance(exc, (DocumentExportError, UnicodePrintError, ValueError)):
                  raise
              raise DocumentExportError(f"Не удалось экспортировать PDF: {destination}") from exc
          '''
          old_export = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in old_export.splitlines()
          ) + "\n"
          new_export = '''        _replace_pdf_file(temporary, destination)
              return PrintDocumentResult((destination,), page_count)
          except Exception as exc:
              try:
                  temporary.unlink(missing_ok=True)
              except OSError:
                  pass
              if isinstance(exc, (DocumentExportError, UnicodePrintError, ValueError)):
                  raise
              raise DocumentExportError(
                  f"Не удалось экспортировать PDF: {destination}: {exc}"
              ) from exc
          '''
          new_export = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new_export.splitlines()
          ) + "\n"
          if source.count(old_export) != 1:
              raise SystemExit(f"Expected one PDF export block, found {source.count(old_export)}")
          source = source.replace(old_export, new_export, 1)

          old_release = '''        # QPdfWriter owns the Windows file handle until its wrapper is destroyed.
              # Release QPainter first, then the writer, before os.replace() runs.
              del painter
              del writer
          '''
          old_release = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in old_release.splitlines()
          ) + "\n"
          new_release = '''        # QPdfWriter owns the Windows file handle until its wrapped C++
              # instance is destroyed. Dropping only the Python reference is not
              # sufficient on every PySide/Windows runtime.
              del painter
              try:
                  if shiboken6.isValid(writer):
                      shiboken6.delete(writer)
              except (TypeError, RuntimeError):
                  pass
              del writer
          '''
          new_release = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new_release.splitlines()
          ) + "\n"
          if source.count(old_release) != 1:
              raise SystemExit(f"Expected one writer release block, found {source.count(old_release)}")
          source = source.replace(old_release, new_release, 1)

          marker = "\n\ndef export_document_pages(\n"
          helper = '''

          _PDF_REPLACE_RETRY_TIMEOUT_SECONDS = 2.0
          _PDF_REPLACE_RETRY_INTERVAL_SECONDS = 0.05


          def _replace_pdf_file(temporary: Path, destination: Path) -> None:
              """Publish a PDF after a transient Windows sharing lock clears."""

              deadline = time.monotonic() + _PDF_REPLACE_RETRY_TIMEOUT_SECONDS
              while True:
                  try:
                      os.replace(temporary, destination)
                      return
                  except OSError as exc:
                      if getattr(exc, "winerror", None) not in {5, 32}:
                          raise
                      if time.monotonic() >= deadline:
                          raise
                      time.sleep(_PDF_REPLACE_RETRY_INTERVAL_SECONDS)
          '''
          helper = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in helper.splitlines()
          ) + "\n"
          if source.count(marker) != 1:
              raise SystemExit(f"Expected one export pages marker, found {source.count(marker)}")
          source = source.replace(marker, helper + marker, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_pdf_export_windows.py")
          test_path.write_text(
              '''from __future__ import annotations

          import os

          import pytest
          from PySide6.QtPdf import QPdfDocument
          from PySide6.QtWidgets import QLabel

          from geoworkbench.printing import document_export
          from geoworkbench.printing.document_export import DocumentExportError
          from geoworkbench.printing.document_renderer import PrintDocumentContext
          from geoworkbench.printing.print_job import PrintJobSettings, PrintOutputFormat


          class _SharingViolation(PermissionError):
              def __init__(self) -> None:
                  super().__init__(13, "sharing violation")
                  self.winerror = 32


          def test_replace_pdf_file_retries_transient_sharing_violation(
              tmp_path, monkeypatch
          ) -> None:
              temporary = tmp_path / ".report.pdf.tmp"
              destination = tmp_path / "report.pdf"
              temporary.write_bytes(b"%PDF-1.4\\n")
              real_replace = os.replace
              attempts = 0

              def flaky_replace(source, target) -> None:
                  nonlocal attempts
                  attempts += 1
                  if attempts < 3:
                      raise _SharingViolation()
                  real_replace(source, target)

              monkeypatch.setattr(document_export.os, "replace", flaky_replace)
              monkeypatch.setattr(document_export.time, "sleep", lambda _seconds: None)

              document_export._replace_pdf_file(temporary, destination)

              assert attempts == 3
              assert destination.read_bytes().startswith(b"%PDF-1.4")
              assert not temporary.exists()


          def test_replace_pdf_file_does_not_retry_unrelated_error(
              tmp_path, monkeypatch
          ) -> None:
              temporary = tmp_path / ".report.pdf.tmp"
              destination = tmp_path / "report.pdf"
              temporary.write_bytes(b"%PDF-1.4\\n")
              attempts = 0

              def failing_replace(_source, _target) -> None:
                  nonlocal attempts
                  attempts += 1
                  raise OSError("disk failure")

              monkeypatch.setattr(document_export.os, "replace", failing_replace)

              with pytest.raises(OSError, match="disk failure"):
                  document_export._replace_pdf_file(temporary, destination)
              assert attempts == 1


          def test_pdf_export_error_includes_underlying_reason(
              tmp_path, monkeypatch
          ) -> None:
              target = tmp_path / "report.pdf"
              temporary = tmp_path / ".report.pdf.tmp"
              temporary.write_bytes(b"")
              monkeypatch.setattr(document_export, "_detached_tablet_source", lambda _w: None)
              monkeypatch.setattr(document_export, "_validate_destination", lambda *_a: None)
              monkeypatch.setattr(document_export, "_unicode_preflight", lambda *_a: None)
              monkeypatch.setattr(document_export, "_temporary_path", lambda _p: temporary)

              def fail_render(*_args, **_kwargs):
                  raise OSError("renderer exploded")

              monkeypatch.setattr(document_export, "_render_document_pdf_file", fail_render)
              job = PrintJobSettings(output_format=PrintOutputFormat.PDF, target=target)

              with pytest.raises(DocumentExportError, match="renderer exploded"):
                  document_export.export_document_pdf(
                      object(),
                      target,
                      job,
                      context=PrintDocumentContext("Diagnostics"),
                  )


          def test_repeated_real_pdf_exports_leave_no_temporary_files(
              qapp, tmp_path
          ) -> None:
              widget = QLabel("LAS / GeoScape II PDF export")
              widget.resize(500, 240)
              widget.show()
              qapp.processEvents()

              for index in range(3):
                  target = tmp_path / f"report-{index}.pdf"
                  job = PrintJobSettings(
                      output_format=PrintOutputFormat.PDF,
                      target=target,
                      dpi=96,
                  )
                  document_export.export_document_pdf(
                      widget,
                      target,
                      job,
                      context=PrintDocumentContext("Repeated PDF export"),
                  )
                  document = QPdfDocument()
                  assert document.load(str(target)) == QPdfDocument.Error.None_
                  assert document.pageCount() == 1

              assert not tuple(tmp_path.glob(".*.tmp"))
              widget.close()
          '''.replace("          ", ""),
              encoding="utf-8",
          )

          Path(".github/workflows/apply-windows-pdf-export-retry.yml").unlink()
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/geoworkbench/printing/document_export.py tests/test_pdf_export_windows.py .github/workflows/apply-windows-pdf-export-retry.yml
          git commit -m "fix: harden Windows PDF export finalization"
          git push origin HEAD:fix/windows-pdf-export-retry
