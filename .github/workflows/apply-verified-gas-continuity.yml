name: Apply verified unified gas continuity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-verified-gas-continuity.yml

permissions:
  contents: write

concurrency:
  group: apply-verified-gas-continuity
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock

      - name: Apply and verify continuity
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONPATH: src
        run: |
          $output = Join-Path $env:RUNNER_TEMP "gas-continuity-output.txt"
          $phase = "patch"
          python tools/_apply_verified_gas_continuity.py *> $output
          $failed = $LASTEXITCODE -ne 0
          if (-not $failed) {
            $phase = "install"
            uv venv .venv --python 3.11 *>> $output
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            uv pip sync requirements/release.lock --python .venv --require-hashes *>> $output
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            uv pip install --python .venv pytest==9.1.1 ruff==0.15.22 mypy==1.19.1 types-defusedxml==0.7.0.20260504 *>> $output
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            $phase = "documentation"
            .\.venv\Scripts\python.exe tools/check_documentation.py *>> $output
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            $phase = "compile"
            .\.venv\Scripts\python.exe -m compileall -q src/geoworkbench/calculations/curve_continuity.py src/geoworkbench/calculations/gas_conditioning.py src/geoworkbench/tablet/sampling.py src/geoworkbench/tablet/relative_gas.py src/geoworkbench/tablet/tablet_view.py tests/test_curve_continuity_policy.py tests/test_tablet_gas_segment_mask.py *>> $output
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            $phase = "ruff"
            .\.venv\Scripts\python.exe -m ruff check src/geoworkbench/calculations/curve_continuity.py src/geoworkbench/calculations/gas_conditioning.py src/geoworkbench/tablet/sampling.py src/geoworkbench/tablet/geometry_cache.py src/geoworkbench/tablet/relative_gas.py src/geoworkbench/tablet/tablet_view.py tests/test_curve_continuity_policy.py tests/test_gas_conditioning.py tests/test_gas_curve_rendering_continuity.py tests/test_tablet_gas_segment_mask.py *>> $output
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            $phase = "mypy"
            .\.venv\Scripts\python.exe -m mypy src/geoworkbench/calculations/curve_continuity.py src/geoworkbench/calculations/gas_conditioning.py src/geoworkbench/tablet/sampling.py src/geoworkbench/tablet/geometry_cache.py src/geoworkbench/tablet/relative_gas.py src/geoworkbench/tablet/tablet_view.py *>> $output
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            $phase = "pytest"
            .\.venv\Scripts\python.exe -m pytest -q -p no:cacheprovider tests/test_curve_continuity_policy.py tests/test_gas_conditioning.py tests/test_gas_curve_rendering_continuity.py tests/test_tablet_gas_segment_mask.py tests/test_tablet_shared_vertical_ruler.py tests/test_tablet_print_shared_vertical_ruler.py *>> $output
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ($failed) {
            $details = @("phase=$phase", "--- gas-continuity-output.txt ---")
            if (Test-Path $output) { $details += Get-Content $output }
            git reset --hard HEAD
            git clean -fd
            Remove-Item .github/workflows/apply-verified-gas-continuity.yml -ErrorAction SilentlyContinue
            Remove-Item tools/_apply_verified_gas_continuity.py -ErrorAction SilentlyContinue
            $details | Set-Content .github/gas-continuity-error.txt -Encoding utf8
            git add -A
            git commit -m "ci: record verified gas continuity error"
            git push origin HEAD:main
            exit 0
          }

          Remove-Item .github/gas-continuity-error.txt -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/apply-verified-gas-continuity.yml -ErrorAction SilentlyContinue
          Remove-Item tools/_apply_verified_gas_continuity.py -ErrorAction SilentlyContinue
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "fix: unify gas conditioning and rendered segment continuity"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
