name: GAS-06 v24 documentation sync

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.head_ref == 'feat/gas-conditioning-qc-persistence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gas-conditioning-qc-persistence
          fetch-depth: 0
      - name: Synchronize v24 documentation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected one match in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          contract_v23 = "<!-- runtime-contract: package=0.7.93; project=v23; form=v16; layout=v24 -->"
          contract_v24 = "<!-- runtime-contract: package=0.7.93; project=v24; form=v16; layout=v24 -->"
          replace_once("docs/ARCHITECTURE.md", contract_v23, contract_v24)
          replace_once("docs/PROJECT_PLAN.md", contract_v23, contract_v24)
          replace_once(
              "docs/ARCHITECTURE.md",
              "только после этого вызывает project\ncodec v23.",
              "только после этого вызывает project\ncodec v24.",
          )
          replace_once(
              "docs/DOCUMENTATION_INDEX.md",
              "  [OPUS_GASOMER_IMPLEMENTATION.md](OPUS_GASOMER_IMPLEMENTATION.md),\n  [NORMALIZED_GAS.md](NORMALIZED_GAS.md),",
              "  [OPUS_GASOMER_IMPLEMENTATION.md](OPUS_GASOMER_IMPLEMENTATION.md),\n  [GAS_CONDITIONING_QC.md](GAS_CONDITIONING_QC.md),\n  [NORMALIZED_GAS.md](NORMALIZED_GAS.md),",
          )
          Path(".github/workflows/gas06-doc-sync.yml").unlink()
      - name: Commit synchronized documentation
        shell: bash
        run: |
          git config user.name "S.Rinat"
          git config user.email "102806560+07Rinat07@users.noreply.github.com"
          git add -A
          git commit -m "docs(gas): sync project v24 runtime contract"
          git push origin HEAD:feat/gas-conditioning-qc-persistence
