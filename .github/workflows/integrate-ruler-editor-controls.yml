name: Integrate ruler editor controls

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/integrate-ruler-editor-controls.yml

permissions:
  contents: write

concurrency:
  group: integrate-ruler-editor-controls
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply guarded editor patch
        shell: pwsh
        run: |
          $patch = @'
          from __future__ import annotations

          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected one replacement, found {count}: {old[:100]!r}"
                  )
              target.write_text(text.replace(old, new, 1), encoding="utf-8")


          dialog = "src/geoworkbench/ui/tablet_track_editor_dialog.py"
          replace_once(
              dialog,
              "from geoworkbench.tablet.models import (\n"
              "    CurveDisplaySettings,\n"
              "    CurveLineStyle,\n"
              "    CurveStyle,\n"
              "    TrackDefinition,\n"
              "    TrackKind,\n"
              "    XScale,\n"
              "    minimum_track_width,\n"
              ")\n",
              "from geoworkbench.tablet.models import (\n"
              "    CurveDisplaySettings,\n"
              "    CurveLineStyle,\n"
              "    CurveStyle,\n"
              "    TrackDefinition,\n"
              "    TrackKind,\n"
              "    XScale,\n"
              "    minimum_track_width,\n"
              ")\n"
              "from geoworkbench.tablet.vertical_ruler import (\n"
              "    VerticalRulerMode,\n"
              "    VerticalRulerTrackSettings,\n"
              ")\n",
          )
          replace_once(
              dialog,
              "        editor_layout.addWidget(track_group)\n\n"
              "        grid_group = QGroupBox(self._text(\"Сетка\", \"Тор\", \"Grid\"))\n",
              "        editor_layout.addWidget(track_group)\n\n"
              "        self.vertical_ruler_group = QGroupBox(\n"
              "            self._text(\n"
              "                \"Внутренняя вертикальная шкала\",\n"
              "                \"Ішкі тік шкала\",\n"
              "                \"Inner vertical ruler\",\n"
              "            )\n"
              "        )\n"
              "        ruler_form = QFormLayout(self.vertical_ruler_group)\n"
              "        ruler_hint = QLabel(\n"
              "            self._text(\n"
              "                \"Колонка использует общие глубины и Y-координаты планшета; здесь можно только изменить видимость и частоту общих отметок.\",\n"
              "                \"Баған планшеттің ортақ тереңдіктері мен Y координаттарын қолданады; мұнда тек ортақ белгілердің көрінуі мен жиілігі өзгереді.\",\n"
              "                \"The column uses the tablet-wide depth values and Y coordinates; only visibility and frequency of shared ticks can be changed here.\",\n"
              "            )\n"
              "        )\n"
              "        ruler_hint.setWordWrap(True)\n"
              "        ruler_form.addRow(ruler_hint)\n"
              "        self.vertical_ruler_mode_input = QComboBox()\n"
              "        self.vertical_ruler_mode_input.addItem(\n"
              "            self._text(\"Автоматически\", \"Автоматты\", \"Automatic\"),\n"
              "            VerticalRulerMode.AUTOMATIC,\n"
              "        )\n"
              "        self.vertical_ruler_mode_input.addItem(\n"
              "            self._text(\n"
              "                \"Цифры и риски\",\n"
              "                \"Сандар мен белгілер\",\n"
              "                \"Labels and ticks\",\n"
              "            ),\n"
              "            VerticalRulerMode.LABELS_AND_TICKS,\n"
              "        )\n"
              "        self.vertical_ruler_mode_input.addItem(\n"
              "            self._text(\"Только риски\", \"Тек белгілер\", \"Ticks only\"),\n"
              "            VerticalRulerMode.TICKS_ONLY,\n"
              "        )\n"
              "        self.vertical_ruler_mode_input.addItem(\n"
              "            self._text(\"Выключено\", \"Өшірулі\", \"Off\"),\n"
              "            VerticalRulerMode.OFF,\n"
              "        )\n"
              "        self.vertical_ruler_mode_input.setCurrentIndex(\n"
              "            max(\n"
              "                0,\n"
              "                self.vertical_ruler_mode_input.findData(\n"
              "                    self.track.vertical_ruler.mode\n"
              "                ),\n"
              "            )\n"
              "        )\n"
              "        self.vertical_ruler_label_every_input = QSpinBox()\n"
              "        self.vertical_ruler_major_tick_every_input = QSpinBox()\n"
              "        self.vertical_ruler_minor_tick_every_input = QSpinBox()\n"
              "        for control in (\n"
              "            self.vertical_ruler_label_every_input,\n"
              "            self.vertical_ruler_major_tick_every_input,\n"
              "            self.vertical_ruler_minor_tick_every_input,\n"
              "        ):\n"
              "            control.setRange(1, 20)\n"
              "        self.vertical_ruler_label_every_input.setValue(\n"
              "            self.track.vertical_ruler.label_every_major\n"
              "        )\n"
              "        self.vertical_ruler_major_tick_every_input.setValue(\n"
              "            self.track.vertical_ruler.major_tick_every\n"
              "        )\n"
              "        self.vertical_ruler_minor_tick_every_input.setValue(\n"
              "            self.track.vertical_ruler.minor_tick_every\n"
              "        )\n"
              "        ruler_form.addRow(\n"
              "            self._text(\"Режим\", \"Режим\", \"Mode\"),\n"
              "            self.vertical_ruler_mode_input,\n"
              "        )\n"
              "        ruler_form.addRow(\n"
              "            self._text(\n"
              "                \"Подписывать каждую N-ю крупную отметку\",\n"
              "                \"Әр N-ші ірі белгіні жазу\",\n"
              "                \"Label every Nth major tick\",\n"
              "            ),\n"
              "            self.vertical_ruler_label_every_input,\n"
              "        )\n"
              "        ruler_form.addRow(\n"
              "            self._text(\n"
              "                \"Показывать каждую N-ю крупную риску\",\n"
              "                \"Әр N-ші ірі сызықты көрсету\",\n"
              "                \"Show every Nth major tick\",\n"
              "            ),\n"
              "            self.vertical_ruler_major_tick_every_input,\n"
              "        )\n"
              "        ruler_form.addRow(\n"
              "            self._text(\n"
              "                \"Показывать каждую N-ю мелкую риску\",\n"
              "                \"Әр N-ші ұсақ сызықты көрсету\",\n"
              "                \"Show every Nth minor tick\",\n"
              "            ),\n"
              "            self.vertical_ruler_minor_tick_every_input,\n"
              "        )\n"
              "        self.vertical_ruler_group.setEnabled(\n"
              "            self.track.kind\n"
              "            in {\n"
              "                TrackKind.CURVE,\n"
              "                TrackKind.GAS,\n"
              "                TrackKind.DEXP,\n"
              "                TrackKind.CALCIMETRY,\n"
              "            }\n"
              "        )\n"
              "        self.vertical_ruler_mode_input.currentIndexChanged.connect(\n"
              "            self._vertical_ruler_state\n"
              "        )\n"
              "        editor_layout.addWidget(self.vertical_ruler_group)\n\n"
              "        grid_group = QGroupBox(self._text(\"Сетка\", \"Тор\", \"Grid\"))\n",
          )
          replace_once(
              dialog,
              "        self._connect_preview_signals()\n"
              "        self._reload()\n"
              "        self._refresh_preview()\n",
              "        self._connect_preview_signals()\n"
              "        self._vertical_ruler_state()\n"
              "        self._reload()\n"
              "        self._refresh_preview()\n",
          )
          replace_once(
              dialog,
              "    def _color_row(self, target: QLineEdit, fallback: str) -> QHBoxLayout:\n",
              "    def _vertical_ruler_state(self, *_args) -> None:\n"
              "        mode = self.vertical_ruler_mode_input.currentData()\n"
              "        enabled = self.vertical_ruler_group.isEnabled()\n"
              "        self.vertical_ruler_label_every_input.setEnabled(\n"
              "            enabled\n"
              "            and mode\n"
              "            not in {VerticalRulerMode.TICKS_ONLY, VerticalRulerMode.OFF}\n"
              "        )\n"
              "        ticks_enabled = enabled and mode is not VerticalRulerMode.OFF\n"
              "        self.vertical_ruler_major_tick_every_input.setEnabled(ticks_enabled)\n"
              "        self.vertical_ruler_minor_tick_every_input.setEnabled(ticks_enabled)\n"
              "        if hasattr(self, \"preview\"):\n"
              "            self._refresh_preview()\n\n"
              "    def _color_row(self, target: QLineEdit, fallback: str) -> QHBoxLayout:\n",
          )
          replace_once(
              dialog,
              "            self.auto_range_input,\n"
              "        ):\n",
              "            self.auto_range_input,\n"
              "            self.vertical_ruler_mode_input,\n"
              "        ):\n",
          )
          replace_once(
              dialog,
              "            self.max_input,\n"
              "        ):\n",
              "            self.max_input,\n"
              "            self.vertical_ruler_label_every_input,\n"
              "            self.vertical_ruler_major_tick_every_input,\n"
              "            self.vertical_ruler_minor_tick_every_input,\n"
              "        ):\n",
          )
          replace_once(
              dialog,
              "        candidate.show_interval_labels = self.show_interval_labels_input.isChecked()\n"
              "        candidate.grid_x = self.grid_x_input.isChecked()\n",
              "        candidate.show_interval_labels = self.show_interval_labels_input.isChecked()\n"
              "        ruler_mode = self.vertical_ruler_mode_input.currentData()\n"
              "        if not isinstance(ruler_mode, VerticalRulerMode):\n"
              "            ruler_mode = VerticalRulerMode.AUTOMATIC\n"
              "        candidate.vertical_ruler = VerticalRulerTrackSettings(\n"
              "            mode=ruler_mode,\n"
              "            label_every_major=self.vertical_ruler_label_every_input.value(),\n"
              "            major_tick_every=(\n"
              "                self.vertical_ruler_major_tick_every_input.value()\n"
              "            ),\n"
              "            minor_tick_every=(\n"
              "                self.vertical_ruler_minor_tick_every_input.value()\n"
              "            ),\n"
              "        )\n"
              "        candidate.grid_x = self.grid_x_input.isChecked()\n",
          )

          Path("tests/test_vertical_ruler_track_editor.py").write_text(
              '''from __future__ import annotations

          import pytest

          from geoworkbench.tablet.models import TrackDefinition, TrackKind
          from geoworkbench.tablet.vertical_ruler import (
              VerticalRulerMode,
              VerticalRulerTrackSettings,
          )
          from geoworkbench.ui.tablet_track_editor_dialog import TabletTrackEditorDialog


          def _gas_track(
              settings: VerticalRulerTrackSettings | None = None,
          ) -> TrackDefinition:
              return TrackDefinition(
                  track_id="gas",
                  title="Газы",
                  kind=TrackKind.GAS,
                  curve_mnemonics=["C1", "C2"],
                  vertical_ruler=settings or VerticalRulerTrackSettings(),
              )


          def test_editor_loads_and_returns_per_track_ruler_settings(qapp) -> None:
              source = VerticalRulerTrackSettings(
                  mode=VerticalRulerMode.TICKS_ONLY,
                  label_every_major=2,
                  major_tick_every=3,
                  minor_tick_every=4,
              )
              dialog = TabletTrackEditorDialog(_gas_track(source), language="ru")

              assert dialog.vertical_ruler_mode_input.currentData() is source.mode
              assert dialog.vertical_ruler_label_every_input.value() == 2
              assert dialog.vertical_ruler_major_tick_every_input.value() == 3
              assert dialog.vertical_ruler_minor_tick_every_input.value() == 4

              dialog.vertical_ruler_mode_input.setCurrentIndex(
                  dialog.vertical_ruler_mode_input.findData(
                      VerticalRulerMode.LABELS_AND_TICKS
                  )
              )
              dialog.vertical_ruler_label_every_input.setValue(5)
              dialog.vertical_ruler_major_tick_every_input.setValue(2)
              dialog.vertical_ruler_minor_tick_every_input.setValue(6)
              candidate = dialog._track_from_controls()

              assert candidate.vertical_ruler == VerticalRulerTrackSettings(
                  mode=VerticalRulerMode.LABELS_AND_TICKS,
                  label_every_major=5,
                  major_tick_every=2,
                  minor_tick_every=6,
              )
              dialog.close()


          def test_off_and_ticks_only_modes_disable_only_irrelevant_controls(qapp) -> None:
              dialog = TabletTrackEditorDialog(_gas_track(), language="en")

              dialog.vertical_ruler_mode_input.setCurrentIndex(
                  dialog.vertical_ruler_mode_input.findData(VerticalRulerMode.OFF)
              )
              assert not dialog.vertical_ruler_label_every_input.isEnabled()
              assert not dialog.vertical_ruler_major_tick_every_input.isEnabled()
              assert not dialog.vertical_ruler_minor_tick_every_input.isEnabled()

              dialog.vertical_ruler_mode_input.setCurrentIndex(
                  dialog.vertical_ruler_mode_input.findData(
                      VerticalRulerMode.TICKS_ONLY
                  )
              )
              assert not dialog.vertical_ruler_label_every_input.isEnabled()
              assert dialog.vertical_ruler_major_tick_every_input.isEnabled()
              assert dialog.vertical_ruler_minor_tick_every_input.isEnabled()
              dialog.close()


          def test_non_graphical_track_cannot_enable_inner_ruler_controls(qapp) -> None:
              dialog = TabletTrackEditorDialog(
                  TrackDefinition(
                      track_id="lithology",
                      title="Литология",
                      kind=TrackKind.LITHOLOGY,
                  ),
                  language="ru",
              )

              assert not dialog.vertical_ruler_group.isEnabled()
              dialog.close()


          @pytest.mark.parametrize(
              ("language", "title", "labels_text", "off_text"),
              [
                  ("ru", "Внутренняя вертикальная шкала", "Цифры и риски", "Выключено"),
                  ("kk", "Ішкі тік шкала", "Сандар мен белгілер", "Өшірулі"),
                  ("en", "Inner vertical ruler", "Labels and ticks", "Off"),
              ],
          )
          def test_editor_exposes_ruler_controls_in_three_languages(
              qapp, language: str, title: str, labels_text: str, off_text: str
          ) -> None:
              dialog = TabletTrackEditorDialog(_gas_track(), language=language)

              assert dialog.vertical_ruler_group.title() == title
              labels_index = dialog.vertical_ruler_mode_input.findData(
                  VerticalRulerMode.LABELS_AND_TICKS
              )
              off_index = dialog.vertical_ruler_mode_input.findData(
                  VerticalRulerMode.OFF
              )
              assert dialog.vertical_ruler_mode_input.itemText(labels_index) == labels_text
              assert dialog.vertical_ruler_mode_input.itemText(off_index) == off_text
              dialog.close()
          ''',
              encoding="utf-8",
          )

          docs_updates = {
              "docs/ru/UI_WORKSPACE.md": (
                  "## Библиотека форм\n",
                  "## Внутренняя шкала глубины в графической колонке\n\n"
                  "В редакторе выбранной графической колонки доступен раздел **«Внутренняя "
                  "вертикальная шкала»**. Для колонки можно выбрать **«Автоматически»**, **«Цифры "
                  "и риски»**, **«Только риски»** или **«Выключено»**, а также задать, через "
                  "сколько крупных отметок выводить цифры, крупные и мелкие риски. Настройка "
                  "колонки только скрывает часть общего набора отметок: значения глубины и их "
                  "Y-координаты всегда совпадают с основной шкалой скважины.\n\n"
                  "## Библиотека форм\n",
              ),
              "docs/kk/UI_WORKSPACE.md": (
                  "## Пішіндер кітапханасы\n",
                  "## Графикалық бағандағы ішкі тереңдік шкаласы\n\n"
                  "Таңдалған графикалық баған редакторында **«Ішкі тік шкала»** бөлімі бар. "
                  "Баған үшін **«Автоматты»**, **«Сандар мен белгілер»**, **«Тек белгілер»** "
                  "немесе **«Өшірулі»** режимін таңдауға және сандардың, ірі және ұсақ "
                  "белгілердің жиілігін орнатуға болады. Баған тек ортақ белгілер жиынының бір "
                  "бөлігін жасырады: тереңдік мәндері мен олардың Y координаттары ұңғыманың "
                  "негізгі шкаласымен әрқашан дәл келеді.\n\n"
                  "## Пішіндер кітапханасы\n",
              ),
              "docs/en/UI_WORKSPACE.md": (
                  "## Form library\n",
                  "## Inner depth ruler in a graph column\n\n"
                  "The selected graph-column editor includes an **Inner vertical ruler** "
                  "section. A column can use **Automatic**, **Labels and ticks**, **Ticks only**, "
                  "or **Off**, with separate frequencies for numeric labels, major ticks, and "
                  "minor ticks. A column only hides a subset of the shared tick sequence: depth "
                  "values and their Y coordinates always match the main well-depth ruler.\n\n"
                  "## Form library\n",
              ),
          }
          for path, (anchor, replacement) in docs_updates.items():
              replace_once(path, anchor, replacement)

          plan_path = "docs/PROJECT_PLAN.md"
          replace_once(
              plan_path,
              "- [ ] **RULER-02:** подключить настройки к свойствам колонки и общему планшету на RU/KK/EN, сохраняя один набор значений и Y-координат.\n",
              "- [x] **RULER-02:** настройки видимости и частоты внутренней шкалы подключены к существующему редактору графической колонки на RU/KK/EN и сохраняются в layout v22.\n",
          )

          changelog_path = "docs/CHANGELOG.md"
          replace_once(
              changelog_path,
              "## Unreleased\n\n",
              "## Unreleased\n\n"
              "- Добавлен общий Qt-независимый контракт вертикальной шкалы и tablet layout v22: "
              "общий шаг задаётся один раз, а каждая графическая колонка может выбрать "
              "автоматический режим, цифры и риски, только риски или отключение и настроить "
              "частоту. Редактор и инструкции доступны на RU/KK/EN; колонка не может создать "
              "собственные значения глубины или Y-координаты.\n",
          )

          workflow = Path(".github/workflows/integrate-ruler-editor-controls.yml")
          workflow.unlink()
          '@
          $patch | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock

      - name: Verify editor contract
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          uv venv .venv --python 3.11
          uv pip sync requirements/release.lock --python .venv --require-hashes
          uv pip install --python .venv pytest==9.1.1 ruff==0.15.22
          uv pip install --python .venv --no-deps --no-build-isolation --editable .

          .\.venv\Scripts\python.exe -m compileall -q `
            src/geoworkbench/ui/tablet_track_editor_dialog.py `
            tests/test_vertical_ruler_track_editor.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\.venv\Scripts\python.exe -m ruff check `
            src/geoworkbench/ui/tablet_track_editor_dialog.py `
            tests/test_vertical_ruler_track_editor.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\.venv\Scripts\python.exe -m pytest -q -p no:cacheprovider `
            tests/test_vertical_ruler_settings.py `
            tests/test_vertical_ruler_persistence.py `
            tests/test_vertical_ruler_track_editor.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified controls
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "feat: expose shared ruler controls in track editor"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
