name: Acquire pinned open-format fixtures
on:
  push:
    branches: [codex/data-petro-external-fixture-corpus]
    paths:
      - .github/workflows/acquire-open-fixtures.yml
      - .gitattributes
      - tools/fetch_external_format_fixtures.py
      - tests/fixtures/external_formats/manifest.json
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and verify pinned test corpus
        run: |
          python tools/fetch_external_format_fixtures.py
          python tools/fetch_external_format_fixtures.py --check
      - name: Upload corpus ZIP for independent storage
        uses: actions/upload-artifact@v4
        with:
          name: geolog-open-format-fixtures
          path: tests/fixtures/external_formats/
          if-no-files-found: error
          retention-days: 90
      - name: Commit exact upstream fixture bytes to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/fixtures/external_formats/
          if ! git diff --cached --quiet; then
            git commit -m "test(data-petro): vendor verified small open-format fixture bytes"
            git push origin HEAD:codex/data-petro-external-fixture-corpus
          fi
