name: Apply SEC-03 patch

on:
  push:
    branches: [sec03-streaming-limits]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out SEC-03 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Verify and apply SEC-03 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/sec03-patch/*.txt > /tmp/sec03.b64
          echo "5cf282a0cf614c5abcdc82f72554178be87f03624447f81db861ef194e048d5a  /tmp/sec03.b64" | sha256sum --check --strict
          base64 --decode /tmp/sec03.b64 > /tmp/sec03.patch.gz
          echo "9362f619f486cae45c2c37bff66263f9ca0cc1c6170599a4cdcaa723778995d0  /tmp/sec03.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout /tmp/sec03.patch.gz > /tmp/sec03.patch
          echo "419a5e4d3624e21875570ab4078f1bcc2694b8bd51a1652a6f19b11cec4b0970  /tmp/sec03.patch" | sha256sum --check --strict
          git apply --check /tmp/sec03.patch
          git apply --index /tmp/sec03.patch
          python tools/check_documentation.py
          python -m compileall -q src tests tools scripts

      - name: Commit clean SEC-03 implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .github/sec03-patch .github/workflows/apply-sec03.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement SEC-03 streaming limits"
          git push origin HEAD:sec03-streaming-limits
