name: Apply comprehensive print gas and time fix

on:
  push:
    branches: [fix/comprehensive-print-gas-time-20260804]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comprehensive-print-gas-time-20260804
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reassemble and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patch-chunks/part* > /tmp/comprehensive_fix.patch.gz.b64
          base64 --decode /tmp/comprehensive_fix.patch.gz.b64 > /tmp/comprehensive_fix.patch.gz
          gzip --decompress --stdout /tmp/comprehensive_fix.patch.gz > /tmp/comprehensive_fix.patch
          echo '88487ed3b96c088db1fd61e1e258b120626e4cfde9f04d48447e0a0a08a52be1  /tmp/comprehensive_fix.patch' | sha256sum --check

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --3way /tmp/comprehensive_fix.patch

      - name: Verify syntax and focused non-GUI contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m compileall -q src tests
          PYTHONPATH=src pytest -q \
            tests/test_report_definition.py \
            tests/test_report_passport_datetime_bounds.py \
            tests/test_derived_gas_sparse_continuity.py \
            tests/test_auto_pagination_balancing.py \
            tests/test_paradox_import.py

      - name: Commit reviewed fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/patch-chunks
          rm -f .github/workflows/apply-comprehensive-print-gas-time-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize gas curves time axes and multipage print'
          git push origin HEAD:fix/comprehensive-print-gas-time-20260804
