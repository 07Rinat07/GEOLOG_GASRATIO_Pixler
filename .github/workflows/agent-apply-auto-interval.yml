name: Apply auto interval fix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/auto-page-interval-ci-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = ""
          Path('/tmp/changes.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply --whitespace=nowarn /tmp/changes.patch
          rm -f .github/workflows/agent-apply-auto-interval.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: add automatic print page interval and stable Qt cleanup"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
