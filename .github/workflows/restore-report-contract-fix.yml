name: Restore report definition contract and keep datetime fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore baseline and apply focused datetime patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('src/geoworkbench/services/report_definition.py')
          text = subprocess.check_output(
              [
                  'git',
                  'show',
                  'afe3c3861f8efd46f5c632c9da5d27b55af900e2:src/geoworkbench/services/report_definition.py',
              ],
              text=True,
              encoding='utf-8',
          )

          text = text.replace(
              '        start_value = np.datetime64(str(start), "ns")\n'
              '        end_value = np.datetime64(str(end), "ns")\n',
              '        start_value = _datetime_boundary_value(start)\n'
              '        end_value = _datetime_boundary_value(end)\n',
              1,
          )

          old_coerce = '''    if index.index_type is IndexType.DATETIME:\n        try:\n            normalized = np.datetime64(str(value), "ns")\n        except (TypeError, ValueError) as exc:\n            raise ReportDefinitionError(f"Некорректная datetime-граница: {value}") from exc\n        if np.isnat(normalized):\n            raise ReportDefinitionError("Datetime-граница отчёта не может быть NaT")\n        return _datetime_text(normalized)\n'''
          new_coerce = '''    if index.index_type is IndexType.DATETIME:\n        return _datetime_text(_datetime_boundary_value(value))\n'''
          if old_coerce not in text:
              raise SystemExit('datetime coercion block not found')
          text = text.replace(old_coerce, new_coerce, 1)

          text = text.replace(
              '        return int(np.datetime64(str(value), "ns").astype(np.int64))\n',
              '        return int(_datetime_boundary_value(value).astype(np.int64))\n',
              1,
          )

          marker = '\n\ndef _datetime_text(value: np.datetime64) -> str:\n'
          helper = '''\n\ndef _datetime_boundary_value(value: ReportBoundary) -> np.datetime64:\n    """Normalize report datetime boundaries from ISO text or Unix seconds.\n\n    Tablet time axes use floating-point Unix seconds, whereas imported indexes\n    remain ``datetime64``. Numeric viewport bounds must therefore be converted\n    to nanoseconds instead of being parsed as calendar-year text.\n    """\n\n    if isinstance(value, bool):\n        raise ReportDefinitionError("Datetime-граница отчёта не может быть логической")\n\n    numeric: float | None = None\n    if isinstance(value, (int, float, np.integer, np.floating)):\n        numeric = float(value)\n    else:\n        text = str(value).strip()\n        try:\n            numeric = float(text)\n        except (TypeError, ValueError, OverflowError):\n            try:\n                normalized = np.datetime64(text, "ns")\n            except (TypeError, ValueError, OverflowError) as exc:\n                raise ReportDefinitionError(\n                    f"Некорректная datetime-граница: {value}"\n                ) from exc\n            if np.isnat(normalized):\n                raise ReportDefinitionError("Datetime-граница отчёта не может быть NaT")\n            return normalized\n\n    assert numeric is not None\n    if not isfinite(numeric):\n        raise ReportDefinitionError("Datetime-граница отчёта должна быть конечной")\n    try:\n        nanoseconds = round(numeric * 1_000_000_000.0)\n        limits = np.iinfo(np.int64)\n        if nanoseconds < limits.min or nanoseconds > limits.max:\n            raise OverflowError\n        normalized = np.datetime64(int(nanoseconds), "ns")\n    except (OverflowError, TypeError, ValueError) as exc:\n        raise ReportDefinitionError(f"Некорректная datetime-граница: {value}") from exc\n    if np.isnat(normalized):\n        raise ReportDefinitionError("Datetime-граница отчёта не может быть NaT")\n    return normalized\n'''
          if marker not in text:
              raise SystemExit('datetime text marker not found')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify focused contract
        run: |
          python -m compileall -q src/geoworkbench/services/report_definition.py tests/test_report_definition.py
          python - <<'PY'
          from pathlib import Path
          source = Path('src/geoworkbench/services/report_definition.py').read_text(encoding='utf-8')
          assert '_datetime_boundary_value(start)' in source
          assert 'len(set(values)) != len(values)' in source
          assert 'Параметры ReportDefinition не должны повторять ключи' in source
          PY
      - name: Commit focused fix
        shell: bash
        run: |
          rm -f .github/workflows/restore-report-contract-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/geoworkbench/services/report_definition.py .github/workflows
          git commit -m 'fix: preserve report contracts while accepting Unix time'
          git push origin HEAD:main
