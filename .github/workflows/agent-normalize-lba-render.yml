name: Agent normalize LBA render labels

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/lba-print-ci-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Normalize legacy LBA colour values at render boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_root = Path('src/geoworkbench')
          identifier_pattern = re.compile(
              r'\b(?:[A-Za-z_]*(?:lba|fluorescence|luminescence)[A-Za-z_]*(?:color|colour)[A-Za-z_]*'
              r'|[A-Za-z_]*(?:color|colour)[A-Za-z_]*(?:lba|fluorescence|luminescence)[A-Za-z_]*)\b',
              re.IGNORECASE,
          )
          field_names: set[str] = set()
          for path in source_root.rglob('*.py'):
              field_names.update(identifier_pattern.findall(path.read_text(encoding='utf-8')))
          field_names = {
              name for name in field_names
              if not name.lower().endswith(('combo', 'label', 'labels', 'code', 'key'))
          }
          print('Candidate LBA colour fields:', sorted(field_names))

          render_roots = (
              source_root / 'tablet',
              source_root / 'printing',
          )
          changed: list[str] = []
          total_replacements = 0
          for root in render_roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.py'):
                  text = path.read_text(encoding='utf-8')
                  original = text
                  replacements = 0
                  for field in sorted(field_names, key=len, reverse=True):
                      # Rendering code is read-only. Avoid assignment targets and
                      # normalize every legacy full value immediately before use.
                      pattern = re.compile(
                          rf'(?<!lba_color_code\()\b([A-Za-z_][A-Za-z0-9_\.]*)\.{re.escape(field)}\b(?!\s*=)'
                      )
                      text, count = pattern.subn(
                          lambda match: f'lba_color_code({match.group(0)})',
                          text,
                      )
                      replacements += count
                  if replacements == 0:
                      continue
                  import_line = (
                      'from geoworkbench.services.lba_standard import lba_color_code\n'
                  )
                  if import_line not in text:
                      lines = text.splitlines(keepends=True)
                      insert_at = 0
                      if lines and lines[0].startswith('from __future__ import'):
                          insert_at = 1
                          while insert_at < len(lines) and not lines[insert_at].strip():
                              insert_at += 1
                      lines.insert(insert_at, import_line)
                      text = ''.join(lines)
                  if text != original:
                      path.write_text(text, encoding='utf-8')
                      changed.append(str(path))
                      total_replacements += replacements

          print('Modified render files:', changed)
          print('LBA render replacements:', total_replacements)
          if total_replacements == 0:
              # Some implementations resolve the standard object first and call
              # LbaFluorescenceColor.label(); that path is already compact after
              # the central service change. Keep the workflow non-destructive.
              print('No raw field use found; central label contract is authoritative.')
          PY
      - name: Remove one-shot workflow
        shell: bash
        run: rm -f .github/workflows/agent-normalize-lba-render.yml
      - name: Commit generated render fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .github/workflows
          if git diff --cached --quiet; then
            echo 'No additional render files required changes'
            exit 0
          fi
          git commit -m 'fix: normalize LBA colour codes at render boundaries'
          git push origin HEAD:${{ github.head_ref }}
