name: Verify current ruler editor integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-ruler-editor-current.yml

permissions:
  contents: write

concurrency:
  group: verify-ruler-editor-current
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock

      - name: Install and verify
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          $phase = "install"
          uv venv .venv --python 3.11 *> verify-ruler-output.txt
          $failed = $LASTEXITCODE -ne 0
          if (-not $failed) {
            uv pip sync requirements/release.lock --python .venv --require-hashes *>> verify-ruler-output.txt
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            uv pip install --python .venv pytest==9.1.1 ruff==0.15.22 *>> verify-ruler-output.txt
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            uv pip install --python .venv --no-deps --no-build-isolation --editable . *>> verify-ruler-output.txt
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }

          if (-not $failed) {
            $phase = "documentation"
            .\.venv\Scripts\python.exe tools/check_documentation.py *>> verify-ruler-output.txt
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            $phase = "compile"
            .\.venv\Scripts\python.exe -m compileall -q src/geoworkbench/ui/tablet_track_editor_dialog.py tests/test_vertical_ruler_track_editor.py *>> verify-ruler-output.txt
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            $phase = "ruff"
            .\.venv\Scripts\python.exe -m ruff check src/geoworkbench/ui/tablet_track_editor_dialog.py tests/test_vertical_ruler_track_editor.py *>> verify-ruler-output.txt
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if (-not $failed) {
            $phase = "pytest"
            .\.venv\Scripts\python.exe -m pytest -q -p no:cacheprovider tests/test_vertical_ruler_settings.py tests/test_vertical_ruler_persistence.py tests/test_vertical_ruler_track_editor.py *>> verify-ruler-output.txt
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item .github/workflows/verify-ruler-editor-current.yml -ErrorAction SilentlyContinue

          if ($failed) {
            $lines = @("phase=$phase", "--- verify-ruler-output.txt ---")
            $lines += Get-Content verify-ruler-output.txt
            $lines | Set-Content .github/ruler-editor-integration-error.txt -Encoding utf8
            Remove-Item verify-ruler-output.txt -ErrorAction SilentlyContinue
            git add -A
            git commit -m "ci: record ruler editor verification error"
            git push origin HEAD:main
            exit 0
          }

          Remove-Item .github/ruler-editor-integration-error.txt -ErrorAction SilentlyContinue
          Remove-Item verify-ruler-output.txt -ErrorAction SilentlyContinue
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "test: verify ruler editor controls and translations"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
