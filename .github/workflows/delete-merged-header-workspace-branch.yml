name: Delete merged header workspace branch

on:
  pull_request:

permissions:
  contents: write

jobs:
  delete:
    if: github.event.pull_request.head.ref == 'improve-header-fullscreen-assistant'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/improve-header-fullscreen-assistant"
