name: Apply application font normalization

on:
  push:
    branches: [fix/guard-invalid-font-point-size]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Normalize pixel-sized application fonts and add regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/geoworkbench/printing/unicode_support.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''    profile = resolve_unicode_font_profile(_REQUIRED_PRINT_SAMPLE)
          font = QFont(app.font())
          if hasattr(font, "setFamilies"):
              font.setFamilies(list(profile.families))
          elif profile.primary_family:
              font.setFamily(profile.primary_family)
          font.setStyleStrategy(QFont.StyleStrategy.PreferAntialias)
          app.setFont(font)
          return profile
          '''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines()) + "\n"
          new = '''    profile = resolve_unicode_font_profile(_REQUIRED_PRINT_SAMPLE)
          font = QFont(app.font())
          # Some Windows themes expose the application font in pixels. Qt then
          # reports pointSizeF() as its sentinel -1. Keeping that sentinel in the
          # global font lets native dialogs copy it into setPointSize(-1), which
          # emits a runtime warning. Convert the same physical size to points
          # before installing the Unicode family stack.
          if font.pointSizeF() <= 0.0:
              pixel_size = font.pixelSize()
              screen = app.primaryScreen()
              logical_dpi = screen.logicalDotsPerInchY() if screen is not None else 96.0
              if pixel_size > 0 and logical_dpi > 0.0:
                  point_size = float(pixel_size) * 72.0 / float(logical_dpi)
              else:
                  system_font = QFontDatabase.systemFont(QFontDatabase.SystemFont.GeneralFont)
                  point_size = system_font.pointSizeF()
              font.setPointSizeF(max(1.0, point_size if point_size > 0.0 else 9.0))
          if hasattr(font, "setFamilies"):
              font.setFamilies(list(profile.families))
          elif profile.primary_family:
              font.setFamily(profile.primary_family)
          font.setStyleStrategy(QFont.StyleStrategy.PreferAntialias)
          app.setFont(font)
          return profile
          '''
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines()) + "\n"
          if source.count(old) != 1:
              raise SystemExit(f"Expected one application font block, found {source.count(old)}")
          source_path.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_application_unicode_font.py")
          test_path.write_text('''from __future__ import annotations

          from PySide6.QtCore import qInstallMessageHandler
          from PySide6.QtGui import QFont

          from geoworkbench.printing.unicode_support import configure_application_unicode_fonts


          def test_unicode_font_configuration_normalizes_pixel_size_sentinel(qapp) -> None:
              original = QFont(qapp.font())
              messages: list[str] = []

              def handler(_kind, _context, message: str) -> None:
                  messages.append(message)

              previous = qInstallMessageHandler(handler)
              try:
                  pixel_font = QFont(original)
                  pixel_font.setPixelSize(13)
                  qapp.setFont(pixel_font)
                  assert qapp.font().pointSizeF() == -1.0

                  configure_application_unicode_fonts(qapp)

                  configured = qapp.font()
                  assert configured.pointSizeF() > 0.0
                  assert configured.pointSize() > 0
                  assert configured.pixelSize() == -1

                  # Model a downstream/native Qt path that copies the global
                  # point size into another font. This emitted the diagnostics
                  # warning while the application font still carried -1.
                  copied = QFont(configured)
                  copied.setPointSize(configured.pointSize())
              finally:
                  qInstallMessageHandler(previous)
                  qapp.setFont(original)

              assert not any("QFont::setPointSize" in message for message in messages)
          '''.replace("          ", ""), encoding="utf-8")

          Path(".github/workflows/qfont-audit.yml").unlink(missing_ok=True)
          Path(".github/workflows/apply-qfont-normalization.yml").unlink(missing_ok=True)
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/geoworkbench/printing/unicode_support.py tests/test_application_unicode_font.py .github/workflows/qfont-audit.yml .github/workflows/apply-qfont-normalization.yml
          git commit -m "fix: normalize application font point size"
          git push origin HEAD:fix/guard-invalid-font-point-size
