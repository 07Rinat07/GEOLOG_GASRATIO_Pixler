name: Apply adaptive print title synchronization

on:
  push:
    branches: [fix/comprehensive-print-gas-time-20260804]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comprehensive-print-gas-time-20260804
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply print capture title synchronization and test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one block, found {count}')
              return text.replace(old, new, 1)

          path = Path('src/geoworkbench/printing/tablet_print.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '''        curve_style_states = _activate_print_curve_styles(rendered)\n        print_header_band = max(\n            item.widget.natural_curve_header_height for item in rendered\n        )\n        for item in rendered:\n            item.widget.set_synchronized_header_height(print_header_band)\n        _activate_layout_tree(tablet)\n''',
              '''        curve_style_states = _activate_print_curve_styles(rendered)\n        print_title_band = max(\n            item.widget.natural_title_header_height for item in rendered\n        )\n        print_header_band = max(\n            item.widget.natural_curve_header_height for item in rendered\n        )\n        for item in rendered:\n            item.widget.set_synchronized_title_header_height(print_title_band)\n            item.widget.set_synchronized_header_height(print_header_band)\n        _activate_layout_tree(tablet)\n''',
              'initial title synchronization',
          )
          text = replace_once(
              text,
              '''        header_height = (\n            max(item.widget.title.height() for item in rendered)\n            + print_header_band\n        )\n''',
              '''        header_height = print_title_band + print_header_band\n''',
              'initial header height',
          )
          text = replace_once(
              text,
              '''            header_height = (\n                max(item.widget.title.height() for item in rendered)\n                + print_header_band\n            )\n''',
              '''            header_height = print_title_band + print_header_band\n''',
              'resized header height',
          )
          text = replace_once(
              text,
              '''        for _attempt in range(3):\n            for item, width in zip(rendered, layout.widths, strict=True):\n                item.widget.set_track_width(width)\n            tablet.refresh_shared_vertical_rulers()\n            measured_header_height = (\n                max(item.widget.title.height() for item in rendered)\n                + print_header_band\n            )\n            next_layout = build_layout(measured_header_height)\n''',
              '''        for _attempt in range(3):\n            for item, width in zip(rendered, layout.widths, strict=True):\n                item.widget.set_track_width(width)\n            print_title_band = max(\n                item.widget.natural_title_header_height for item in rendered\n            )\n            for item in rendered:\n                item.widget.set_synchronized_title_header_height(print_title_band)\n            _activate_layout_tree(tablet)\n            tablet.refresh_shared_vertical_rulers()\n            measured_header_height = print_title_band + print_header_band\n            next_layout = build_layout(measured_header_height)\n''',
              'adaptive width title synchronization',
          )
          text = replace_once(
              text,
              '''        screen_header_band = max(\n            item.widget.natural_curve_header_height for item in rendered\n        )\n        for item in rendered:\n            item.widget.set_synchronized_header_height(screen_header_band)\n''',
              '''        screen_title_band = max(\n            item.widget.natural_title_header_height for item in rendered\n        )\n        screen_header_band = max(\n            item.widget.natural_curve_header_height for item in rendered\n        )\n        for item in rendered:\n            item.widget.set_synchronized_title_header_height(screen_title_band)\n            item.widget.set_synchronized_header_height(screen_header_band)\n''',
              'screen title restoration',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_print_header_layout.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'def test_adaptive_layout_uses_canonical_graph_body_height() -> None:\n'
          test = '''def test_print_capture_resynchronizes_titles_after_adaptive_widths() -> None:\n    source = Path(\n        "src/geoworkbench/printing/tablet_print.py"\n    ).read_text(encoding="utf-8")\n\n    width_update = source.index("item.widget.set_track_width(width)")\n    title_measure = source.index(\n        "item.widget.natural_title_header_height for item in rendered",\n        width_update,\n    )\n    title_apply = source.index(\n        "item.widget.set_synchronized_title_header_height(print_title_band)",\n        title_measure,\n    )\n    header_measure = source.index(\n        "measured_header_height = print_title_band + print_header_band",\n        title_apply,\n    )\n\n    assert width_update < title_measure < title_apply < header_measure\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('print title sync test insertion anchor not unique')
          if 'test_print_capture_resynchronizes_titles_after_adaptive_widths' in text:
              raise SystemExit('print title sync regression test already exists')
          path.write_text(text.replace(anchor, test + anchor, 1), encoding='utf-8')
          PY

      - name: Verify syntax and focused source contracts
        shell: bash
        run: |
          python -m compileall -q \
            src/geoworkbench/printing/tablet_print.py \
            tests/test_print_header_layout.py
          python -m pip install -q pytest
          PYTHONPATH=src pytest -q tests/test_print_header_layout.py -k 'resynchronizes_titles or adaptive_layout_uses'

      - name: Commit source and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-adaptive-title-print-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: resynchronize wrapped titles after print layout'
          git push origin HEAD:fix/comprehensive-print-gas-time-20260804
