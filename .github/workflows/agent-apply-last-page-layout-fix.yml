     paint_tablet_header_repeat(
         painter,
diff --git a/src/geoworkbench/printing/tablet_print.py b/src/geoworkbench/printing/tablet_print.py
index d16e52d..6522ee2 100644
--- a/src/geoworkbench/printing/tablet_print.py
+++ b/src/geoworkbench/printing/tablet_print.py
@@ -388,6 +388,7 @@ def paint_tablet_snapshot(
     continuation: PrintContinuationSlice | None = None,
     fill_height: bool = False,
     show_column_header: bool = True,
+    preserve_fit_width: bool = False,
 ) -> None:
     if page.width() <= 0 or page.height() <= 0:
         raise TabletPrintError("Устройство печати не предоставило допустимую область страницы")
@@ -398,15 +399,25 @@ def paint_tablet_snapshot(
     if scale_mode is PrintScaleMode.FIT:
         horizontal_scale = page.width() / snapshot.layout.total_width
         vertical_scale = page.height() / logical_content_height
-        scale = horizontal_scale
-        rendered_width = snapshot.layout.total_width * scale
-        rendered_height = logical_content_height * scale
-        if rendered_height > page.height() + 2.0:
+        horizontal_render_scale = horizontal_scale
+        vertical_render_scale = horizontal_scale
+        rendered_width = snapshot.layout.total_width * horizontal_render_scale
+        rendered_height = logical_content_height * vertical_render_scale
+        if preserve_fit_width and rendered_height > page.height():
+            # A repeated final header can consume a few more logical pixels than
+            # the planner predicted after the hidden Qt layout settles. Keep the
+            # canonical paper width and compress only the graph body vertically;
+            # shrinking both axes is what made the last page visibly narrower.
+            vertical_render_scale = vertical_scale
+            rendered_height = page.height()
+        elif rendered_height > page.height() + 2.0:
             # Runtime layout drift must not abort the whole PDF; keep one bounded
             # uniform fallback so every column remains visible on the page.
-            scale = min(horizontal_scale, vertical_scale)
-            rendered_width = snapshot.layout.total_width * scale
-            rendered_height = logical_content_height * scale
+            uniform_scale = min(horizontal_scale, vertical_scale)
+            horizontal_render_scale = uniform_scale
+            vertical_render_scale = uniform_scale
+            rendered_width = snapshot.layout.total_width * uniform_scale
+            rendered_height = logical_content_height * uniform_scale
         x = page.left() + (page.width() - rendered_width) / 2.0
         y = page.top()
         if fill_height and rendered_height < page.height():
@@ -429,8 +440,8 @@ def paint_tablet_snapshot(
                 target = QRectF(
                     x,
                     y,
-                    logical_width * scale,
-                    (source_height / snapshot.raster_scale) * scale,
+                    logical_width * horizontal_render_scale,
+                    (source_height / snapshot.raster_scale) * vertical_render_scale,
                 )
                 source = QRectF(
                     0.0,
@@ -439,7 +450,9 @@ def paint_tablet_snapshot(
                     source_height,
                 )
                 painter.drawPixmap(target, pixmap, source)
-                x += (logical_width + snapshot.layout.spacing) * scale
+                x += (
+                    logical_width + snapshot.layout.spacing
+                ) * horizontal_render_scale
         finally:
             painter.restore()
         return
diff --git a/tests/test_partial_print_page_geometry.py b/tests/test_partial_print_page_geometry.py
index e9206fb..b585a43 100644
--- a/tests/test_partial_print_page_geometry.py
+++ b/tests/test_partial_print_page_geometry.py
@@ -37,3 +37,44 @@ def test_partial_last_page_shortens_only_its_viewport() -> None:
     assert _page_target_content_height(plan, page) == round(
         6000 * (2016.2 - 1945.9) / 126.593
     )
+
+
+def test_repeated_bottom_header_reserves_space_without_narrowing_page() -> None:
+    page = _page(1_951.58, 2_016.2)
+    plan = PrintDocumentPlan(
+        (page,),
+        target_content_height_px=6000,
+        resolved_units_per_page=89.444,
+        tablet_header_height_px=1800,
+    )
+
+    target = _page_target_content_height(
+        plan,
+        page,
+        repeat_column_header_at_bottom=True,
+    )
+
+    assert target is not None
+    body = target - 1800
+    canonical_body = 6000 - 1800
+    assert body < round(canonical_body * (2_016.2 - 1_951.58) / 89.444)
+    assert body + 1800 < canonical_body
+
+
+def test_single_page_reserves_both_header_gaps() -> None:
+    page = _page(1_469.38, 1_482.4)
+    plan = PrintDocumentPlan(
+        (page,),
+        target_content_height_px=3000,
+        resolved_units_per_page=89.444,
+        tablet_header_height_px=900,
+    )
+
+    target = _page_target_content_height(
+        plan,
+        page,
+        repeat_column_header_at_bottom=True,
+    )
+
+    assert target is not None
+    assert target < 3000 - 900
PATCH
          git apply --check /tmp/last-page-fix.patch
          git apply /tmp/last-page-fix.patch
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify print geometry
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q src tests/test_partial_print_page_geometry.py
          pytest -q tests/test_partial_print_page_geometry.py tests/test_print_header_layout.py tests/test_print_media_source_integrity.py tests/test_uniform_print_density_source.py
      - name: Commit verified fix
        shell: bash
        run: |
          rm -f .github/workflows/agent-apply-last-page-layout-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github/workflows
          git commit -m 'fix: keep final PDF page at canonical width'
          git push origin HEAD:main
