name: Apply last page print layout fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply deterministic final-page patch
        shell: bash
        run: |
          cat > /tmp/last-page-fix.patch <<'PATCH'
diff --git a/src/geoworkbench/printing/document_renderer.py b/src/geoworkbench/printing/document_renderer.py
index cb027b4..30d92d9 100644
--- a/src/geoworkbench/printing/document_renderer.py
+++ b/src/geoworkbench/printing/document_renderer.py
@@ -36,6 +36,7 @@ from geoworkbench.printing.print_layout import (
     PrintScaleMode,
     build_horizontal_continuations,
 )
+from geoworkbench.printing.tablet_print import tablet_header_gap_height
 from geoworkbench.printing.unicode_support import print_font
 from geoworkbench.project.session import ProjectSession
 from geoworkbench.services.localization import AppLanguage, Localizer
@@ -397,8 +398,17 @@ def paint_document_pages(
 def _page_target_content_height(
     plan: PrintDocumentPlan,
     page: PrintDocumentPage,
+    *,
+    repeat_column_header_at_bottom: bool = False,
 ) -> int | None:
-    """Return a page-specific hidden viewport without changing widths."""
+    """Return a page-specific hidden viewport without changing column widths.
+
+    A short automatic page keeps the same depth/time density as regular pages by
+    receiving a proportionally shorter hidden body.  When the final column
+    header is repeated at the bottom, reserve its logical height as well; the
+    renderer must never solve that collision by uniformly shrinking the whole
+    form and making the final page narrower than the preceding pages.
+    """
 
     target = plan.target_content_height_px
     regular_units = plan.resolved_units_per_page
@@ -422,12 +432,35 @@ def _page_target_content_height(
         capacity = plan.first_page_units_per_page
 
     assert page.start is not None and page.end is not None
+    body_height = max(1, int(page_target) - header_height)
     page_span = abs(float(page.end) - float(page.start))
     if page_span <= 0.0 or page_span >= capacity * 0.999:
-        return page_target
-    body_height = max(1, int(page_target) - header_height)
-    partial_body_height = max(1, round(body_height * page_span / capacity))
-    return header_height + partial_body_height
+        requested_body_height = body_height
+    else:
+        requested_body_height = max(1, round(body_height * page_span / capacity))
+
+    if repeat_column_header_at_bottom:
+        # The repeated header and its separator gap share the same physical band
+        # that normally contains only the graph body.  Iterate because the gap is
+        # defined as a small fraction of the page-specific snapshot height.
+        gap_count = 1 + int(page.index == 1)
+        available_body_height = body_height
+        for _attempt in range(3):
+            candidate_height = header_height + min(
+                requested_body_height,
+                available_body_height,
+            )
+            gap_height = tablet_header_gap_height(candidate_height)
+            available_body_height = max(
+                1,
+                body_height - header_height - gap_count * gap_height,
+            )
+        requested_body_height = min(
+            requested_body_height,
+            available_body_height,
+        )
+
+    return header_height + requested_body_height
 
 
 def paint_document_page(
@@ -493,6 +526,9 @@ def paint_document_page(
                 title=context.title,
                 range_text=right_text,
             )
+        repeat_column_header_at_bottom = _should_paint_column_header_at_bottom(
