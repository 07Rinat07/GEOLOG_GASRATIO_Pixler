name: QFont point-size audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  audit:
    name: Locate invalid font-size paths
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Report font construction and size call sites
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import ast
          import re
          import sys

          sys.stdout.reconfigure(encoding="utf-8", errors="backslashreplace")
          roots = [Path("src"), Path("tests"), Path("tools"), Path("scripts")]
          text_pattern = re.compile(
              r"QFont\s*\(|setPointSize|pointSize\s*\(|setPixelSize|pixelSize\s*\(|font[_ ]?size|point[_ ]?size",
              re.IGNORECASE,
          )
          sections = []
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob("*.py")):
                  text = path.read_text(encoding="utf-8")
                  lines = text.splitlines()
                  try:
                      tree = ast.parse(text, filename=str(path))
                  except SyntaxError as exc:
                      sections.append(f"\n=== AST ERROR {path}:{exc.lineno} ===\n{exc}\n")
                      continue

                  for node in ast.walk(tree):
                      if not isinstance(node, ast.Call):
                          continue
                      name = ""
                      if isinstance(node.func, ast.Name):
                          name = node.func.id
                      elif isinstance(node.func, ast.Attribute):
                          name = node.func.attr
                      if name not in {
                          "QFont",
                          "setPointSize",
                          "setPointSizeF",
                          "setPixelSize",
                          "setCurrentFont",
                          "setFont",
                      }:
                          continue
                      start_line = max(1, getattr(node, "lineno", 1) - 3)
                      end_line = min(len(lines), getattr(node, "end_lineno", node.lineno) + 3)
                      context = "\n".join(
                          f"{number:5d}: {lines[number - 1]}"
                          for number in range(start_line, end_line + 1)
                      )
                      try:
                          call = ast.unparse(node)
                      except Exception:
                          call = name
                      sections.append(
                          f"\n=== AST {path}:{node.lineno} {name} ===\nCALL: {call}\n{context}\n"
                      )

                  for index, line in enumerate(lines, 1):
                      if text_pattern.search(line) and "QFont" not in line and "setPointSize" not in line and "setPixelSize" not in line:
                          start_line = max(1, index - 2)
                          end_line = min(len(lines), index + 2)
                          context = "\n".join(
                              f"{number:5d}: {lines[number - 1]}"
                              for number in range(start_line, end_line + 1)
                          )
                          sections.append(f"\n=== TEXT {path}:{index} ===\n{context}\n")

          report = "".join(sections) or "No font construction or size paths found.\n"
          Path("qfont-audit.txt").write_text(report, encoding="utf-8")
          print(report)
          '@ | python -

      - name: Upload audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qfont-audit
          path: qfont-audit.txt
          if-no-files-found: error
          retention-days: 7
