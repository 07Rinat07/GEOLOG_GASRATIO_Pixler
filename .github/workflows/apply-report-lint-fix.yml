name: Apply interpretation report lint fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-lint-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix-interpretation-report-readability'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply and commit lint fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/report-lint-fix.patch
          git apply .github/report-lint-fix.patch
          rm -f .github/report-lint-fix.patch .github/workflows/apply-report-lint-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Удалил неиспользуемый импорт из экспорта отчёта"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
