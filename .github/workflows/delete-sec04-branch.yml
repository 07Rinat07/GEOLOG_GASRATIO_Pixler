name: Delete SEC-04 branch

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/delete-sec04-branch.yml]

permissions:
  contents: write

jobs:
  delete:
    if: github.head_ref == 'sec04-wits0-retention-policy'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged work branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/sec04-wits0-retention-policy"
