name: Agent apply partial print page fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/lba-print-ci-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply deterministic print geometry patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          document = Path('src/geoworkbench/printing/document_renderer.py')
          text = document.read_text(encoding='utf-8')
          marker = '\n\ndef paint_document_page(\n'
          if 'def _page_target_content_height(' not in text:
              helper = '''\n\ndef _page_target_content_height(\n    plan: PrintDocumentPlan,\n    page: PrintDocumentPage,\n) -> int | None:\n    """Scale only the off-screen viewport for a partial automatic page.\n\n    Column widths keep the canonical full-page layout. A final short depth\n    interval therefore occupies a proportionally shorter body and leaves room\n    for the repeated form header without shrinking text or the depth scale.\n    """\n\n    target = plan.target_content_height_px\n    units_per_page = plan.resolved_units_per_page\n    if (\n        target is None\n        or units_per_page is None\n        or units_per_page <= 0.0\n        or not page.has_vertical_range\n    ):\n        return target\n    assert page.start is not None and page.end is not None\n    page_span = abs(float(page.end) - float(page.start))\n    if page_span <= 0.0 or page_span >= units_per_page * 0.999:\n        return target\n    return max(1, round(target * page_span / units_per_page))\n'''
              if marker not in text:
                  raise SystemExit('paint_document_page marker not found')
              text = text.replace(marker, helper + marker, 1)
          old = '            target_content_height=plan.target_content_height_px,\n            page_aspect_ratio=plan.tablet_page_aspect_ratio,\n'
          new = '            target_content_height=_page_target_content_height(plan, page),\n            layout_content_height=plan.target_content_height_px,\n            page_aspect_ratio=plan.tablet_page_aspect_ratio,\n'
          if old not in text and new not in text:
              raise SystemExit('document renderer call site not found')
          text = text.replace(old, new, 1)
          document.write_text(text, encoding='utf-8')

          page_renderer = Path('src/geoworkbench/printing/page_renderer.py')
          text = page_renderer.read_text(encoding='utf-8')
          old = '    target_content_height: int | None = None,\n    page_aspect_ratio: float | None = None,\n'
          new = '    target_content_height: int | None = None,\n    layout_content_height: int | None = None,\n    page_aspect_ratio: float | None = None,\n'
          if old not in text and new not in text:
              raise SystemExit('page renderer signature not found')
          text = text.replace(old, new, 1)
          old = '                    target_content_height=target_content_height,\n'
          new = '                    target_content_height=target_content_height,\n                    layout_content_height=layout_content_height,\n'
          if old not in text and new not in text:
              raise SystemExit('snapshot call site not found')
          text = text.replace(old, new, 1)
          page_renderer.write_text(text, encoding='utf-8')

          tablet = Path('src/geoworkbench/printing/tablet_print.py')
          text = tablet.read_text(encoding='utf-8')
          old = '    target_content_height: int | None = None,\n) -> TabletPrintSnapshot:\n'
          new = '    target_content_height: int | None = None,\n    layout_content_height: int | None = None,\n) -> TabletPrintSnapshot:\n'
          if old not in text and new not in text:
              raise SystemExit('tablet snapshot signature not found')
          text = text.replace(old, new, 1)
          validation_anchor = '''    if target_content_height is not None and (\n        isinstance(target_content_height, bool)\n        or not isinstance(target_content_height, int)\n        or target_content_height <= 0\n    ):\n        raise TabletPrintError("Автоматическая высота печатной формы должна быть положительной")\n'''
          validation = validation_anchor + '''    if layout_content_height is not None and (\n        isinstance(layout_content_height, bool)\n        or not isinstance(layout_content_height, int)\n        or layout_content_height <= 0\n    ):\n        raise TabletPrintError("Высота эталонной компоновки должна быть положительной")\n'''
          if validation_anchor not in text and 'Высота эталонной компоновки' not in text:
              raise SystemExit('tablet validation anchor not found')
          text = text.replace(validation_anchor, validation, 1)

          pattern = re.compile(
              r'    def build_layout\([^\n]*\) -> AdaptiveColumnLayout:\n.*?\n    layout = build_layout\(header_height\)',
              re.DOTALL,
          )
          replacement = '''    canonical_layout_height = max(\n        1, int(layout_content_height or content_height)\n    )\n\n    def build_layout(_measured_header_height: int) -> AdaptiveColumnLayout:\n        if not fit_columns:\n            return original_column_layout(definitions)\n        # Every vertical page uses the same canonical column widths. The final\n        # partial interval may have a shorter viewport, but it must never cause\n        # the graph and depth labels to be re-scaled horizontally.\n        return adaptive_column_layout(\n            definitions,\n            page_aspect_ratio=page_aspect_ratio,\n            content_height=canonical_layout_height,\n        )\n\n    layout = build_layout(header_height)'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1 and 'canonical_layout_height = max(' not in text:
              raise SystemExit(f'build_layout replacement count={count}')
          tablet.write_text(text, encoding='utf-8')

          test = Path('tests/test_partial_print_page_geometry.py')
          test.write_text('''from geoworkbench.printing.document_renderer import (\n    PrintDocumentPage,\n    PrintDocumentPlan,\n    _page_target_content_height,\n)\nfrom geoworkbench.printing.pagination import PrintPageSlice\nfrom geoworkbench.printing.print_layout import PrintContinuationSlice\n\n\ndef _page(start: float, end: float) -> PrintDocumentPage:\n    return PrintDocumentPage(\n        PrintPageSlice(start, end, 1, 1),\n        PrintContinuationSlice(0.0, 100.0, 1, 1, 1.0),\n        1,\n        1,\n    )\n\n\ndef test_full_automatic_page_keeps_canonical_viewport_height() -> None:\n    plan = PrintDocumentPlan(\n        (_page(0.0, 120.0),),\n        target_content_height_px=6000,\n        resolved_units_per_page=120.0,\n    )\n\n    assert _page_target_content_height(plan, plan.pages[0]) == 6000\n\n\ndef test_partial_last_page_shortens_only_its_viewport() -> None:\n    page = _page(1945.9, 2016.2)\n    plan = PrintDocumentPlan(\n        (page,),\n        target_content_height_px=6000,\n        resolved_units_per_page=126.593,\n    )\n\n    assert _page_target_content_height(plan, page) == round(\n        6000 * (2016.2 - 1945.9) / 126.593\n    )\n''', encoding='utf-8')
          PY
      - name: Remove temporary agent workflows
        shell: bash
        run: |
          rm -f .github/workflows/agent-diagnose-lba-print.yml
          rm -f .github/workflows/agent-apply-partial-page-fix.yml
      - name: Commit generated fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github/workflows
          if git diff --cached --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git commit -m 'fix: keep partial print pages at canonical column scale'
          git push origin HEAD:${{ github.head_ref }}
