name: Apply SEC-04 patch

on:
  push:
    branches: [sec04-wits0-retention-policy]
    paths:
      - ".sec04/**"
      - ".github/workflows/sec04-apply.yml"

permissions:
  contents: write

concurrency:
  group: sec04-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .sec04/patch_*.b64 | base64 --decode | gzip --decompress > /tmp/sec04.patch
          echo "39cc793c78e395b3650846c9e10be1a67ffbfcf1b071ba71e1d5d4fb29160a4e  /tmp/sec04.patch" | sha256sum --check --strict
          git apply --check /tmp/sec04.patch
          git apply --whitespace=nowarn /tmp/sec04.patch
          rm -rf .sec04 .github/workflows/sec04-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Secure WITS0 retention and remote bind"
          git push origin "HEAD:${GITHUB_REF_NAME}"
