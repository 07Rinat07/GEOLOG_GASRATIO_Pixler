name: Apply complete A4 gas form

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.pull_request.head.sha, 'complex-gas-applied') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/complex-gas-form-a4
          fetch-depth: 0

      - name: Copy audited gas calculations and form builder
        run: |
          git fetch origin feature/complex-gas-form
          git checkout origin/feature/complex-gas-form -- \
            src/geoworkbench/forms/complex_gas.py \
            src/geoworkbench/calculations/gas_ratio.py \
            docs/COMPLEX_GAS_FORM.md

      - name: Integrate complete layout into the current A4 catalog
        shell: python
        run: |
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one anchor, found {count}")
              return source.replace(old, new, 1)

          complex_path = Path("src/geoworkbench/forms/complex_gas.py")
          complex_text = complex_path.read_text(encoding="utf-8")
          sections_start = complex_text.index(
              "    sections: list[tuple[str, FormColumn]] = [\n"
          )
          sections_end = complex_text.index(
              "\n\n    columns: list[FormColumn] = []", sections_start
          )
          compact_sections = '''    sections: list[tuple[str, FormColumn]] = [
              (
                  "absolute",
                  _curve_column(
                      "column-complex-absolute",
                      _t("absolute", lang),
                      [
                          _binding(
                              "TG_CALC",
                              _t("absolute_sum", lang),
                              "%",
                              "#dc2626",
                              x_min=0.0,
                              x_max=100.0,
                              width=2.2,
                          ),
                          *_component_bindings(
                              lang,
                              unit="%",
                              x_min=0.0,
                              x_max=100.0,
                          ),
                      ],
                      gas_group,
                      width=480,
                      x_axis_label="%",
                  ),
              ),
              (
                  "normalized",
                  _curve_column(
                      "column-complex-normalized-components",
                      _t("normalized_components", lang),
                      [
                          _binding(
                              "TG_NORM",
                              _t("normalized_total", lang),
                              "norm",
                              "#7c3aed",
                              x_min=None,
                              x_max=None,
                              width=2.2,
                          ),
                          *_normalized_bindings(lang),
                      ],
                      gas_group,
                      width=500,
                      x_axis_label="norm",
                  ),
              ),
              (
                  "relative",
                  _curve_column(
                      "column-complex-relative",
                      _t("relative", lang),
                      _relative_bindings(lang),
                      gas_group,
                      width=480,
                      x_axis_label="% ΣC1–C5",
                  ),
              ),
              (
                  "ratios",
                  _curve_column(
                      "column-complex-ratios",
                      _t("ratios", lang),
                      _ratio_bindings(lang),
                      gas_group,
                      width=400,
                      x_axis_label="ratio",
                  ),
              ),
              (
                  "pixler",
                  _curve_column(
                      "column-complex-pixler",
                      _t("pixler", lang),
                      _pixler_bindings(),
                      gas_group,
                      width=380,
                      x_axis_label="ratio (log)",
                  ),
              ),
          ]'''
          complex_text = (
              complex_text[:sections_start]
              + compact_sections
              + complex_text[sections_end:]
          )
          complex_text = complex_text.replace(
              'unit="normalized gas units",', 'unit="norm",'
          )
          complex_text = complex_text.replace(
              '"normalized gas units",\n                color,', '"norm",\n                color,'
          )
          complex_path.write_text(complex_text, encoding="utf-8")

          a4_path = Path("src/geoworkbench/forms/a4_factory_templates.py")
          a4_text = a4_path.read_text(encoding="utf-8")
          import_anchor = (
              "from geoworkbench.forms.models import "
              "FormAxisKind, FormDocument, ParameterBinding\n"
          )
          import_line = "from geoworkbench.forms.complex_gas import complex_gas_form\n"
          if import_line not in a4_text:
              a4_text = replace_once(
                  a4_text,
                  import_anchor,
                  import_line + import_anchor,
                  "complex gas import",
              )

          function_start = a4_text.index(
              "def _complex_gas(language: TemplateLanguage, orientation: str) -> FormDocument:\n"
          )
          function_end = a4_text.index(
              "\ndef a4_factory_templates(language: str = \"ru\")", function_start
          )
          a4_function = '''def _complex_gas(language: TemplateLanguage, orientation: str) -> FormDocument:
              """Build the complete C1-C5 gas form with an internal depth scale per graph."""

              landscape = orientation == "landscape"
              form = complex_gas_form(language)
              form.form_id = f"factory-complex-gas-a4-{orientation}"
              form.name = _name("complex_gas", language, orientation)

              depth_width = 55 if landscape else 48
              graph_widths = (
                  (150, 140, 145, 140, 140)
                  if landscape
                  else (96, 90, 90, 82, 82)
              )
              graph_index = 0
              for column in form.columns:
                  if column.tracks and column.tracks[0].kind is TrackKind.DEPTH:
                      column.width = depth_width
                  else:
                      column.width = graph_widths[graph_index]
                      graph_index += 1

              if graph_index != len(graph_widths):
                  raise RuntimeError("Unexpected complex-gas column structure")
              return _finalize(form, "gas_interpretation", orientation)

'''
          a4_text = a4_text[:function_start] + a4_function + a4_text[function_end + 1 :]
          a4_path.write_text(a4_text, encoding="utf-8")

          init_path = Path("src/geoworkbench/forms/__init__.py")
          init_text = init_path.read_text(encoding="utf-8")
          init_import = "from geoworkbench.forms.complex_gas import complex_gas_form\n"
          if init_import not in init_text:
              init_text = replace_once(
                  init_text,
                  "from geoworkbench.forms.models import (\n",
                  init_import + "from geoworkbench.forms.models import (\n",
                  "package export import",
              )
          if '    "complex_gas_form",\n' not in init_text:
              init_text = replace_once(
                  init_text,
                  '    "build_masterlog_from_form",\n',
                  '    "build_masterlog_from_form",\n    "complex_gas_form",\n',
                  "package export name",
              )
          init_path.write_text(init_text, encoding="utf-8")

          docs_path = Path("docs/COMPLEX_GAS_FORM.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs = docs.replace(
              "Заводская форма `factory-complex-gas-analysis` предназначена",
              "Заводские формы `factory-complex-gas-a4-portrait` и "
              "`factory-complex-gas-a4-landscape` предназначены",
          )
          docs = docs.replace(
              "Перед каждой из семи графических колонок",
              "Перед каждой из пяти графических колонок",
          )
          docs_path.write_text(docs, encoding="utf-8")

          a4_tests_path = Path("tests/test_a4_factory_templates.py")
          a4_tests = a4_tests_path.read_text(encoding="utf-8")
          test_start = a4_tests.index(
              "def test_complex_gas_factory_contains_all_requested_gas_groups() -> None:\n"
          )
          test_end = a4_tests.index(
              "\ndef test_legacy_forms_remain_resolvable_but_are_hidden()", test_start
          )
          replacement_test = '''def test_complex_gas_factory_contains_all_requested_gas_groups() -> None:
              form = a4_factory_templates("ru")["factory-complex-gas-a4-landscape"]
              graph_columns = form.columns[1::2]
              canonical_ids = {
                  binding.canonical_parameter_id
                  for column in form.columns
                  for track in column.tracks
                  for binding in track.bindings
              }

              assert len(form.columns) == 10
              assert all(
                  form.columns[index].tracks[0].kind.value == "depth"
                  and form.columns[index + 1].tracks[0].kind.value == "curve"
                  for index in range(0, len(form.columns), 2)
              )
              assert [column.title for column in graph_columns] == [
                  "Абсолютные компоненты",
                  "Нормализованные компоненты",
                  "Относительный газ",
                  "Wetness, Balance, Character и изомеры",
                  "Коэффициенты Pixler",
              ]
              assert {
                  "TG_CALC",
                  "C1",
                  "C2",
                  "C3",
                  "IC4",
                  "NC4",
                  "IC5",
                  "NC5",
                  "TG_NORM",
                  "C1_NORM_REF",
                  "C2_NORM",
                  "C3_NORM",
                  "IC4_NORM",
                  "NC4_NORM",
                  "IC5_NORM",
                  "NC5_NORM",
                  "C1_REL",
                  "C2_REL",
                  "C3_REL",
                  "IC4_REL",
                  "NC4_REL",
                  "IC5_REL",
                  "NC5_REL",
                  "WETNESS",
                  "BALANCE",
                  "CHARACTER",
                  "IC4_NC4",
                  "IC5_NC5",
                  "PIXLER_C1_C2",
                  "PIXLER_C1_C3",
                  "PIXLER_C1_C4",
                  "PIXLER_C1_C5",
              } <= canonical_ids

'''
          a4_tests = a4_tests[:test_start] + replacement_test + a4_tests[test_end + 1 :]
          a4_tests_path.write_text(a4_tests, encoding="utf-8")

          Path("tests/test_complex_gas_form.py").write_text(
              '''from __future__ import annotations

import numpy as np

from geoworkbench.calculations.gas_ratio import calculate_basic_ratios
from geoworkbench.forms.a4_factory_templates import a4_factory_templates
from geoworkbench.forms.complex_gas import complex_gas_form
from geoworkbench.tablet.models import TrackKind, XScale


SEVEN_COMPONENTS = ("C1", "C2", "C3", "IC4", "NC4", "IC5", "NC5")


def _track(form, track_id: str):
    return next(
        track
        for column in form.columns
        for track in column.tracks
        if track.track_id == track_id
    )


def _assert_complete_layout(form, expected_depth_width: int) -> None:
    assert len(form.columns) == 10
    assert all(
        form.columns[index].tracks[0].kind is TrackKind.DEPTH
        and form.columns[index + 1].tracks[0].kind is TrackKind.CURVE
        for index in range(0, len(form.columns), 2)
    )
    depth_columns = form.columns[::2]
    assert len({column.column_id for column in depth_columns}) == 5
    assert len({column.tracks[0].track_id for column in depth_columns}) == 5
    assert all(column.width == expected_depth_width for column in depth_columns)
    assert all(column.tracks[0].show_interval_labels for column in depth_columns)


def test_complex_gas_builder_contains_all_requested_tracks() -> None:
    form = complex_gas_form("ru")
    assert form.name == "Комплексная газовая форма"
    _assert_complete_layout(form, 96)

    absolute = _track(form, "track-column-complex-absolute")
    assert tuple(binding.canonical_parameter_id for binding in absolute.bindings) == (
        "TG_CALC",
        *SEVEN_COMPONENTS,
    )
    assert all(binding.unit == "%" for binding in absolute.bindings)
    assert all((binding.x_min, binding.x_max) == (0.0, 100.0) for binding in absolute.bindings)

    normalized = _track(form, "track-column-complex-normalized-components")
    assert tuple(binding.canonical_parameter_id for binding in normalized.bindings) == (
        "TG_NORM",
        "C1_NORM_REF",
        "C2_NORM",
        "C3_NORM",
        "IC4_NORM",
        "NC4_NORM",
        "IC5_NORM",
        "NC5_NORM",
    )
    assert all(binding.unit == "norm" for binding in normalized.bindings)

    relative = _track(form, "track-column-complex-relative")
    assert tuple(binding.canonical_parameter_id for binding in relative.bindings) == tuple(
        f"{component}_REL" for component in SEVEN_COMPONENTS
    )
    assert all(binding.unit == "% of ΣC1–C5" for binding in relative.bindings)

    ratios = _track(form, "track-column-complex-ratios")
    assert tuple(binding.canonical_parameter_id for binding in ratios.bindings) == (
        "WETNESS",
        "BALANCE",
        "CHARACTER",
        "IC4_NC4",
        "IC5_NC5",
    )
    assert ratios.bindings[0].x_scale is XScale.LINEAR
    assert all(binding.x_scale is XScale.LOGARITHMIC for binding in ratios.bindings[1:])

    pixler = _track(form, "track-column-complex-pixler")
    assert tuple(binding.canonical_parameter_id for binding in pixler.bindings) == (
        "PIXLER_C1_C2",
        "PIXLER_C1_C3",
        "PIXLER_C1_C4",
        "PIXLER_C1_C5",
    )
    assert all(binding.x_scale is XScale.LOGARITHMIC for binding in pixler.bindings)

    all_bindings = [
        binding
        for column in form.columns
        for track in column.tracks
        for binding in track.bindings
    ]
    assert all(binding.header_text_color == binding.style.color for binding in all_bindings)
    assert all(binding.header_line_color == binding.style.color for binding in all_bindings)


def test_both_a4_complex_gas_forms_use_internal_depth_scales_and_fit_a4() -> None:
    forms = a4_factory_templates("ru")
    portrait = forms["factory-complex-gas-a4-portrait"]
    landscape = forms["factory-complex-gas-a4-landscape"]

    assert portrait.name == "Комплексная газовая форма — A4 книжная"
    assert landscape.name == "Комплексная газовая форма — A4 альбомная"
    _assert_complete_layout(portrait, 48)
    _assert_complete_layout(landscape, 55)
    assert portrait.print_header_template_id.endswith("portrait")
    assert landscape.print_header_template_id.endswith("landscape")


def test_seven_component_calculation_does_not_double_count_aggregate_c4_c5() -> None:
    results = calculate_basic_ratios(
        {
            "C1": np.array([80.0]),
            "C2": np.array([10.0]),
            "C3": np.array([5.0]),
            "IC4": np.array([1.0]),
            "NC4": np.array([2.0]),
            "IC5": np.array([1.0]),
            "NC5": np.array([1.0]),
            "C4": np.array([999.0]),
            "C5": np.array([999.0]),
        }
    )

    np.testing.assert_allclose(results["TG_CALC"].values, [100.0])
    relative_sum = sum(results[f"{component}_REL"].values for component in SEVEN_COMPONENTS)
    np.testing.assert_allclose(relative_sum, [100.0])
    np.testing.assert_allclose(results["C4_REL"].values, [3.0])
    np.testing.assert_allclose(results["C5_REL"].values, [2.0])
    np.testing.assert_allclose(results["WETNESS"].values, [20.0])
    np.testing.assert_allclose(results["BALANCE"].values, [9.0])
    np.testing.assert_allclose(results["CHARACTER"].values, [1.0])
    np.testing.assert_allclose(results["IC4_NC4"].values, [0.5])
    np.testing.assert_allclose(results["IC5_NC5"].values, [1.0])
    np.testing.assert_allclose(results["PIXLER_C1_C2"].values, [8.0])
    np.testing.assert_allclose(results["PIXLER_C1_C3"].values, [16.0])
    np.testing.assert_allclose(results["PIXLER_C1_C4"].values, [80.0 / 3.0])
    np.testing.assert_allclose(results["PIXLER_C1_C5"].values, [40.0])


def test_aggregate_c4_c5_remain_supported_as_fallback() -> None:
    results = calculate_basic_ratios(
        {
            "C1": np.array([80.0]),
            "C2": np.array([10.0]),
            "C3": np.array([5.0]),
            "C4": np.array([3.0]),
            "C5": np.array([2.0]),
        }
    )

    np.testing.assert_allclose(results["TG_CALC"].values, [100.0])
    np.testing.assert_allclose(results["C4_REL"].values, [3.0])
    np.testing.assert_allclose(results["C5_REL"].values, [2.0])
    np.testing.assert_allclose(results["PIXLER_C1_C4"].values, [80.0 / 3.0])
    np.testing.assert_allclose(results["PIXLER_C1_C5"].values, [40.0])
''',
              encoding="utf-8",
          )

          Path(".github/workflows/apply-complex-gas-a4.yml").unlink()

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"

      - name: Run focused quality checks
        run: |
          python -m ruff check \
            src/geoworkbench/forms/complex_gas.py \
            src/geoworkbench/forms/a4_factory_templates.py \
            src/geoworkbench/forms/__init__.py \
            src/geoworkbench/calculations/gas_ratio.py \
            tests/test_complex_gas_form.py \
            tests/test_a4_factory_templates.py
          python -m mypy \
            src/geoworkbench/forms/complex_gas.py \
            src/geoworkbench/forms/a4_factory_templates.py \
            src/geoworkbench/calculations/gas_ratio.py
          python -m pytest -q \
            tests/test_complex_gas_form.py \
            tests/test_a4_factory_templates.py
          git diff --check

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete A4 gas form C1-C5 [complex-gas-applied]"
          git push origin HEAD:feature/complex-gas-form-a4
