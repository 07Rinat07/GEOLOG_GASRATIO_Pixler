name: Apply WELL-04 source language UI patch

on:
  push:
    branches:
      - feature/well-04-cuttings-source-language-ui

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  QT_QPA_PLATFORM: offscreen
  QT_OPENGL: software
  QT_QUICK_BACKEND: software
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/well-04-cuttings-source-language-ui

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock

      - name: Apply source and tests
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          source_path = Path("src/geoworkbench/ui/unified_cuttings_sample_dialog.py")
          source = source_path.read_text(encoding="utf-8")

          replacements = (
              (
                  '        "description_template_language": "Язык готового описания",',
                  '        "description_source_language": "Язык оригинала описания",\n'
                  '        "description_source_language_keep_current": "Сохранить текущий язык оригинала",\n'
                  '        "description_template_language": "Язык готового описания",',
              ),
              (
                  '        "description_template_language": "Дайын сипаттаманың тілі",',
                  '        "description_source_language": "Сипаттаманың түпнұсқа тілі",\n'
                  '        "description_source_language_keep_current": "Ағымдағы түпнұсқа тілін сақтау",\n'
                  '        "description_template_language": "Дайын сипаттаманың тілі",',
              ),
              (
                  '        "description_template_language": "Ready-description language",',
                  '        "description_source_language": "Description source language",\n'
                  '        "description_source_language_keep_current": "Keep current source language",\n'
                  '        "description_template_language": "Ready-description language",',
              ),
          )
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"Expected exactly one localization anchor: {old!r}")
              source = source.replace(old, new, 1)

          old_widget = '''        template_form = QFormLayout()\n        self.description_template_language_input = QComboBox()\n'''
          new_widget = '''        template_form = QFormLayout()\n        self.description_source_language_input = QComboBox()\n        self.description_source_language_input.setObjectName(\n            "cuttings-description-source-language"\n        )\n        if sample is not None:\n            self.description_source_language_input.addItem(\n                self._text["description_source_language_keep_current"], None\n            )\n        for source_language in AppLanguage:\n            self.description_source_language_input.addItem(\n                LANGUAGE_NAMES[source_language], source_language.value\n            )\n        if sample is None:\n            source_language_index = self.description_source_language_input.findData(\n                self._language.value\n            )\n            if source_language_index >= 0:\n                self.description_source_language_input.setCurrentIndex(source_language_index)\n        template_form.addRow(\n            self._text["description_source_language"],\n            self.description_source_language_input,\n        )\n\n        self.description_template_language_input = QComboBox()\n'''
          if source.count(old_widget) != 1:
              raise SystemExit("Description form anchor changed")
          source = source.replace(old_widget, new_widget, 1)

          old_values = '''        return {\n            "description": self.rich_description.html(),\n            "description_i18n": descriptions,\n'''
          new_values = '''        return {\n            "description": self.rich_description.html(),\n            "description_source_language": self.description_source_language_input.currentData(),\n            "description_i18n": descriptions,\n'''
          if source.count(old_values) != 1:
              raise SystemExit("Values contract anchor changed")
          source = source.replace(old_values, new_values, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_cuttings_source_language_ui.py")
          test_path.write_text(
              '''from __future__ import annotations\n\nfrom geoworkbench.domain.models import CuttingsSample\nfrom geoworkbench.services.localization import AppLanguage\nfrom geoworkbench.ui.unified_cuttings_sample_dialog import UnifiedCuttingsSampleDialog\n\n\ndef _dialog(\n    *,\n    language: AppLanguage,\n    sample: CuttingsSample | None = None,\n) -> UnifiedCuttingsSampleDialog:\n    return UnifiedCuttingsSampleDialog(\n        100.0,\n        105.0,\n        (),\n        language=language,\n        sample=sample,\n    )\n\n\ndef test_new_sample_defaults_source_language_to_ui_language(qapp) -> None:\n    dialog = _dialog(language=AppLanguage.KK)\n\n    assert dialog.description_source_language_input.currentData() == "kk"\n    assert dialog.values()["description_source_language"] == "kk"\n\n\ndef test_existing_sample_preserves_source_language_by_default(qapp) -> None:\n    sample = CuttingsSample(sample_id="sample-1", top_depth=100.0, bottom_depth=105.0)\n    dialog = _dialog(language=AppLanguage.EN, sample=sample)\n\n    assert dialog.description_source_language_input.currentData() is None\n    assert dialog.values()["description_source_language"] is None\n\n\ndef test_existing_sample_can_explicitly_change_source_language(qapp) -> None:\n    sample = CuttingsSample(sample_id="sample-1", top_depth=100.0, bottom_depth=105.0)\n    dialog = _dialog(language=AppLanguage.EN, sample=sample)\n    russian_index = dialog.description_source_language_input.findData("ru")\n\n    assert russian_index >= 0\n    dialog.description_source_language_input.setCurrentIndex(russian_index)\n    assert dialog.values()["description_source_language"] == "ru"\n''',
              encoding="utf-8",
          )
          '@ | .\.venv\Scripts\python.exe -

      - name: Install release test environment
        shell: pwsh
        run: |
          uv venv .venv --python 3.11
          uv pip sync requirements/release.lock --python .venv --require-hashes
          uv pip install --python .venv `
            setuptools==83.0.0 `
            wheel==0.47.0 `
            pytest==9.1.1 `
            ruff==0.15.22
          uv pip install --python .venv --no-deps --no-build-isolation --editable .

      - name: Verify focused change
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m ruff check `
            src/geoworkbench/ui/unified_cuttings_sample_dialog.py `
            tests/test_cuttings_source_language_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pytest -q `
            tests/test_cuttings_source_language_ui.py `
            -p no:cacheprovider
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/geoworkbench/ui/unified_cuttings_sample_dialog.py tests/test_cuttings_source_language_ui.py
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "feat(well): expose cuttings description source language"
          git push origin HEAD:feature/well-04-cuttings-source-language-ui
