name: Finalize gas rendering continuity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-gas-rendering.yml

permissions:
  contents: write

concurrency:
  group: finalize-gas-rendering
  cancel-in-progress: false

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply guarded gas rendering patch
        shell: pwsh
        run: |
          $patch = @'
          from __future__ import annotations

          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected one replacement, found {count}: {old[:80]!r}"
                  )
              target.write_text(text.replace(old, new, 1), encoding="utf-8")


          sampling = "src/geoworkbench/tablet/sampling.py"
          replace_once(
              sampling,
              "_AXIS_GAP_FACTOR = 5.0\n_VIEWPORT_CONTEXT_POINTS = 2\n",
              "_AXIS_GAP_FACTOR = 5.0\n"
              "_VIEWPORT_CONTEXT_POINTS = 2\n"
              "_SHORT_GAP_AXIS_STEP_FACTOR = 4.0\n"
              "_SHORT_GAP_FINITE_STEP_FACTOR = 2.5\n",
          )
          replace_once(
              sampling,
              "    bridge_sparse_updates: bool = False,\n"
              ") -> tuple[NDArray[np.float64], NDArray[np.float64]]:\n",
              "    bridge_sparse_updates: bool = False,\n"
              "    bridge_short_gaps: bool = False,\n"
              ") -> tuple[NDArray[np.float64], NDArray[np.float64]]:\n",
          )
          replace_once(
              sampling,
              "    normal_step = _nominal_axis_step(ordered_depth)\n",
              "    short_gap_limit = (\n"
              "        _short_gap_distance_limit(ordered_depth, ordered_values)\n"
              "        if bridge_short_gaps\n"
              "        else None\n"
              "    )\n"
              "    normal_step = _nominal_axis_step(ordered_depth)\n",
          )
          replace_once(
              sampling,
              "    selected_values[~np.isfinite(selected_values)] = np.nan\n"
              "    if positive_values_only:\n"
              "        selected_values[selected_values <= 0.0] = np.nan\n\n"
              "    selected_depth, selected_values = _collapse_duplicate_axis_samples(\n",
              "    selected_values[~np.isfinite(selected_values)] = np.nan\n"
              "    if short_gap_limit is not None:\n"
              "        selected_values = interpolate_short_nan_gaps(\n"
              "            selected_depth,\n"
              "            selected_values,\n"
              "            max_gap=short_gap_limit,\n"
              "        )\n"
              "    if positive_values_only:\n"
              "        selected_values[selected_values <= 0.0] = np.nan\n\n"
              "    selected_depth, selected_values = _collapse_duplicate_axis_samples(\n",
          )
          replace_once(
              sampling,
              "\ndef _collapse_duplicate_axis_samples(\n",
              '''

          def _short_gap_distance_limit(
              axis: NDArray[np.float64], values: NDArray[np.float64]
          ) -> float | None:
              """Return a conservative interpolation distance for sparse channels."""

              finite_positions = np.flatnonzero(np.isfinite(values))
              if finite_positions.size < 2:
                  return None
              finite_steps = np.diff(axis[finite_positions])
              finite_steps = finite_steps[
                  np.isfinite(finite_steps) & (finite_steps > 0.0)
              ]
              if finite_steps.size == 0:
                  return None

              # Use the denser half of observed update intervals. Long acquisition
              # outages must not inflate the normal sparse-channel cadence.
              ordered_steps = np.sort(finite_steps)
              dense_half = ordered_steps[: max(1, (ordered_steps.size + 1) // 2)]
              typical_finite_step = float(np.median(dense_half))
              nominal_axis_step = _nominal_axis_step(axis)
              limit = typical_finite_step * _SHORT_GAP_FINITE_STEP_FACTOR
              if nominal_axis_step is not None:
                  limit = max(limit, nominal_axis_step * _SHORT_GAP_AXIS_STEP_FACTOR)
              return limit if np.isfinite(limit) and limit > 0.0 else None


          def interpolate_short_nan_gaps(
              axis: NDArray[np.float64],
              values: NDArray[np.float64],
              *,
              max_gap: float | None = None,
          ) -> NDArray[np.float64]:
              """Interpolate only short NaN runs bounded by real samples.

              Long acquisition outages remain NaN. Explicit finite zero/negative
              readings remain hard samples; logarithmic filtering is applied by the
              caller after interpolation, so such rows still split the rendered line.
              """

              axis_array = np.asarray(axis, dtype=np.float64)
              output = np.asarray(values, dtype=np.float64).copy()
              if axis_array.shape != output.shape:
                  raise ValueError(
                      "Шкала глубины и значения кривой должны иметь одинаковую форму"
                  )
              if output.size < 3:
                  return output
              limit = (
                  _short_gap_distance_limit(axis_array, output)
                  if max_gap is None
                  else float(max_gap)
              )
              if limit is None or not np.isfinite(limit) or limit <= 0.0:
                  return output

              finite_positions = np.flatnonzero(
                  np.isfinite(axis_array) & np.isfinite(output)
              )
              for left, right in zip(
                  finite_positions[:-1], finite_positions[1:], strict=True
              ):
                  if right - left <= 1:
                      continue
                  distance = float(axis_array[right] - axis_array[left])
                  if not np.isfinite(distance) or distance <= 0.0 or distance > limit:
                      continue
                  interior = slice(int(left) + 1, int(right))
                  interior_axis = axis_array[interior]
                  valid_axis = np.isfinite(interior_axis)
                  if not np.any(valid_axis):
                      continue
                  interpolated = np.interp(
                      interior_axis[valid_axis],
                      (axis_array[left], axis_array[right]),
                      (output[left], output[right]),
                  )
                  interior_values = output[interior]
                  missing = ~np.isfinite(interior_values)
                  interior_values[valid_axis & missing] = interpolated[
                      missing[valid_axis]
                  ]
                  output[interior] = interior_values
              return output


          def _collapse_duplicate_axis_samples(
          ''',
          )

          geometry = "src/geoworkbench/tablet/geometry_cache.py"
          replace_once(
              geometry,
              "_PARADOX_SPARSE_TIME_AXIS_SUFFIXES = (\n"
              '    ":paradox-datetime",\n'
              '    ":paradox-elapsed",\n'
              ")\n",
              "_PARADOX_SPARSE_TIME_AXIS_SUFFIXES = (\n"
              '    ":paradox-datetime",\n'
              '    ":paradox-elapsed",\n'
              ")\n\n"
              "_GAS_CURVE_EXACT_IDS = frozenset(\n"
              "    {\n"
              '        "C1",\n'
              '        "C2",\n'
              '        "C3",\n'
              '        "C4",\n'
              '        "C5",\n'
              '        "IC4",\n'
              '        "NC4",\n'
              '        "IC5",\n'
              '        "NC5",\n'
              '        "TOTAL_GAS",\n'
              '        "TG_CALC",\n'
              '        "TG_NORM",\n'
              '        "WETNESS",\n'
              '        "BALANCE",\n'
              '        "CHARACTER",\n'
              '        "IC4_NC4",\n'
              '        "IC5_NC5",\n'
              "    }\n"
              ")\n\n\n"
              "def is_gas_curve_id(curve_id: Hashable) -> bool:\n"
              '    """Return whether a rendered curve uses the sparse gas policy."""\n\n'
              '    token = str(curve_id).strip().upper().replace("-", "_")\n'
              '    token = token.rsplit(":", 1)[-1]\n'
              "    return (\n"
              "        token in _GAS_CURVE_EXACT_IDS\n"
              '        or token.startswith("PIXLER_")\n'
              '        or token.endswith("_REL")\n'
              '        or token.endswith("_NORM")\n'
              '        or token.endswith("_NORM_REF")\n'
              "    )\n",
          )
          replace_once(
              geometry,
              "        self._misses += 1\n"
              "        sampled_values, sampled_axis = select_visible_samples(\n",
              "        self._misses += 1\n"
              "        gas_curve = is_gas_curve_id(key.curve_id)\n"
              "        sampled_values, sampled_axis = select_visible_samples(\n",
          )
          replace_once(
              geometry,
              "            positive_values_only=key.positive_values_only,\n"
              "            include_viewport_context=False,\n"
              "            bridge_sparse_updates=_bridges_sparse_time_updates(key.axis_id),\n",
              "            positive_values_only=key.positive_values_only,\n"
              "            include_viewport_context=gas_curve,\n"
              "            bridge_sparse_updates=_bridges_sparse_time_updates(key.axis_id),\n"
              "            bridge_short_gaps=gas_curve,\n",
          )

          relative = "src/geoworkbench/tablet/relative_gas.py"
          replace_once(
              relative,
              "from geoworkbench.tablet.sampling import select_visible_samples\n",
              "from geoworkbench.tablet.sampling import (\n"
              "    interpolate_short_nan_gaps,\n"
              "    select_visible_samples,\n"
              ")\n",
          )
          replace_once(
              relative,
              "    marker = np.where(row_valid, 100.0, np.nan)\n"
              "    _, selected_depth = select_visible_samples(\n",
              "    # Gas channels commonly update less often than the common depth\n"
              "    # index. Interpolate only short, bounded holes in each normalized\n"
              "    # component. Long acquisition outages remain explicit NaN gaps.\n"
              "    for row in range(normalized.shape[0]):\n"
              "        normalized[row] = interpolate_short_nan_gaps(\n"
              "            unique_axis, normalized[row]\n"
              "        )\n"
              "    row_valid = np.any(np.isfinite(normalized), axis=0)\n"
              "    marker = np.where(row_valid, 100.0, np.nan)\n"
              "    _, selected_depth = select_visible_samples(\n",
          )
          replace_once(
              relative,
              "        bottom,\n"
              "        max_points=max_points,\n"
              "    )\n",
              "        bottom,\n"
              "        max_points=max_points,\n"
              "        include_viewport_context=True,\n"
              "    )\n",
          )

          tablet = "src/geoworkbench/tablet/tablet_view.py"
          replace_once(
              tablet,
              "        font_size = 16 if self._print_mode else 9\n",
              "        font_size = 10 if self._print_mode else 9\n",
          )

          tests = Path("tests/test_gas_curve_rendering_continuity.py")
          tests.write_text(
              '''from __future__ import annotations

          import numpy as np

          from geoworkbench.tablet.geometry_cache import (
              CurveGeometryCache,
              CurveGeometryKey,
          )
          from geoworkbench.tablet.relative_gas import build_relative_gas_stack
          from geoworkbench.tablet.sampling import select_visible_samples
          from geoworkbench.tablet.tablet_view import CurveHeaderLabel


          def _geometry_key(curve_id: str, top: float, bottom: float) -> CurveGeometryKey:
              return CurveGeometryKey(
                  curve_id=curve_id,
                  axis_id="depth",
                  values_revision="values-v1",
                  axis_revision="axis-v1",
                  top=top,
                  bottom=bottom,
                  max_points=256,
                  positive_values_only=False,
              )


          def _value_at(
              sampled_axis: np.ndarray, sampled_values: np.ndarray, axis_value: float
          ) -> float:
              matches = np.flatnonzero(np.isclose(sampled_axis, axis_value))
              assert matches.size == 1
              return float(sampled_values[int(matches[0])])


          def test_relative_gas_print_header_uses_same_compact_font_as_rulers(qapp) -> None:
              label = CurveHeaderLabel(
                  "C1_REL",
                  "Метан C1\\n0 … 100 % · Σ=100%",
                  "#111827",
              )

              label.set_print_mode(True)

              assert "font-size: 10px" in label.styleSheet()
              assert "font-size: 16px" not in label.styleSheet()
              label.close()


          def test_default_sampling_preserves_missing_rows() -> None:
              axis = np.arange(0.0, 31.0)
              values = np.full(axis.shape, np.nan)
              values[[0, 3, 30]] = (10.0, 13.0, 20.0)

              sampled_values, sampled_axis = select_visible_samples(
                  axis, values, 0.0, 30.0, max_points=256
              )

              assert np.isnan(_value_at(sampled_axis, sampled_values, 1.0))
              assert np.isnan(_value_at(sampled_axis, sampled_values, 10.0))


          def test_gas_geometry_bridges_short_sparse_updates_but_keeps_long_outage() -> None:
              axis = np.arange(0.0, 31.0)
              values = np.full(axis.shape, np.nan)
              values[[0, 3, 30]] = (10.0, 13.0, 20.0)
              cache = CurveGeometryCache()

              sampled_values, sampled_axis = cache.get_or_build(
                  _geometry_key("C1", 0.0, 30.0), axis, values
              )

              assert _value_at(sampled_axis, sampled_values, 1.0) == 11.0
              assert _value_at(sampled_axis, sampled_values, 2.0) == 12.0
              assert np.isnan(_value_at(sampled_axis, sampled_values, 10.0))


          def test_non_gas_geometry_keeps_the_original_gap_policy() -> None:
              axis = np.arange(0.0, 6.0)
              values = np.array([1.0, np.nan, np.nan, 4.0, 5.0, 6.0])
              cache = CurveGeometryCache()

              sampled_values, sampled_axis = cache.get_or_build(
                  _geometry_key("GR", 0.0, 5.0), axis, values
              )

              assert np.isnan(_value_at(sampled_axis, sampled_values, 1.0))
              assert np.isnan(_value_at(sampled_axis, sampled_values, 2.0))


          def test_gas_geometry_keeps_context_points_across_page_edges() -> None:
              axis = np.arange(0.0, 21.0)
              values = axis * 2.0
              cache = CurveGeometryCache()

              gas_values, gas_axis = cache.get_or_build(
                  _geometry_key("TG_CALC", 10.1, 11.1), axis, values
              )
              generic_values, generic_axis = cache.get_or_build(
                  _geometry_key("ROP", 10.1, 11.1), axis, values
              )

              assert gas_values.size == gas_axis.size
              assert generic_values.size == generic_axis.size
              assert gas_axis.min() < 10.1
              assert gas_axis.max() > 11.1
              assert gas_axis.size > generic_axis.size


          def test_relative_gas_interpolates_short_rows_and_preserves_long_outage() -> None:
              axis = np.arange(0.0, 31.0)
              methane = np.full(axis.shape, np.nan)
              ethane = np.full(axis.shape, np.nan)
              methane[[0, 3, 30]] = (80.0, 70.0, 60.0)
              ethane[[0, 3, 30]] = (20.0, 30.0, 40.0)

              stack = build_relative_gas_stack(
                  axis,
                  {"C1_REL": methane, "C2_REL": ethane},
                  0.0,
                  30.0,
                  max_points=256,
              )

              first_band = stack.bands[0]
              final_band = stack.bands[-1]
              index_one = int(np.flatnonzero(np.isclose(stack.depth, 1.0))[0])
              index_ten = int(np.flatnonzero(np.isclose(stack.depth, 10.0))[0])

              assert np.isfinite(first_band.upper[index_one])
              assert final_band.upper[index_one] == 100.0
              assert np.isnan(first_band.upper[index_ten])
              assert np.isnan(final_band.upper[index_ten])
          ''',
              encoding="utf-8",
          )

          workflow = Path(".github/workflows/finalize-gas-rendering.yml")
          workflow.unlink()
          '@
          $patch | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock

      - name: Verify targeted changes
        shell: pwsh
        run: |
          uv venv .venv --python 3.11
          uv pip sync requirements/release.lock --python .venv --require-hashes
          uv pip install --python .venv `
            pytest==9.1.1 `
            ruff==0.15.22
          uv pip install --python .venv --no-deps --no-build-isolation --editable .

          .\.venv\Scripts\python.exe -m compileall -q `
            src/geoworkbench/tablet/sampling.py `
            src/geoworkbench/tablet/geometry_cache.py `
            src/geoworkbench/tablet/relative_gas.py `
            src/geoworkbench/tablet/tablet_view.py `
            tests/test_gas_curve_rendering_continuity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\.venv\Scripts\python.exe -m ruff check `
            src/geoworkbench/tablet/sampling.py `
            src/geoworkbench/tablet/geometry_cache.py `
            src/geoworkbench/tablet/relative_gas.py `
            src/geoworkbench/tablet/tablet_view.py `
            tests/test_gas_curve_rendering_continuity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\.venv\Scripts\python.exe -m pytest -q -p no:cacheprovider `
            tests/test_gas_curve_rendering_continuity.py `
            tests/test_tablet_view.py::test_track_print_mode_hides_header_editor_actions_and_scrollbar `
            tests/test_curve_header_readability_0753.py `
            tests/test_compact_parameter_rulers_0767.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit clean patch to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "fix: unify gas headers and sparse curve continuity"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
