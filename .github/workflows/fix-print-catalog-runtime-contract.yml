name: Fix print catalog runtime contract

on:
  push:
    branches:
      - feature-print-header-logo-catalogs
    paths:
      - .github/workflows/fix-print-catalog-runtime-contract.yml

permissions:
  contents: write

jobs:
  fix-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize project v22 documentation markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          architecture = Path('docs/ARCHITECTURE.md')
          text = architecture.read_text(encoding='utf-8')
          old = '<!-- runtime-contract: package=0.7.93; project=v21; form=v11; layout=v21 -->'
          new = '<!-- runtime-contract: package=0.7.93; project=v22; form=v11; layout=v21 -->'
          if old not in text:
              raise SystemExit('ARCHITECTURE runtime marker not found')
          architecture.write_text(text.replace(old, new, 1), encoding='utf-8')

          plan = Path('docs/PROJECT_PLAN.md')
          text = plan.read_text(encoding='utf-8')
          if old not in text:
              raise SystemExit('PROJECT_PLAN runtime marker not found')
          text = text.replace(old, new, 1)
          text = text.replace('пакет `0.7.93`; project `v21`; form `v11`; tablet layout `v21`;',
                              'пакет `0.7.93`; project `v22`; form `v11`; tablet layout `v21`;', 1)
          plan.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-print-catalog-runtime-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Synchronize project v22 documentation contract"
          git push origin HEAD
