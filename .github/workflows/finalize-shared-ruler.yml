name: Finalize shared ruler

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-shared-ruler.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply guarded patch
        shell: pwsh
        run: |
          python tools/_integrate_shared_vertical_rulers.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: requirements/release.lock
      - name: Verify focused contract
        shell: pwsh
        run: |
          uv venv .venv --python 3.11
          uv pip sync requirements/release.lock --python .venv --require-hashes
          uv pip install --python .venv pytest==9.1.1 ruff==0.15.22
          uv pip install --python .venv --no-deps --no-build-isolation --editable .
          .\.venv\Scripts\python.exe -m compileall -q src/geoworkbench/tablet tests/test_vertical_ruler.py tests/test_tablet_vertical_ruler.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m ruff check src/geoworkbench/tablet/vertical_ruler.py src/geoworkbench/tablet/tablet_view.py tests/test_vertical_ruler.py tests/test_tablet_vertical_ruler.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pytest -q -p no:cacheprovider tests/test_vertical_ruler.py tests/test_tablet_vertical_ruler.py tests/test_grid_geometry.py tests/test_grid_renderer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit verified implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "feat: synchronize inner vertical rulers across tablet tracks"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
