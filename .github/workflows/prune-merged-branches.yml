name: Prune merged temporary branches

on:
  workflow_run:
    workflows: ["Release gate"]
    types: [completed]

permissions:
  contents: read

jobs:
  prune:
    name: Cleanup after green main
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted default branch only
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Check merged PR branches against exact green main SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIED_MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/prune_merged_branches.py
