name: Apply print no-data overlay regression fix

on:
  push:
    branches: [fix/comprehensive-print-gas-time-20260804]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comprehensive-print-gas-time-20260804
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply focused source and test changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one source block, found {count}')
              return text.replace(old, new, 1)

          path = Path('src/geoworkbench/tablet/tablet_view.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '''        self._shared_vertical_ruler_layout: VerticalRulerLayout | None = None\n        self.setObjectName(f"track-{definition.track_id}")\n''',
              '''        self._shared_vertical_ruler_layout: VerticalRulerLayout | None = None\n        self._print_mode = False\n        self._no_numeric_message: pg.TextItem | None = None\n        self.setObjectName(f"track-{definition.track_id}")\n''',
              'track print state',
          )
          text = replace_once(
              text,
              '''        self._dispose_curve_header_editors()\n        targets: list[object | None] = [self.title, self.plot]\n''',
              '''        self._dispose_curve_header_editors()\n        self.clear_no_numeric_message()\n        targets: list[object | None] = [self.title, self.plot]\n''',
              'track disposal',
          )
          text = replace_once(
              text,
              '''    def set_print_mode(self, enabled: bool) -> None:\n        """Render a clean, enlarged curve legend for paper output."""\n\n        enabled = bool(enabled)\n        self._curve_header_row_height = (\n''',
              '''    def set_print_mode(self, enabled: bool) -> None:\n        """Render a clean, enlarged curve legend for paper output.\n\n        The on-screen no-data hint is intentionally omitted from paper output.\n        Its TextItem is positioned in data coordinates; when a continuation page\n        crops the column header, the stale scene position can otherwise appear as\n        a clipped text fragment at the top of the graph body.  The track title\n        already records the no-data state, so suppressing the duplicate hint on\n        paper removes ambiguity without hiding diagnostic information.\n        """\n\n        enabled = bool(enabled)\n        self._print_mode = enabled\n        if self._no_numeric_message is not None:\n            self._no_numeric_message.setVisible(not enabled)\n        self._curve_header_row_height = (\n''',
              'print mode overlay suppression',
          )
          text = replace_once(
              text,
              '''    def update_curve_header_range(\n''',
              '''    def set_no_numeric_message(self, text: str, x: float, y: float) -> None:\n        """Show one centered screen-only hint for a track without finite values."""\n\n        self.clear_no_numeric_message()\n        message = pg.TextItem(\n            text,\n            color="#64748b",\n            anchor=(0.5, 0.5),\n        )\n        message.setPos(float(x), float(y))\n        message.setVisible(not self._print_mode)\n        self.plot.addItem(message)\n        self._no_numeric_message = message\n\n    def clear_no_numeric_message(self) -> None:\n        """Remove the optional no-data hint without disturbing curve geometry."""\n\n        message = self._no_numeric_message\n        self._no_numeric_message = None\n        if message is None:\n            return\n        try:\n            self.plot.removeItem(message)\n        except RuntimeError:\n            # The plot may already be in Qt disposal while a dataset/form refresh\n            # clears presentation state.  Dropping the Python reference remains\n            # sufficient and keeps cleanup idempotent.\n            pass\n\n    def update_curve_header_range(\n''',
              'no-data message helpers',
          )
          text = replace_once(
              text,
              '''            message = pg.TextItem(\n                self._localizer.text("tablet.no_numeric_data_short"),\n                color="#64748b",\n                anchor=(0.5, 0.5),\n            )\n            depth_bounds = self._depth_bounds()\n            center_depth = sum(depth_bounds) / 2.0 if depth_bounds is not None else 0.0\n            message.setPos(0.5, center_depth)\n            track.plot.addItem(message)\n''',
              '''            depth_bounds = self._depth_bounds()\n            center_depth = sum(depth_bounds) / 2.0 if depth_bounds is not None else 0.0\n            track.set_no_numeric_message(\n                self._localizer.text("tablet.no_numeric_data_short"),\n                0.5,\n                center_depth,\n            )\n''',
              'generic no-data message',
          )
          text = replace_once(
              text,
              '''            message = pg.TextItem(\n                self._localizer.text("tablet.no_numeric_data_short"),\n                color="#64748b",\n                anchor=(0.5, 0.5),\n            )\n            bounds = self._depth_bounds()\n            message.setPos(50.0, sum(bounds) / 2.0 if bounds is not None else 0.0)\n            track.plot.addItem(message)\n''',
              '''            bounds = self._depth_bounds()\n            track.set_no_numeric_message(\n                self._localizer.text("tablet.no_numeric_data_short"),\n                50.0,\n                sum(bounds) / 2.0 if bounds is not None else 0.0,\n            )\n''',
              'relative gas no-data message',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src/geoworkbench/services/report_passport.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '''    if np.issubdtype(np.asarray(index.values).dtype, np.datetime64):\n        try:\n            normalized_start = datetime_boundary_text(start)\n            normalized_end = datetime_boundary_text(end)\n''',
              '''    normalized_start: float | str\n    normalized_end: float | str\n    if np.issubdtype(np.asarray(index.values).dtype, np.datetime64):\n        try:\n            normalized_start = datetime_boundary_text(start)\n            normalized_end = datetime_boundary_text(end)\n''',
              'passport boundary typing',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_tablet_view.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'def test_curve_legend_label_includes_unit_only_when_present() -> None:\n'
          test = '''def test_no_numeric_hint_is_screen_only_and_restored_after_print(qapp) -> None:\n    dataset = Dataset(\n        "dataset-no-numeric-print",\n        "No numeric print",\n        DatasetKind.GTI,\n        DepthDomain.MD,\n        np.array([100.0, 101.0]),\n    )\n    curve = CurveData(\n        CurveMetadata(\n            "curve-empty",\n            "EMPTY",\n            "EMPTY",\n            None,\n            "Empty channel",\n            dataset.dataset_id,\n        ),\n        np.array([np.nan, np.nan]),\n    )\n    dataset.curves[curve.metadata.curve_id] = curve\n    view = TabletView(language=AppLanguage.RU)\n    view.set_layout_model(\n        TabletLayout(\n            [\n                TrackDefinition(\n                    "empty",\n                    "Пустой параметр",\n                    TrackKind.CURVE,\n                    curve_mnemonics=["EMPTY"],\n                )\n            ]\n        )\n    )\n    view.set_dataset(dataset)\n    widget = view._rendered["empty"].widget\n    message = widget._no_numeric_message\n\n    assert message is not None\n    assert message.isVisible()\n    assert "нет числовых данных" in widget.title.text()\n\n    widget.set_print_mode(True)\n    assert not message.isVisible()\n\n    widget.set_print_mode(False)\n    assert message.isVisible()\n    view.close()\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('test insertion anchor not unique')
          if 'test_no_numeric_hint_is_screen_only_and_restored_after_print' in text:
              raise SystemExit('regression test already exists')
          path.write_text(text.replace(anchor, test + anchor, 1), encoding='utf-8')
          PY

      - name: Verify syntax and focused contracts
        shell: bash
        run: |
          python -m compileall -q \
            src/geoworkbench/tablet/tablet_view.py \
            src/geoworkbench/services/report_passport.py \
            tests/test_tablet_view.py
          python -m pip install -q numpy pytest
          PYTHONPATH=src pytest -q \
            tests/test_report_definition.py \
            tests/test_report_passport_datetime_bounds.py

      - name: Commit source and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-print-no-data-overlay-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: suppress no-data overlays in printed continuations'
          git push origin HEAD:fix/comprehensive-print-gas-time-20260804
