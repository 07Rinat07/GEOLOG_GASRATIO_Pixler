name: Inspect final print integration points

on:
  push:
    branches:
      - feature/complex-gas-form

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[print-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complex-gas-form
          fetch-depth: 0
      - name: Collect integration points
        shell: bash
        run: |
          mkdir -p tmp
          {
            echo '=== PrintJobStatusDialog references ==='
            grep -R -n --exclude-dir='__pycache__' 'PrintJobStatusDialog' src tests || true
            echo
            echo '=== mark_ready references ==='
            grep -R -n --exclude-dir='__pycache__' '\.mark_ready' src tests || true
            echo
            echo '=== render_to_printer references ==='
            grep -R -n --exclude-dir='__pycache__' 'render_to_printer' src tests || true
            echo
            echo '=== PrintJobExecutor references ==='
            grep -R -n --exclude-dir='__pycache__' 'PrintJobExecutor' src tests || true
            echo
            echo '=== branch head ==='
            git log -5 --oneline --decorate
          } > tmp/final_print_diagnostic.txt
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/final_print_diagnostic.txt
          git commit -m 'ci: record final print integration points [print-diagnostic]'
          git push origin HEAD:feature/complex-gas-form